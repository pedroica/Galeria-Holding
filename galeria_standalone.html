function getAg(r){if(r<=30)return"Galeria";if(r<=80)return"404";if(r<=150)return"Mila";return"Caramelo";}
function getTier(r){if(r<=50)return"Tier A";if(r<=200)return"Tier B";return"Tier C";}
function getTrig(r){if(r<=50)return"A - Porta Aberta";if(r<=200)return"B - Porta Entreaberta";return"C - Nurturing";}

const NEWS  = LEADS.filter(d=>d.cli);

function abS(t){

  if(t==="wp")return{...b,color:"#4ade80",borderColor:"rgba(74,222,128,0.3)"};
  if(t==="li")return{...b,color:"#38bdf8",borderColor:"rgba(56,189,248,0.3)"};

  if(t==="rm")return{...b,color:"#f87171",borderColor:"rgba(248,113,113,0.2)",marginLeft:"auto"};
  return b;
}

function DecCard({dc,isEditing,onToggleEdit,onUpdate,onRemove}){
  return (
    <div style={{background:"#1e293b",borderRadius:10,padding:12,marginBottom:8,border:"1px solid #334155"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
        <div>
          <div style={{fontSize:13,fontWeight:600,color:"#e2e8f0"}}>{dc.nome||"Nome nao informado"}</div>
          <div style={{fontSize:11,color:"#64748b",marginTop:1}}>{dc.cargo||"Cargo nao informado"}</div>
        </div>
        <button style={abS("ed")} onClick={onToggleEdit}>{isEditing?"Fechar":"Editar"}</button>
      </div>
      {isEditing&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          {[["nome","Nome"],["cargo","Cargo"],["email","Email"],["tel","WhatsApp"],["li","linkedin.com/in/..."]].map(([f,pl],fi)=>(
            <input key={f} style={{...S.dinp,...(fi===4?{gridColumn:"1/-1"}:{})}} placeholder={pl} value={dc[f]||""} onChange={e=>onUpdate(f,e.target.value)}/>
          ))}
        </div>
      )}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
        {dc.email?<a style={abS("em")} href={"mailto:"+dc.email}>Email</a>:<span style={{...abS("em"),opacity:.3,cursor:"default"}}>Email</span>}
        {dc.tel?<a style={abS("wp")} href={"https://wa.me/"+dc.tel.replace(/\D/g,"")}>WhatsApp</a>:<span style={{...abS("wp"),opacity:.3,cursor:"default"}}>WhatsApp</span>}
        {dc.li?<a style={abS("li")} href={dc.li.startsWith("http")?dc.li:"https://"+dc.li}>LinkedIn DM</a>:<span style={{...abS("li"),opacity:.3,cursor:"default"}}>LinkedIn DM</span>}
        <button style={abS("rm")} onClick={onRemove}>Remover</button>
      </div>
    </div>
  );
}

function App(){
  const [aba,setAba]=useState("p");
  const [busca,setBusca]=useState("");
  const [agFil,setAgFil]=useState("Todas");
  const [tierFil,setTierFil]=useState("Todos");
  const [sel,setSel]=useState({});
  const [exp,setExp]=useState({});
  const [expd,setExpd]=useState({});
  const [decs,setDecs]=useState({});
  const [exported,setExported]=useState(false);
  const [enrichOpen,setEnrichOpen]=useState({});

  const base=aba==="p"?PROSP:NEWS;
  const lista=useMemo(()=>base.filter(d=>{
    if(aba==="p"&&agFil!=="Todas"&&d.ag!==agFil)return false;
    if(aba==="p"&&tierFil!=="Todos"&&d.tier!==tierFil)return false;
    if(busca&&!d.nome.includes(busca.toUpperCase()))return false;
    return true;
  }),[base,agFil,tierFil,busca]);

  const nSel=Object.values(sel).filter(Boolean).length;
  const nDec=Object.keys(decs).filter(k=>decs[k]&&decs[k].length>0).length;
  const nA=PROSP.filter(d=>d.tier==="Tier A").length;

  const togSel=r=>setSel(s=>({...s,[r]:!s[r]}));
  const selAll=()=>{const ns={};lista.forEach(d=>{ns[d.rank]=true;});setSel(ns);};
  const selNone=()=>setSel({});
  const togExp=r=>{setExp(e=>({...e,[r]:!e[r]}));setDecs(dd=>dd[r]?dd:{...dd,[r]:[]});};
  const togEd=k=>setExpd(e=>({...e,[k]:!e[k]}));
  const addDec=r=>{setDecs(dd=>({...dd,[r]:[...(dd[r]||[]),{nome:"",cargo:"",email:"",tel:"",li:""}]}));setExp(e=>({...e,[r]:true}));};
  const updDec=(r,i,f,v)=>setDecs(dd=>{const a=[...(dd[r]||[])];a[i]={...a[i],[f]:v};return{...dd,[r]:a};});
  const rmDec=(r,i)=>setDecs(dd=>{const a=[...(dd[r]||[])];a.splice(i,1);return{...dd,[r]:a};});
  const enrich=(r,nome)=>{
    const domain=getDomain(nome)||"dominio.com.br";
    setExp(e=>({...e,[r]:true}));
    setEnrichOpen(e=>({...e,[r]:{show:true,nome,domain}}));
  };

  const exportar=()=>{
    const para=nSel>0?lista.filter(d=>sel[d.rank]):lista;
    const q=v=>String(v||"").replace(/,/g," ");
    const rows=["ranking,empresa,agencia,tier,trigger,decisor_nome,decisor_cargo,email,telefone,linkedin"];
    para.forEach(d=>{
      const dd=decs[d.rank]||[];
      if(!dd.length)rows.push([d.rank,q(d.nome),q(d.ag),q(d.tier),q(d.trig),"","","","",""].join(","));
      else dd.forEach(dc=>rows.push([d.rank,q(d.nome),q(d.ag),q(d.tier),q(d.trig),q(dc.nome),q(dc.cargo),q(dc.email),q(dc.tel),q(dc.li)].join(",")));
    });
    const blob=new Blob(["\uFEFF"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="galeria_decisores.csv";a.click();
    setExported(true);setTimeout(()=>setExported(false),2500);
  };

  return (
    <div style={{maxWidth:740,margin:"0 auto"}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <div style={{width:40,height:40,borderRadius:10,background:"#f97316",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:18,flexShrink:0}}>G</div>
        <div>
          <div style={{fontWeight:700,fontSize:16}}>Galeria Holding</div>
          <div style={{fontSize:12,color:"#6b7280"}}>Base qualificada | Decisores + omnicanal</div>
        </div>
      </div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:16}}>
        {[[PROSP.length,"Prospeccao","#fb923c"],[NEWS.length,"Newsletter","#facc15"],[nDec,"Com decisores","#4ade80"],[nA,"Tier A","#fb923c"]].map(([v,l,c])=>(
          <div key={l} style={{background:"#111827",borderRadius:12,padding:"12px 8px",textAlign:"center"}}>
            <div style={{fontSize:20,fontWeight:700,color:c}}>{v}</div>
            <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{l}</div>
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
        {[["p","Prospeccao ("+PROSP.length+")","Blitz omnicanal"],["n","Newsletter ("+NEWS.length+")","Clientes da holding"]].map(([id,tt,ts])=>(
          <button key={id} style={{padding:12,borderRadius:12,border:"1px solid "+(aba===id?"#f97316":"#374151"),background:aba===id?"rgba(249,115,22,0.1)":"#111827",cursor:"pointer",textAlign:"left",color:"#fff",width:"100%"}} onClick={()=>{setAba(id);setSel({});setExp({});}}>
            <div style={{fontSize:13,fontWeight:600}}>{tt}</div>
            <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{ts}</div>
          </button>
        ))}
      </div>

      {/* Filtros */}
      <div style={{background:"#111827",borderRadius:16,padding:16,marginBottom:12}}>
        <input style={S.inp} placeholder="Buscar empresa..." value={busca} onChange={e=>setBusca(e.target.value)}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,margin:"10px 0"}}>
          <div>
            <div style={{fontSize:11,color:"#9ca3af",marginBottom:4}}>Agencia</div>
            <select style={S.inp} value={agFil} onChange={e=>setAgFil(e.target.value)}>
              {["Todas","Galeria","404","Mila","Caramelo"].map(o=><option key={o}>{o}</option>)}
            </select>
          </div>
          <div>
            <div style={{fontSize:11,color:"#9ca3af",marginBottom:4}}>Prioridade</div>
            <select style={S.inp} value={tierFil} onChange={e=>setTierFil(e.target.value)}>
              {["Todos","Tier A","Tier B","Tier C"].map(o=><option key={o}>{o}</option>)}
            </select>
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginTop:10}}>
          <button style={S.btn} onClick={selAll}>Sel. todos</button>
          <button style={S.btn} onClick={selNone}>Limpar</button>
          {nSel>0&&<span style={{fontSize:12,color:"#fb923c",fontWeight:700}}>{nSel} selecionados</span>}
          <button style={{padding:"9px 18px",borderRadius:10,border:"none",background:exported?"#16a34a":"#f97316",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",marginLeft:"auto"}} onClick={exportar}>
            {exported?"Baixado!":"Exportar CSV ("+(nSel>0?nSel:lista.length)+")"}
          </button>
        </div>
      </div>

      {/* Lista */}
      <div style={{maxHeight:600,overflowY:"auto"}}>
        {lista.slice(0,300).map(d=>{
          const r=d.rank,isSel=!!sel[r],isEx=!!exp[r],dd=decs[r]||[],hd=dd.length>0;
          const eOpen=enrichOpen[r]&&enrichOpen[r].show;
          return (
            <div key={r} style={{borderRadius:12,marginBottom:5,background:"#111827",border:"1px solid "+(isSel?"rgba(249,115,22,0.4)":"transparent"),overflow:"hidden"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px"}}>
                <div onClick={()=>togSel(r)} style={{width:16,height:16,borderRadius:4,border:"2px solid "+(isSel?"#f97316":"#4b5563"),background:isSel?"#f97316":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer",fontSize:10,color:"#fff"}}>{isSel?"v":""}</div>
                <span style={{fontSize:11,color:"#4b5563",width:28,textAlign:"right",flexShrink:0}}>#{r}</span>
                <span onClick={()=>togSel(r)} style={{fontSize:13,fontWeight:500,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",cursor:"pointer"}}>{d.nome}</span>
                {aba==="p"?<span style={{fontSize:11,fontWeight:600,flexShrink:0,color:agC[d.ag]||"#9ca3af"}}>{d.ag}</span>:<span style={{fontSize:11,fontWeight:600,flexShrink:0,color:"#facc15"}}>Radar</span>}
                <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,flexShrink:0,background:aba==="n"?"rgba(161,98,7,.5)":tBg[d.tier],color:aba==="n"?"#fde047":tCr[d.tier]}}>{aba==="n"?"Cliente":d.tier}</span>
                <button style={{padding:"4px 10px",borderRadius:6,border:"none",background:hd?"rgba(249,115,22,0.15)":"#1f2937",color:hd?"#fb923c":"#9ca3af",fontSize:11,cursor:"pointer"}} onClick={()=>togExp(r)}>{hd?"Decisores ("+dd.length+")":"+ Decisores"}</button>
                <button onClick={()=>enrich(r,d.nome)} style={{padding:"4px 10px",borderRadius:6,border:"none",background:eOpen?"rgba(96,165,250,0.25)":"rgba(96,165,250,0.1)",color:"#60a5fa",fontSize:11,cursor:"pointer",flexShrink:0}}>Enriquecer</button>
              </div>

              {(isEx||eOpen)&&(
                <div style={{background:"#0f172a",borderTop:"1px solid #1e293b",padding:14}}>
                  {eOpen&&(
                    <div style={{background:"#111827",border:"1px solid #1e40af",borderRadius:10,padding:12,marginBottom:12}}>
                      <div style={{fontSize:12,fontWeight:600,color:"#60a5fa",marginBottom:8}}>Enriquecer — {d.nome}</div>
                      <div style={{fontSize:11,color:"#64748b",marginBottom:10}}>Clique para abrir cada ferramenta. Depois use + Adicionar para cadastrar os contatos.</div>
                      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
                        <a href={"https://app.hunter.io/domain-search?domain="+enrichOpen[r].domain} target="_blank" style={{padding:"7px 12px",borderRadius:8,background:"rgba(96,165,250,0.15)",color:"#60a5fa",border:"1px solid rgba(96,165,250,0.3)",fontSize:11,fontWeight:600,textDecoration:"none"}}>Emails no Hunter.io</a>
                        <a href={"https://app.lusha.com/search?company="+encodeURIComponent(d.nome)} target="_blank" style={{padding:"7px 12px",borderRadius:8,background:"rgba(74,222,128,0.15)",color:"#4ade80",border:"1px solid rgba(74,222,128,0.3)",fontSize:11,fontWeight:600,textDecoration:"none"}}>Telefones no Lusha</a>
                        <a href={"https://www.linkedin.com/search/results/people/?keywords="+encodeURIComponent(d.nome)+"&titleFreeText=CMO+OR+Diretor+de+Marketing+OR+VP+Marketing"} target="_blank" style={{padding:"7px 12px",borderRadius:8,background:"rgba(56,189,248,0.15)",color:"#38bdf8",border:"1px solid rgba(56,189,248,0.3)",fontSize:11,fontWeight:600,textDecoration:"none"}}>Decisores no LinkedIn</a>
                        <button onClick={()=>setEnrichOpen(e=>({...e,[r]:{show:false}}))} style={{padding:"7px 12px",borderRadius:8,background:"#1f2937",color:"#6b7280",border:"none",fontSize:11,cursor:"pointer"}}>Fechar</button>
                      </div>
                      <div style={{fontSize:10,color:"#374151"}}>Dominio detectado: {enrichOpen[r].domain}</div>
                    </div>
                  )}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                    <span style={{fontSize:12,fontWeight:600,color:"#94a3b8"}}>Decisores — {d.nome}</span>
                    <button style={{padding:"5px 12px",borderRadius:7,border:"none",background:"#f97316",color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer"}} onClick={()=>addDec(r)}>+ Adicionar</button>
                  </div>
                  {!dd.length?<div style={{textAlign:"center",padding:16,fontSize:12,color:"#475569"}}>Clique em Enriquecer ou + Adicionar.</div>
                    :dd.map((dc,i)=>(
                      <DecCard key={i} dc={dc} isEditing={!!expd[r+"-"+i]}
                        onToggleEdit={()=>togEd(r+"-"+i)}
                        onUpdate={(f,v)=>updDec(r,i,f,v)}
                        onRemove={()=>rmDec(r,i)}/>
                    ))
                  }
                </div>
              )}
            </div>
          );
        })}
        {lista.length>300&&<div style={{textAlign:"center",fontSize:12,color:"#4b5563",padding:10}}>+{lista.length-300} resultados</div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
