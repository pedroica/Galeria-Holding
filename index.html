<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeria Holding — Central Comercial</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Syne',sans-serif;background:#060606;color:#eee;min-height:100vh;overflow:hidden;display:flex;flex-direction:column}
input,select,button,textarea{font-family:inherit}
a{text-decoration:none}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
.topbar{display:flex;align-items:stretch;background:#0a0a0a;border-bottom:1px solid #181818;height:50px;flex-shrink:0;overflow-x:auto}
.brand{display:flex;align-items:center;gap:9px;padding:0 18px;border-right:1px solid #181818;flex-shrink:0}
.bdot{width:7px;height:7px;border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.bname{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;white-space:nowrap}
.tabs-row{display:flex;align-items:stretch;flex:1}
.ctab{display:flex;align-items:center;gap:7px;padding:0 15px;border-right:1px solid #181818;cursor:pointer;transition:all .15s;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.ctab:hover{background:rgba(255,255,255,.025)}
.ctab.on{border-bottom-color:var(--tc)}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--tc)}
.tname{font-size:10px;font-family:'DM Mono',monospace;letter-spacing:.5px;color:#555}
.ctab.on .tname{color:var(--tc)}
.tb-right{display:flex;align-items:center;gap:10px;padding:0 14px;border-left:1px solid #181818;flex-shrink:0}
.api-chip{display:flex;align-items:center;gap:4px;font-size:9px;font-family:'DM Mono',monospace;color:#333;letter-spacing:.5px}
.apdot{width:5px;height:5px;border-radius:50%}
.cfgbtn{padding:4px 10px;border:1px solid #1e1e1e;border-radius:3px;background:transparent;color:#444;font-size:9px;font-family:'DM Mono',monospace;cursor:pointer;letter-spacing:.5px}
.cfgbtn:hover{border-color:#555;color:#aaa}
.resbtn{padding:4px 10px;border:1px solid rgba(255,71,87,.3);border-radius:3px;background:rgba(255,71,87,.06);color:#FF4757;font-size:9px;font-family:'DM Mono',monospace;cursor:pointer;letter-spacing:.5px}
.resbtn:hover{background:rgba(255,71,87,.12)}
.ws{display:flex;flex:1;overflow:hidden}
.sb{width:295px;flex-shrink:0;border-right:1px solid #181818;display:flex;flex-direction:column;background:#080808}
.sbhead{padding:11px 14px;border-bottom:1px solid #181818;display:flex;align-items:center;justify-content:space-between}
.sbtitle{font-size:9px;font-family:'DM Mono',monospace;color:#333;letter-spacing:2px;text-transform:uppercase}
.sbcnt{font-size:9px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:100px;border:1px solid var(--tc);color:var(--tc)}
.sbsearch{padding:8px 12px;border-bottom:1px solid #181818}
.sbsearch input{width:100%;background:#060606;border:1px solid #1a1a1a;border-radius:3px;padding:6px 9px;color:#eee;font-family:'DM Mono',monospace;font-size:10px;outline:none}
.sbsearch input:focus{border-color:var(--tc)}
.sbsearch input::placeholder{color:#252525}
.sbfil{display:flex;gap:4px;padding:6px 12px;border-bottom:1px solid #181818;flex-wrap:wrap}
.fb{padding:3px 8px;border-radius:3px;border:1px solid #1a1a1a;background:transparent;color:#333;font-size:8px;font-family:'DM Mono',monospace;cursor:pointer;letter-spacing:.5px}
.fb.on{border-color:var(--tc);color:var(--tc)}
.fb.res{border-color:rgba(255,71,87,.3);color:#FF4757}
.fb.res.on{background:rgba(255,71,87,.08)}
.sblist{flex:1;overflow-y:auto}
.coitem{padding:10px 12px;border-bottom:1px solid #111;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .1s}
.coitem:hover{background:rgba(255,255,255,.018)}
.coitem.sel{border-left:2px solid var(--tc);background:rgba(255,255,255,.02)}
.coitem.restricted{border-left:2px solid rgba(255,71,87,.4);background:rgba(255,71,87,.025)}
.corank{font-family:'DM Mono',monospace;font-size:8px;color:#2a2a2a;min-width:24px;text-align:right}
.cobody{flex:1;min-width:0}
.coname{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cosec{font-size:8px;font-family:'DM Mono',monospace;color:#333;margin-top:1px}
.fittag{font-size:7px;font-family:'DM Mono',monospace;padding:2px 5px;border-radius:100px;white-space:nowrap}
.restag{font-size:7px;font-family:'DM Mono',monospace;padding:2px 6px;border-radius:100px;white-space:nowrap;background:rgba(255,71,87,.1);color:#FF4757;border:1px solid rgba(255,71,87,.25)}
.crmdot{width:5px;height:5px;border-radius:50%;background:#4B9EFF;flex-shrink:0}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.subtabs{display:flex;border-bottom:1px solid #181818;background:#080808;flex-shrink:0}
.st{padding:10px 16px;font-size:9px;font-family:'DM Mono',monospace;color:#333;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.5px;transition:all .15s}
.st:hover{color:#888}
.st.on{color:var(--tc);border-bottom-color:var(--tc)}
.panel{flex:1;overflow-y:auto;padding:22px 26px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:#0e0e0e;border:1px solid #181818;border-radius:5px;padding:14px}
.clbl{font-size:8px;font-family:'DM Mono',monospace;color:#333;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.cval{font-size:14px;font-weight:700}
.csub{font-size:9px;font-family:'DM Mono',monospace;color:#333;margin-top:3px}
.sec{font-size:8px;font-family:'DM Mono',monospace;color:#2a2a2a;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:#181818}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.tag{font-size:9px;font-family:'DM Mono',monospace;padding:3px 8px;border-radius:3px;background:#0e0e0e;border:1px solid #181818;color:#333}
.taghl{border-color:rgba(var(--tcr),.25);color:var(--tc);background:rgba(var(--tcr),.05)}
.btn{padding:7px 13px;border-radius:3px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.3px}
.btnp{color:#000;border:none}
.btno{background:transparent;color:#888;border:1px solid #222}
.btno:hover{border-color:var(--tc);color:var(--tc)}
.btnsm{padding:5px 9px;font-size:9px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.deccard{background:#0e0e0e;border:1px solid #181818;border-radius:5px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:7px}
.decav{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;border:1px solid #1e1e1e}
.decinfo{flex:1;min-width:0}
.decname{font-size:11px;font-weight:700}
.deccargo{font-size:9px;font-family:'DM Mono',monospace;color:#444;margin-top:1px}
.dectags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.dt{font-size:8px;font-family:'DM Mono',monospace;padding:1px 6px;border-radius:2px;background:#111;border:1px solid #1a1a1a;color:#333}
.dtok{color:var(--tc);border-color:rgba(var(--tcr),.2)}
.decacts{display:flex;gap:4px;flex-wrap:wrap}
.feeditem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #111}
.fiicon{width:26px;height:26px;border-radius:50%;background:#0e0e0e;border:1px solid #181818;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.fibody{flex:1}
.fititle{font-size:11px;font-weight:600;margin-bottom:2px}
.fimeta{font-size:8px;font-family:'DM Mono',monospace;color:#333}
.finote{font-size:10px;color:#444;margin-top:4px;font-family:'DM Mono',monospace;border-left:2px solid #181818;padding-left:7px;line-height:1.5}
.aiout{background:#0e0e0e;border:1px solid rgba(var(--tcr),.15);border-radius:5px;padding:15px;margin-bottom:14px;font-size:11px;font-family:'DM Mono',monospace;line-height:1.8;color:#888}
.monitem{background:#0e0e0e;border:1px solid #181818;border-radius:5px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.monbody{flex:1}.montitle{font-size:11px;font-weight:700;margin-bottom:3px}
.mondesc{font-size:10px;font-family:'DM Mono',monospace;color:#444;line-height:1.5}
.montime{font-size:8px;font-family:'DM Mono',monospace;color:#2a2a2a;margin-top:4px}
.monbadge{font-size:7px;font-family:'DM Mono',monospace;padding:2px 6px;border-radius:100px;flex-shrink:0;letter-spacing:.5px}
.frow{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.flbl{font-size:8px;font-family:'DM Mono',monospace;color:#333;letter-spacing:1px;text-transform:uppercase}
.finp{background:#060606;border:1px solid #1a1a1a;border-radius:3px;padding:7px 9px;color:#eee;font-family:'DM Mono',monospace;font-size:10px;outline:none;width:100%}
.finp:focus{border-color:var(--tc)}
.finp::placeholder{color:#222}
textarea.finp{resize:vertical;min-height:70px;line-height:1.6}
select.finp{cursor:pointer}
.modov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.mod{background:#0e0e0e;border:1px solid #222;border-radius:7px;width:100%;max-width:480px;max-height:86vh;overflow-y:auto;padding:22px}
.mod-wide{max-width:680px}
.modtitle{font-size:15px;font-weight:800;margin-bottom:16px;letter-spacing:-.5px}
.modacts{display:flex;gap:7px;margin-top:16px;justify-content:flex-end}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;opacity:.2;text-align:center}
.emptyicon{font-size:44px}
.lbar{height:1px;background:#181818;overflow:hidden;margin:5px 0}
.lfill{height:100%;background:var(--tc);animation:la 1.4s ease-in-out infinite}
@keyframes la{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
.stxt{font-size:9px;font-family:'DM Mono',monospace;color:var(--tc);padding:4px 0}
.accname{font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1}
.accmeta{font-size:9px;font-family:'DM Mono',monospace;color:#333;margin-top:5px}
.acctop{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.angtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.angtab{padding:4px 9px;border-radius:3px;border:1px solid #1a1a1a;background:transparent;color:#333;font-size:8px;font-family:'DM Mono',monospace;cursor:pointer;letter-spacing:.5px}
.angtab.on{border-color:var(--tc);color:var(--tc)}

/* RESTRICTION BANNER */
.res-banner{background:rgba(255,71,87,.06);border:1px solid rgba(255,71,87,.25);border-radius:5px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.res-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.res-body{flex:1}
.res-title{font-size:11px;font-weight:700;color:#FF4757;margin-bottom:4px}
.res-desc{font-size:10px;font-family:'DM Mono',monospace;color:#884040;line-height:1.6}
.res-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rtag{font-size:8px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:100px;background:rgba(255,71,87,.1);color:#FF4757;border:1px solid rgba(255,71,87,.2)}

/* RESTRICTION PANEL */
.res-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #111;border-radius:4px;margin-bottom:4px;background:#0c0c0c}
.res-co{font-size:11px;font-weight:700;flex:1}
.res-reason{font-size:9px;font-family:'DM Mono',monospace;color:#444;flex:2}
.res-agency{font-size:8px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:100px}

/* REMINDER BANNER */
.reminder{background:rgba(255,181,71,.05);border:1px solid rgba(255,181,71,.25);border-radius:5px;padding:12px 16px;margin-bottom:0;display:flex;align-items:center;gap:12px;flex-shrink:0}
.reminder-txt{flex:1;font-size:11px;color:#FFB547;font-family:'DM Mono',monospace}
.reminder-btn{padding:5px 12px;border-radius:3px;border:1px solid rgba(255,181,71,.4);background:transparent;color:#FFB547;font-size:9px;font-family:'DM Mono',monospace;cursor:pointer;white-space:nowrap}
/* ADD COMPANY MODAL */
.addco-modal{background:#0e0e0e;border:1px solid #222;border-radius:8px;width:100%;max-width:420px;padding:22px}
.addco-badge{font-size:8px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:100px;background:rgba(0,255,148,.08);color:#00FF94;border:1px solid rgba(0,255,148,.2);white-space:nowrap}
/* ENRICH AGENT */
.enrich-box{background:#0a0a0a;border:1px solid rgba(167,139,250,.2);border-radius:8px;padding:14px;margin-bottom:14px}
.enrich-step{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #111}
.enrich-step:last-child{border-bottom:none}
.enrich-num{width:20px;height:20px;border-radius:50%;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);display:flex;align-items:center;justify-content:center;font-size:9px;color:#A78BFA;font-weight:700;flex-shrink:0;margin-top:2px}
.enrich-body{flex:1}
.wa-hist-badge{display:inline-flex;align-items:center;gap:3px;font-size:8px;font-family:'DM Mono',monospace;padding:1px 6px;border-radius:100px;background:rgba(37,211,102,.1);color:#25D366;border:1px solid rgba(37,211,102,.2)}

/* ── KANBAN SCROLLBAR INSIDE VIEW ── */
.kb-board-scroll::-webkit-scrollbar{height:4px}
.kb-board-scroll::-webkit-scrollbar-thumb{background:#222;border-radius:2px}


/* ═══ MELHORIA 5 — REDESIGN GALERIA HOLDING ═══ */
:root{
  --gh-orange:#FF6B2B;
  --gh-black:#0D0D0D;
  --gh-dark:#1A1A2E;
  --gh-mid:#2D2D44;
  --gh-white:#F5F5F5;
  --gh-muted:#9B9BB4;
  --gh-green:#1D9E75;
  --gh-red:#E24B4A;
  --gh-yellow:#EF9F27;
}
body{font-family:'Inter',sans-serif!important;background:var(--gh-black)!important}
input,select,button,textarea{font-family:'Inter',sans-serif!important}
.topbar{background:var(--gh-black)!important;border-bottom:1px solid var(--gh-mid)!important;height:52px!important}
.brand{border-right:1px solid var(--gh-mid)!important}
.bname{font-family:'IBM Plex Mono',monospace!important;color:var(--gh-white)!important;letter-spacing:2px!important}
.bdot{background:var(--gh-orange)!important;animation:none!important;width:8px!important;height:8px!important;border-radius:2px!important}
.ctab{border-right:1px solid var(--gh-mid)!important}
.ctab:hover{background:rgba(255,107,43,.04)!important}
.tb-right{border-left:1px solid var(--gh-mid)!important}
.sb{background:#0f0f1a!important;border-right:1px solid var(--gh-mid)!important}
.sbhead{border-bottom:1px solid var(--gh-mid)!important}
.sbtitle{font-family:'IBM Plex Mono',monospace!important;color:var(--gh-muted)!important}
.sbsearch input{background:var(--gh-dark)!important;border:1px solid var(--gh-mid)!important;color:var(--gh-white)!important;font-family:'IBM Plex Mono',monospace!important}
.sbsearch input:focus{border-color:var(--gh-orange)!important}
.coitem:hover{background:rgba(255,107,43,.04)!important}
.coitem.sel{border-left:2px solid var(--gh-orange)!important;background:rgba(255,107,43,.06)!important}
.coname{font-family:'Inter',sans-serif!important;font-size:11px!important}
.cosec{font-family:'IBM Plex Mono',monospace!important;color:var(--gh-muted)!important}
.card{background:var(--gh-dark)!important;border:1px solid var(--gh-mid)!important;border-radius:6px!important}
.card:hover{border-color:var(--gh-orange)!important}
.btn.btnp{background:var(--gh-orange)!important;color:#fff!important;border:none!important;border-radius:4px!important}
.btn.btnp:hover{background:#e55a1f!important}
.btn.btno{border:1px solid var(--gh-mid)!important;color:var(--gh-muted)!important;background:transparent!important;border-radius:4px!important}
.btn.btno:hover{border-color:var(--gh-orange)!important;color:var(--gh-orange)!important}
.modov{background:rgba(0,0,0,.95)!important}
.mod{background:var(--gh-dark)!important;border:1px solid var(--gh-mid)!important;border-radius:8px!important}
.modtitle{font-family:'Inter',sans-serif!important;letter-spacing:-.3px!important}
.finp{background:var(--gh-black)!important;border:1px solid var(--gh-mid)!important;color:var(--gh-white)!important;font-family:'IBM Plex Mono',monospace!important;border-radius:4px!important}
.finp:focus{border-color:var(--gh-orange)!important}
.sec{font-family:'IBM Plex Mono',monospace!important;color:var(--gh-muted)!important}
.sec::after{background:var(--gh-mid)!important}
.subtabs{background:#0f0f1a!important;border-bottom:1px solid var(--gh-mid)!important}
.st{font-family:'IBM Plex Mono',monospace!important}
.st.on{color:var(--gh-orange)!important;border-bottom-color:var(--gh-orange)!important}
.panel{background:var(--gh-black)!important}
.deccard{background:var(--gh-dark)!important;border:1px solid var(--gh-mid)!important;border-radius:6px!important}
.cfgbtn{border:1px solid var(--gh-mid)!important;color:var(--gh-muted)!important}
.cfgbtn:hover{border-color:var(--gh-orange)!important;color:var(--gh-orange)!important}
.resbtn{border-color:rgba(226,75,74,.4)!important;color:var(--gh-red)!important}
.angtab{border:1px solid var(--gh-mid)!important;color:var(--gh-muted)!important;font-family:'IBM Plex Mono',monospace!important}
.angtab.on{border-color:var(--gh-orange)!important;color:var(--gh-orange)!important}
.aiout{background:var(--gh-dark)!important;border:1px solid rgba(255,107,43,.2)!important;font-family:'IBM Plex Mono',monospace!important;color:var(--gh-muted)!important}
.tag{font-family:'IBM Plex Mono',monospace!important;background:var(--gh-mid)!important;color:var(--gh-muted)!important;border:none!important}
.taghl{background:rgba(255,107,43,.08)!important;color:var(--gh-orange)!important}
.feeditem{border-bottom:1px solid var(--gh-mid)!important}
.fiicon{background:var(--gh-dark)!important;border:1px solid var(--gh-mid)!important}
.fititle{font-family:'Inter',sans-serif!important}
.fimeta{font-family:'IBM Plex Mono',monospace!important;color:var(--gh-muted)!important}
.finote{font-family:'IBM Plex Mono',monospace!important;border-left:2px solid var(--gh-orange)!important;color:var(--gh-muted)!important}

/* ═══ FIGURINHAS ═══ */
.fig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:16px 0}
.fig-card{background:var(--gh-dark);border-radius:8px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.fig-card.verified{border:1.5px solid var(--gh-orange);box-shadow:0 0 12px rgba(255,107,43,.15)}
.fig-card.suggested{border:1.5px dashed var(--gh-mid)}
.fig-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.fig-card.verified:hover{box-shadow:0 6px 20px rgba(255,107,43,.25)}
.fig-avatar{width:100%;height:80px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;font-family:'Inter',sans-serif;letter-spacing:-1px}
.fig-body{padding:10px;background:var(--gh-dark)}
.fig-name{font-size:11px;font-weight:700;color:var(--gh-white);line-height:1.3;margin-bottom:3px}
.fig-cargo{font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--gh-muted);line-height:1.4}
.fig-badge{position:absolute;top:7px;right:7px;font-size:8px;font-family:'IBM Plex Mono',monospace;padding:2px 6px;border-radius:100px}
.fig-badge.v{background:rgba(29,158,117,.15);color:var(--gh-green);border:1px solid rgba(29,158,117,.3)}
.fig-badge.s{background:rgba(155,155,180,.08);color:var(--gh-muted);border:1px solid rgba(155,155,180,.2)}
.fig-actions{display:flex;gap:4px;padding:8px 10px;background:#111827;border-top:1px solid var(--gh-mid)}

.ka-col-head{font-size:9px;font-family:'IBM Plex Mono',monospace;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:0 4px 8px;border-bottom:2px solid var(--gh-orange);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.ka-card{background:var(--gh-dark);border:1px solid var(--gh-mid);border-radius:6px;padding:9px;margin-bottom:6px;cursor:pointer;transition:border-color .12s}
.ka-card:hover{border-color:var(--gh-orange)}
.ka-card-name{font-size:11px;font-weight:600;color:var(--gh-white);margin-bottom:2px}
.ka-card-cargo{font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--gh-muted)}
.ka-card-meta{font-size:8px;font-family:'IBM Plex Mono',monospace;color:#444;margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ka-canal-badge{font-size:8px;font-family:'IBM Plex Mono',monospace;padding:1px 6px;border-radius:100px}
.ka-progress-bar{height:6px;background:var(--gh-mid);border-radius:3px;overflow:hidden;margin:6px 0}
.ka-progress-fill{height:100%;background:var(--gh-orange);border-radius:3px;transition:width .3s}
.ka-week-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-week-label{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--gh-white);flex:1;text-align:center}

/* ═══ LLM BOX ═══ */
.llm-wrap{display:flex;flex-direction:column;height:100%;background:var(--gh-black)}
.llm-history{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.llm-q{background:rgba(255,107,43,.08);border:1px solid rgba(255,107,43,.2);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--gh-white);border-left:3px solid var(--gh-orange)}
.llm-a{background:var(--gh-dark);border:1px solid var(--gh-mid);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--gh-muted);font-family:'IBM Plex Mono',monospace;line-height:1.7;white-space:pre-wrap}
.llm-input-row{display:flex;gap:8px;padding:16px;border-top:1px solid var(--gh-mid);background:#0f0f1a;flex-shrink:0}
.llm-input-row input{flex:1;background:var(--gh-dark);border:1px solid var(--gh-mid);border-radius:6px;padding:10px 14px;color:var(--gh-white);font-size:13px;font-family:'Inter',sans-serif;outline:none}
.llm-input-row input:focus{border-color:var(--gh-orange)}
.llm-chip{font-size:10px;font-family:'IBM Plex Mono',monospace;padding:5px 10px;border-radius:100px;background:var(--gh-mid);color:var(--gh-muted);cursor:pointer;white-space:nowrap;transition:all .15s;border:1px solid transparent}
.llm-chip:hover{background:rgba(255,107,43,.12);color:var(--gh-orange);border-color:rgba(255,107,43,.3)}
.llm-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}

/* ═══ ALERTAS CMO ═══ */
.alert-wrap{display:flex;flex-direction:column;height:100%;background:var(--gh-black)}
.alert-header{padding:16px 20px;border-bottom:1px solid var(--gh-mid);display:flex;align-items:center;gap:10px;flex-shrink:0}
.alert-card{background:var(--gh-dark);border:1px solid var(--gh-mid);border-radius:8px;border-left:3px solid var(--gh-orange);padding:14px;margin-bottom:10px;transition:border-color .15s}
.alert-card:hover{border-color:var(--gh-orange);box-shadow:0 0 0 1px rgba(255,107,43,.1)}
.alert-name{font-size:13px;font-weight:700;color:var(--gh-white);margin-bottom:3px}
.alert-cargo{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--gh-orange);margin-bottom:6px}
.alert-empresa{font-size:11px;color:var(--gh-muted);margin-bottom:8px}
.alert-source{font-size:9px;font-family:'IBM Plex Mono',monospace;color:#444;display:flex;align-items:center;gap:6px}
.alert-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.alert-date-group{margin-bottom:20px}
.alert-date-label{font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--gh-muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--gh-mid)}
.alert-today-badge{font-size:8px;font-family:'IBM Plex Mono',monospace;padding:1px 7px;border-radius:100px;background:rgba(255,107,43,.15);color:var(--gh-orange);border:1px solid rgba(255,107,43,.3);margin-left:8px}

/* SCORE BADGE */
.score-badge{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:500;flex-shrink:0}
.score-urgent{background:rgba(226,75,74,.15);color:#E24B4A;border:1.5px solid #E24B4A}
.score-high{background:rgba(239,159,39,.15);color:#EF9F27;border:1.5px solid #EF9F27}
.score-mid{background:rgba(255,107,43,.15);color:#FF6B2B;border:1.5px solid #FF6B2B}
.score-low{background:rgba(155,155,180,.1);color:#9B9BB4;border:1.5px solid #2D2D44}

/* EMPRESA CARD V2 */
.emp-card{background:#1A1A2E;border-radius:12px;padding:14px;cursor:pointer;transition:border-color .2s,transform .15s;position:relative;overflow:hidden}
.emp-card:hover{border-color:#FF6B2B!important;transform:translateY(-1px)}
.emp-card-0{border:.5px dashed #E24B4A}
.emp-card-1{border:.5px dashed #EF9F27}
.emp-card-5{border:.5px solid #1D9E75}

.fig2-card{background:#1A1A2E;border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s}
.fig2-card.verified{border:1px solid #FF6B2B;box-shadow:0 0 16px rgba(255,107,43,.12)}
.fig2-card.suggested{border:1px dashed #2D2D44}
.fig2-card:hover{transform:translateY(-2px)}
.fig2-avatar{width:100%;height:72px;display:flex;align-items:center;justify-content:center;font-size:24px;font-family:'Inter',sans-serif;font-weight:500}

.fig2-cargo{font-size:9px;font-family:'IBM Plex Mono',monospace;color:#9B9BB4;line-height:1.4}
.fig2-badge{font-size:8px;font-family:'IBM Plex Mono',monospace;padding:2px 7px;border-radius:100px;display:inline-block;margin-top:6px}
.fig2-badge.v{background:rgba(29,158,117,.12);color:#1D9E75;border:1px solid rgba(29,158,117,.25)}
.fig2-badge.s{background:rgba(155,155,180,.08);color:#9B9BB4;border:1px solid rgba(155,155,180,.2)}

async function gerarEmail(nome,empresa,setor,grupo,angulo,tom,hist){
  if(!getClaudeKey()){return {assunto:"⚠ Configure a Claude API Key em ⚙ Configurações",corpo:"Clique no botão ⚙ no canto superior direito e insira sua chave sk-ant-..."};}
  const assinatura=ASSINATURAS[grupo.id]||("Pedro Ica\nHead of Growth | "+grupo.name);
  const prompt=`${grupo.prompt}\n\nEscreva um email de prospecção B2B para ${empresa} do setor ${setor}.\nÂNGULO: ${angulo}\nTOM: ${tom}\n${nome?"DESTINATÁRIO: "+nome+"\n":""}${hist?"HISTÓRICO: "+hist+"\n":""}DOR IDENTIFICADA: ${grupo.dor(setor)}\n\nREGRAS: primeira linha específica sobre ${empresa}, conectar a dor ao que ${grupo.name} faz, benchmark do setor ${setor}, CTA de 20 min, máximo 180 palavras.\nUSE OBRIGATORIAMENTE esta assinatura no final:\n${assinatura}\nRetorne APENAS JSON sem markdown: {"assunto":"...","corpo":"..."}`;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":getClaudeKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:900,messages:[{role:"user",content:prompt}]})});
    const d=await r.json();
    if(d.error){return {assunto:"Erro API: "+d.error.type,corpo:d.error.message||""};}
    const txt=(d.content&&d.content[0]&&d.content[0].text)||"{}";
    try { return JSON.parse(txt.replace(/```json|```/g,"").trim()); }
    catch(e) { return {assunto:"Email gerado",corpo:txt}; }
  }catch(e){return {assunto:"Erro de conexão",corpo:"Verifique sua API key e conexão com a internet. "+e.message};}
}

    </>
  );
}

function kbLoadState(){
  try{const s=localStorage.getItem('gh_kanban_v3');if(s)return JSON.parse(s);}catch(e){}
  try{return{tabs:JSON.parse(JSON.stringify(KB_DEFAULT_TABS)),activeTab:'gaia'};}catch(e){return{tabs:[],activeTab:'gaia'};}
}
function kbSaveState(st){try{localStorage.setItem('gh_kanban_v3',JSON.stringify(st));}catch(e){}}
function kbFmtVal(v){if(!v)return'';if(v>=1000000)return'R$ '+(v/1000000).toFixed(1)+'M';if(v>=1000)return'R$ '+(v/1000).toFixed(0)+'k';return'R$ '+v.toLocaleString('pt-BR');}
function kbNextId(tab){return Math.max(0,...(tab.cards||[]).map(c=>c.id))+1;}
function kbUid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function KanbanView({curGrupo, initialTab}){
  const _kbInit=React.useMemo(()=>kbLoadState(),[]);
  const [kbState,setKbState]=useState(_kbInit);
  // Auto-select tab based on group or explicit initialTab prop
  const _resolveInitTab=()=>{
    if(initialTab && _kbInit.tabs.find(t=>t.id===initialTab)) return initialTab;
    if(curGrupo){
      // Map grupo id to tab id
      const grupoTabMap={gaia:'gaia',galeria:'holding',mila:'holding','404':'holding',cccaramelo:'holding',catalyst:'holding',mantiqueira:'holding',agente:'holding',vitrine:'holding',gux:'holding'};
      const mapped=grupoTabMap[curGrupo.id];
      if(mapped && _kbInit.tabs.find(t=>t.id===mapped)) return mapped;
    }
    return _kbInit.activeTab||'gaia';
  };
  const [kbActiveTab,setKbActiveTab]=useState(_resolveInitTab);
  const [dragId,setDragId]=useState(null);
  const [dragTabId,setDragTabId]=useState(null);
  const [kbSearch,setKbSearch]=useState('');
  const [criaFilter,setCriaFilter]=useState('all');
  const [cardModal,setCardModal]=useState(null); // {tabId, cardId or null, colId}
  const [leadModal,setLeadModal]=useState(null);
  const [tabModal,setTabModal]=useState(null);   // {tabId or null}
  const [colsModal,setColsModal]=useState(false);
  const [newColName,setNewColName]=useState('');
  const [tabColor,setTabColor]=useState('purple');
  const [cfName,setCfName]=useState('');
  const [cfProd,setCfProd]=useState('CR.IA');
  const [cfCol,setCfCol]=useState('');
  const [cfTag,setCfTag]=useState('');
  const [cfNote,setCfNote]=useState('');
  const [lfName,setLfName]=useState('');
  const [lfEmpresa,setLfEmpresa]=useState('');
  const [lfGaleria,setLfGaleria]=useState('');
  const [lfCol,setLfCol]=useState('');
  const [lfVal,setLfVal]=useState(0);
  const [lfNote,setLfNote]=useState('');
  const [tfName,setTfName]=useState('');
  const [tfType,setTfType]=useState('lead');

  const save = (st) => { setKbState(st); kbSaveState({...st,activeTab:kbActiveTab}); };

  const getTab = (id) => kbState.tabs.find(t=>t.id===id);
  const activeTabObj = getTab(kbActiveTab);

  const switchKbTab = (id) => {
    setKbActiveTab(id);
    setCriaFilter('all'); // reset filter on tab switch
    kbSaveState({...kbState,activeTab:id});
  };
  const visCards = (tab) => {
    const q = kbSearch.toLowerCase();
    return (tab.cards||[]).filter(c => {
      if(tab.type==='cria' && criaFilter!=='all' && c.product!==criaFilter) return false;
      if(tab.type==='lead' && criaFilter!=='Todos' && (c.galeria||'')!==criaFilter) return false;
      if(!q) return true;
      return c.name.toLowerCase().includes(q)||(c.empresa||'').toLowerCase().includes(q)||(c.note||'').toLowerCase().includes(q);
    });
  };
  const onDragStart = (tabId,cardId) => { setDragId(cardId); setDragTabId(tabId); };
  const onDrop = (colId) => {
    if(dragId==null||!dragTabId) return;
    const st = {...kbState, tabs: kbState.tabs.map(t=>
      t.id===dragTabId ? {...t, cards: t.cards.map(c=>c.id===dragId?{...c,col:colId}:c)} : t
    )};
    save(st);
    setDragId(null); setDragTabId(null);
  };
  const openAddCard = (colId) => {
    const tab = getTab(kbActiveTab);
    if(tab.type==='cria'){
      setCfName('');setCfProd('CR.IA');setCfCol(colId||tab.cols[0]?.id||'');setCfTag('');setCfNote('');
      setCardModal({tabId:kbActiveTab, cardId:null, colId});
    } else {
      setLfName('');setLfEmpresa('');setLfGaleria('');setLfCol(colId||tab.cols[0]?.id||'');setLfVal(0);setLfNote('');
      setLeadModal({tabId:kbActiveTab, cardId:null, colId});
    }
  };
  const openEditCard = (tabId, cardId) => {
    const tab = getTab(tabId);
    const card = (tab.cards||[]).find(c=>c.id===cardId);
    if(!card) return;
    if(tab.type==='cria'){
      setCfName(card.name);setCfProd(card.product||'CR.IA');setCfCol(card.col);setCfTag(card.tag||'');setCfNote(card.note||'');
      setCardModal({tabId, cardId});
    } else {
      setLfName(card.name);setLfEmpresa(card.empresa||'');setLfGaleria(card.galeria||'');
      setLfCol(card.col);setLfVal(card.value||0);setLfNote(card.note||'');
      setLeadModal({tabId, cardId});
    }
  };
  const saveCard = () => {
    if(!cfName.trim()) return;
    const tab = getTab(cardModal.tabId);
    const data = {name:cfName.trim(),product:cfProd,col:cfCol,tag:cfTag,note:cfNote.trim()};
    const newTabs = kbState.tabs.map(t=>{
      if(t.id!==cardModal.tabId) return t;
      if(cardModal.cardId!=null){
        return {...t, cards: t.cards.map(c=>c.id===cardModal.cardId?{...c,...data}:c)};
      } else {
        return {...t, cards: [...t.cards, {id:kbNextId(t),...data}]};
      }
    });
    save({...kbState, tabs:newTabs});
    setCardModal(null);
  };
  const delCard = () => {
    if(!cardModal?.cardId) return;
    if(!window.confirm('Excluir card?')) return;
    const newTabs = kbState.tabs.map(t=>t.id===cardModal.tabId?{...t,cards:t.cards.filter(c=>c.id!==cardModal.cardId)}:t);
    save({...kbState,tabs:newTabs}); setCardModal(null);
  };
  const saveLead = () => {
    if(!lfName.trim()) return;
    const data = {name:lfName.trim(),empresa:lfEmpresa.trim(),galeria:lfGaleria,col:lfCol,value:parseInt(lfVal)||0,note:lfNote.trim()};
    const newTabs = kbState.tabs.map(t=>{
      if(t.id!==leadModal.tabId) return t;
      if(leadModal.cardId!=null){
        return {...t, cards: t.cards.map(c=>c.id===leadModal.cardId?{...c,...data}:c)};
      } else {
        return {...t, cards: [...t.cards, {id:kbNextId(t),...data}]};
      }
    });
    save({...kbState,tabs:newTabs}); setLeadModal(null);
  };
  const delLead = () => {
    if(!leadModal?.cardId) return;
    if(!window.confirm('Excluir lead?')) return;
    const newTabs = kbState.tabs.map(t=>t.id===leadModal.tabId?{...t,cards:t.cards.filter(c=>c.id!==leadModal.cardId)}:t);
    save({...kbState,tabs:newTabs}); setLeadModal(null);
  };
  const openNewTab = () => { setTfName('');setTfType('lead');setTabColor('purple');setTabModal({tabId:null}); };
  const openEditTab = (tabId) => {
    const t = getTab(tabId);
    setTfName(t.label);setTfType(t.type);setTabColor(t.color||'purple');setTabModal({tabId});
  };
  const saveTab = () => {
    if(!tfName.trim()) return;
    if(tabModal.tabId){
      const newTabs = kbState.tabs.map(t=>t.id===tabModal.tabId?{...t,label:tfName.trim(),color:tabColor}:t);
      save({...kbState,tabs:newTabs});
    } else {
      const defCols = tfType==='cria'
        ? [{id:'clientes',label:'Clientes',accent:'green'},{id:'pipeline',label:'Em progresso',accent:'blue'},{id:'hold',label:'On hold',accent:'red'}]
        : [{id:'prospect',label:'Prospect',accent:'violet'},{id:'contato',label:'Contato',accent:'teal'},{id:'negociacao',label:'Negociacao',accent:'amber'},{id:'cliente',label:'Cliente',accent:'green'}];
      const nt = {id:kbUid(),label:tfName.trim(),color:tabColor,type:tfType,cols:defCols,cards:[]};
      const newState = {...kbState, tabs:[...kbState.tabs,nt]};
      save(newState);
      setKbActiveTab(nt.id);
    }
    setTabModal(null);
  };
  const deleteTab = () => {
    if(!tabModal?.tabId) return;
    const t = getTab(tabModal.tabId);
    if(!window.confirm('Excluir aba "'+t.label+'" e todos os dados?')) return;
    const newTabs = kbState.tabs.filter(t=>t.id!==tabModal.tabId);
    const newActive = newTabs[0]?.id||'';
    setKbActiveTab(newActive);
    save({...kbState,tabs:newTabs});
    setTabModal(null);
  };
  const addCol = () => {
    if(!newColName.trim()) return;
    const idx = (activeTabObj?.cols||[]).length % KC_CYCLE.length;
    const newTabs = kbState.tabs.map(t=>t.id===kbActiveTab?{...t,cols:[...t.cols,{id:kbUid(),label:newColName.trim(),accent:KC_CYCLE[idx]}]}:t);
    save({...kbState,tabs:newTabs}); setNewColName('');
  };
  const renameCol = (colId, newLabel) => {
    const newTabs = kbState.tabs.map(t=>t.id===kbActiveTab?{...t,cols:t.cols.map(c=>c.id===colId?{...c,label:newLabel}:c)}:t);
    save({...kbState,tabs:newTabs});
  };
  const deleteCol = (colId) => {
    const col = (activeTabObj?.cols||[]).find(c=>c.id===colId);
    if(!window.confirm('Excluir coluna "'+col?.label+'"?')) return;
    const newTabs = kbState.tabs.map(t=>t.id===kbActiveTab?{...t,cols:t.cols.filter(c=>c.id!==colId)}:t);
    save({...kbState,tabs:newTabs});
  };
  const changeColAccent = (colId, accent) => {
    const newTabs = kbState.tabs.map(t=>t.id===kbActiveTab?{...t,cols:t.cols.map(c=>c.id===colId?{...c,accent}:c)}:t);
    save({...kbState,tabs:newTabs});
  };
  const renderStats = () => {
    const tab = activeTabObj; if(!tab) return null;
    if(tab.type==='cria'){
      const vis=visCards(tab);
      const ativos=vis.filter(c=>c.col==='clientes').length;
      const pipeline=vis.filter(c=>!['clientes','hold'].includes(c.col)).length;
      const propostas=vis.filter(c=>c.col==='proposta').length;
      const hold=vis.filter(c=>c.col==='hold').length;
      return [['Clientes ativos',ativos],['Em pipeline',pipeline],['Propostas',propostas],['On hold',hold],['Visíveis',vis.length]].map(([l,n])=>(
        <div key={l} style={{background:'#0e0e0e',border:'1px solid #1a1a1a',borderRadius:4,padding:'6px 12px',display:'flex',alignItems:'baseline',gap:7}}>
          <span style={{fontSize:18,fontWeight:700,fontFamily:'DM Mono,monospace',color:'#eee'}}>{n}</span>
          <span style={{fontSize:9,color:'#444',fontFamily:'DM Mono,monospace'}}>{l}</span>
        </div>
      ));
    } else {
      const lastCol = tab.cols[tab.cols.length-1]?.id;
      const ativos=(tab.cards||[]).filter(c=>c.col===lastCol).length;
      const pipeline=(tab.cards||[]).filter(c=>c.col!==lastCol).length;
      const totalVal=(tab.cards||[]).filter(c=>c.col===lastCol).reduce((a,b)=>a+(b.value||0),0);
      const vis=visCards(tab);
      return [
        ['Clientes ativos',ativos,null],
        ['Em pipeline',pipeline,null],
        ['Receita',null,kbFmtVal(totalVal)||'R$ 0'],
        ['Visíveis',vis.length,null]
      ].map(([l,n,v])=>(
        <div key={l} style={{background:'#0e0e0e',border:'1px solid #1a1a1a',borderRadius:4,padding:'6px 12px',display:'flex',alignItems:'baseline',gap:7}}>
          {v?<span style={{fontSize:15,fontWeight:700,fontFamily:'DM Mono,monospace',color:'#34D399'}}>{v}</span>
            :<span style={{fontSize:18,fontWeight:700,fontFamily:'DM Mono,monospace',color:'#eee'}}>{n}</span>}
          <span style={{fontSize:9,color:'#444',fontFamily:'DM Mono,monospace'}}>{l}</span>
        </div>
      ));
    }
  };

  if(!activeTabObj) return null;

  const accentColor = KC_HEX[kbState.tabs.find(t=>t.id===kbActiveTab)?.color||'purple']||'#534AB7';

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden',background:'#060606',fontFamily:'DM Mono,monospace'}}>
      <style>{KB_ACCENT_STYLES}</style>

      {/* ── KANBAN INNER TOPBAR ── */}
      <div style={{display:'flex',alignItems:'stretch',borderBottom:'1px solid #181818',background:'#080808',flexShrink:0,overflowX:'auto'}}>
        {kbState.tabs.map(t=>{
          const tc = KC_HEX[t.color]||'#534AB7';
          const isOn = t.id===kbActiveTab;
          return(
            <div key={t.id}
              style={{display:'flex',alignItems:'center',gap:6,padding:'0 14px',borderRight:'1px solid #181818',cursor:'pointer',borderBottom:`2px solid ${isOn?tc:'transparent'}`,flexShrink:0,minHeight:38}}
              onClick={()=>switchKbTab(t.id)}
              onDoubleClick={()=>openEditTab(t.id)}
              title="Duplo clique para editar aba">
              <div style={{width:5,height:5,borderRadius:'50%',background:tc,opacity:isOn?1:.3}}/>
              <span style={{fontSize:10,letterSpacing:.3,color:isOn?tc:'#444',fontWeight:isOn?700:400}}>{t.label}</span>
            </div>
          );
        })}
        <button onClick={openNewTab} style={{padding:'0 12px',border:'none',background:'none',cursor:'pointer',color:'#333',fontSize:16,flexShrink:0}} title="Nova aba">+</button>
      </div>

      {/* ── TOOLBAR ── */}
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 16px',borderBottom:'1px solid #181818',flexShrink:0,flexWrap:'wrap'}}>
        {activeTabObj.type==='cria'&&(
          <div style={{display:'flex',gap:4}}>
            {[['all','Todos'],['CR.IA','CR.IA'],['BrandSync','BrandSync']].map(([f,l])=>(
              <button key={f} onClick={()=>setCriaFilter(f)}
                style={{padding:'3px 9px',borderRadius:3,border:'1px solid',fontSize:9,cursor:'pointer',letterSpacing:.3,
                  borderColor:criaFilter===f?accentColor:'#1e1e1e',
                  background:criaFilter===f?`rgba(${hexRgb(accentColor)},.12)`:'transparent',
                  color:criaFilter===f?accentColor:'#444'}}>{l}</button>
            ))}
          </div>
        )}
        {activeTabObj.type==='lead'&&(
          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
            {['Todos','Galeria','GAIA','Catalyst','Milà','404','ccCaramelo','Vitrine','A.gente','GUX'].map(f=>(
              <button key={f} onClick={()=>setCriaFilter(f)}
                style={{padding:'3px 9px',borderRadius:3,border:'1px solid',fontSize:9,cursor:'pointer',letterSpacing:.3,
                  borderColor:criaFilter===f?accentColor:'#1e1e1e',
                  background:criaFilter===f?`rgba(${hexRgb(accentColor)},.12)`:'transparent',
                  color:criaFilter===f?accentColor:'#444'}}>{f}</button>
            ))}

async function buscarDecisoresClaude(empresa, setor) {
  const prompt = `Busque os principais executivos de marketing, brand, performance e comercial da empresa "${empresa}" (setor: ${setor||'geral'}) no Brasil.
Para cada pessoa encontrada: nome completo, cargo atual, URL do LinkedIn se disponível.
Foque em: CMO, VP Marketing, Diretor de Marketing, Diretor de Performance, Diretor de Brand, Head de CX, Gerente de Marketing Digital, Diretor Comercial, Head Comercial.
Busque no LinkedIn, site da empresa, Meio & Mensagem e PropMark. Liste no mínimo 5 pessoas.
Responda SOMENTE em JSON sem markdown: [{"nome":"...","cargo":"...","li":"..."}]`;
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json","x-api-key":getClaudeKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 2000,
        tools: [{ type: "web_search_20250305", name: "web_search" }],
        messages: [{role:"user", content: prompt}]
      })
    });
    const d = await r.json();
    const txt = (d.content||[])
      .filter(b => b.type === "text")
      .map(b => b.text)
      .join("\n");
    if (!txt) return null;
    return (()=>{ try { const clean=txt.replace(/```json[\s\S]*?```|```/g,"").trim(); const m=clean.match(/\[[\s\S]*\]/); return m?JSON.parse(m[0]):JSON.parse(clean); } catch(jsonErr){return null;} })();
  } catch(e) { return null; }
}

function getWeekId(date) {
  const d = new Date(date||Date.now());
  const jan1 = new Date(d.getFullYear(),0,1);
  const week = Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
  return `${d.getFullYear()}-W${String(week).padStart(2,"0")}`;
}

function LLMBox({accs, curGrupo}) {
  const [history, setHistory] = useState(()=>loadSt("gh_llmbox_v1",[]));
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const histRef = React.useRef(null);

  useEffect(()=>{ if(histRef.current) histRef.current.scrollTop=histRef.current.scrollHeight; },[history]);

  const CHIPS = [
    "Quais empresas de bet estão no sistema?",
    "Quantos decisores verificados tenho no total?",
    "Quais empresas do setor financeiro não foram acionadas?",
    "Mostre as 10 empresas com mais sugeridos não convertidos",
    "Quais empresas não têm nenhum contato verificado?",
    "Quem são os CMOs que já registrei atividade este mês?",
  ];

  const buildContext = () => {
    const empresas = (typeof PROSP!=="undefined"?PROSP:[]).slice(0,200).map(e=>{
      const key = (curGrupo?.id||"galeria")+"_"+e.rank;
      const acc = accs[key]||{};
      return {
        nome: e.nome,
        setor: e.setor,
        rank: e.rank,
        decisoresVerificados: (acc.decisors||[]).length,
        decisoresSugeridos: (acc.sugeridos||[]).length,
        atividades: (acc.activities||[]).length,
        ultimaAtividade: (acc.activities||[]).slice(-1)[0]?.date||null,
        decisores: (acc.decisors||[]).map(d=>({nome:d.nome,cargo:d.cargo})),
      };
    });
    const kanbanData = loadSt("gh_kanban_v3",{});
    const weekId = getWeekId();
    const semanaAtual = kanbanData[weekId]||{};
    return JSON.stringify({
      empresa_do_grupo: curGrupo?.name||"Galeria",
      total_empresas: empresas.length,
      empresas,
      acionamentos_semana_atual: semanaAtual,
    }, null, 0).slice(0,8000);
  };

  const perguntar = async (q) => {
    const question = q||input.trim();
    if(!question||loading) return;
    setLoading(true);
    setInput("");
    const ctx = buildContext();
    const needsWeb = /hoje|agora|recente|novo|noticias|notícias|mercado|moviment|semana|mês|mes|atual|lançou|lançamento/i.test(question);
    const prompt = `Você é o assistente analítico do CRM da Galeria Holding. Responda em português, de forma direta e formatada.
Dados do sistema (JSON resumido):
${ctx}

Pergunta: ${question}

${needsWeb ? "Se necessário, use web_search para complementar com dados em tempo real do mercado brasileiro de comunicação e marketing." : ""}
Responda com dados concretos do contexto. Use tabelas de texto quando aplicável. Seja objetivo e direto.`;
    try {
      const body = {
        model:"claude-sonnet-4-6",
        max_tokens:2000,
        messages:[{role:"user",content:prompt}]
      };
      if(needsWeb) body.tools = [{ type:"web_search_20250305", name:"web_search" }];
      const r = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":getClaudeKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify(body)
      });
      const d = await r.json();
      const answer = (d.content||[])
        .filter(b => b.type === "text")
        .map(b => b.text)
        .join("\n") || "Não foi possível responder agora.";
      const usouWeb = needsWeb && (d.content||[]).some(b=>b.type==="tool_use"||b.type==="tool_result");
      const newHistory = [...history.slice(-9),{
        q:question,
        a:answer + (usouWeb ? "\n\n🌐 *Resposta complementada com busca em tempo real*" : ""),
        ts:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})
      }];
      setHistory(newHistory);
      saveSt("gh_llmbox_v1",newHistory);
    } catch(e) {
      const newHistory = [...history.slice(-9),{q:question,a:"Não foi possível buscar agora. Tente novamente.",ts:""}];
      setHistory(newHistory);
      saveSt("gh_llmbox_v1",newHistory);
    }
    setLoading(false);
  };

  return (
    <div className="llm-wrap">
      <div style={{padding:"14px 20px",borderBottom:"1px solid var(--gh-mid)",flexShrink:0}}>
        <div style={{fontSize:16,fontWeight:700,color:"var(--gh-white)",letterSpacing:-.3}}>🤖 Perguntar ao CRM</div>
        <div style={{fontSize:9,fontFamily:"IBM Plex Mono,monospace",color:"var(--gh-muted)",marginTop:2}}>Consulte seus dados com linguagem natural — contexto: {curGrupo?.name}</div>
      </div>
      <div className="llm-history" ref={histRef}>
        {history.length===0&&(
          <div style={{textAlign:"center",padding:40,color:"var(--gh-muted)",fontFamily:"IBM Plex Mono,monospace"}}>
            <div style={{fontSize:32,marginBottom:12}}>🤖</div>
            <div style={{fontSize:12}}>Faça uma pergunta sobre seus dados</div>
          </div>
        )}
        {history.map((item,i)=>(
          <div key={i}>
            <div className="llm-q">{item.q}</div>
            <div className="llm-a">{item.a}</div>
            {item.ts&&<div style={{fontSize:8,fontFamily:"IBM Plex Mono,monospace",color:"#333",marginTop:4,textAlign:"right"}}>{item.ts}</div>}
          </div>
        ))}
        {loading&&<div style={{padding:14,background:"var(--gh-dark)",borderRadius:8,border:"1px solid var(--gh-mid)"}}>
          <div className="lbar"><div className="lfill" style={{background:"var(--gh-orange)"}}/></div>
          <div style={{fontSize:9,color:"var(--gh-muted)",fontFamily:"IBM Plex Mono,monospace"}}>Analisando seus dados...</div>
        </div>}
      </div>
      <div className="llm-chips">
        {CHIPS.map((c,i)=><span key={i} className="llm-chip" onClick={()=>perguntar(c)}>{c}</span>)}
      </div>
      <div className="llm-input-row">
        <input value={input} onChange={e=>setInput(e.target.value)} placeholder="Faça uma pergunta sobre seus dados..." onKeyDown={e=>e.key==="Enter"&&perguntar()}/>
        <button onClick={()=>perguntar()} disabled={loading||!input.trim()}
          style={{padding:"10px 18px",borderRadius:4,border:"none",background:"var(--gh-orange)",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",opacity:(loading||!input.trim())?0.5:1}}>
          {loading?"...":"Perguntar"}
        </button>
      </div>
    </div>
  );
}

function calcularScore(empresa, accs, grupoId, alertas) {
  let score = 0;
  const key = (grupoId||"galeria") + "_" + empresa.rank;
  const acc = (accs||{})[key] || {};
  const decisors = (acc.decisors||[]);
  const activities = (acc.activities||[]);
  const setoresAlta = ["Fintech","E-commerce","FMCG","Beleza","Saude","Streaming","B2B Tech","Super App"];
  if(setoresAlta.includes(empresa.setor)) score += 20;
  else score += 10;
  const lastAct = activities.length > 0 ? activities[activities.length-1] : null;
  if(!lastAct) { score += 20; }
  else {
    const diasAtras = (Date.now() - new Date(lastAct.isoDate||lastAct.date||0).getTime()) / 86400000;
    if(isNaN(diasAtras) || diasAtras > 90) score += 20;
    else if(diasAtras > 30) score += 10;
  }
  const nDec = decisors.length;
  if(nDec === 0) score += 15;
  else if(nDec <= 2) score += 10;
  else score += 5;
  const alertasArr = (alertas||[]);
  const temCMO = alertasArr.some(a => {
    const mesmoNome = (a.empresa||"").toLowerCase().includes((empresa.nome||"").toLowerCase().slice(0,6));
    const recente = !a.date || ((Date.now() - new Date(a.date.split("/").reverse().join("-")).getTime()) / 86400000) < 90;
    return mesmoNome && recente;
  });
  if(temCMO) score += 25;
  const fitAlto = ["E-commerce","Fintech","FMCG","Beleza","Varejo","Super App","Social Media"].includes(empresa.setor);
  score += fitAlto ? 20 : 10;

  return Math.min(100, score);
}

async function claudeSearch(prompt, maxTokens) {

    });

function parseJSON(txt) {
  if(!txt) return null;
  try {
    const clean = (txt||"").replace(/```json[\s\S]*?```|```/g,"").trim();
    const arr = clean.match(/\[[\s\S]*\]/);
    if(arr) return JSON.parse(arr[0]);
    const obj = clean.match(/\{[\s\S]*\}/);
    if(obj) return JSON.parse(obj[0]);
    return JSON.parse(clean);
  } catch(e) { return null; }
}
function lsGet(key, def) {

}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}
function lsMerge(key, patch) {
  const cur = lsGet(key, {});
  lsSet(key, {...cur, ...patch});
}
function getWeekKey(offsetWeeks) {
  const d = new Date();
  d.setDate(d.getDate() + (offsetWeeks||0)*7);
  const jan1 = new Date(d.getFullYear(),0,1);
  const wk = Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
  return d.getFullYear()+"-W"+String(wk).padStart(2,"0");
}
function getWeekLabel(weekKey) {
  if(!weekKey) return "";
  const [year,w] = weekKey.split("-W");
  const jan1 = new Date(parseInt(year),0,1);
  const days = (parseInt(w)-1)*7 - jan1.getDay()+1;
  const s = new Date(jan1.getTime()+days*86400000);
  const e = new Date(s.getTime()+4*86400000);
  const f = d => d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
  return `Semana ${w} — ${f(s)} a ${f(e)} ${year}`;
}

function FigurinhasV2({accs, setAccs, curGrupo, alertas, onKanbanAdd}) {

  const [emailModal, setEmailModal] = useState(null);

  const empresas = useMemo(()=>{
    const base = (typeof PROSP!=="undefined"?PROSP:[]).filter(e=>e.setor);
    return base.map(e=>({
      ...e,
      score: calcularScore(e, accs, curGrupo.id, alertas)
    }));
  }, [accs, curGrupo.id, alertas]);

  const setores = useMemo(()=>{
    const s = new Set(empresas.map(e=>e.setor).filter(Boolean));
    return ["Todos",...Array.from(s).sort()];
  }, [empresas]);

  const getAcc = (rank) => {
    const k = curGrupo.id+"_"+rank;
    return (accs||{})[k] || {decisors:[],sugeridos:[],activities:[]};
  };

  const filtradas = useMemo(()=>{
    return empresas.filter(e=>{
      const acc = getAcc(e.rank);
      const nVer = (acc.decisors||[]).length;
      const q = (search||"").toLowerCase();
      if(q && !e.nome.toLowerCase().includes(q)) return false;
      if(filtroSetor!=="Todos" && e.setor!==filtroSetor) return false;
      if(filtroStatus==="sem" && nVer>0) return false;
      if(filtroStatus==="parcial" && (nVer===0||nVer>=5)) return false;
      if(filtroStatus==="completo" && nVer<5) return false;
      return true;
    }).sort((a,b)=>b.score-a.score);

function fitScore(lead,grupo){
  if(!lead||!grupo||typeof grupo.fit!=="function") return 0;
  const f=grupo.fit(lead.setor||"");
  const base=f==="alto"?100:f==="medio"?60:20;
  const boost=lead.rank<=50?30:lead.rank<=100?20:lead.rank<=200?10:0;
  const res=checkRestrictions(lead,grupo.id);
  return base+boost+(res.length>0?-50:0);
}
function getTop50(grupo){
  if(!grupo||!grupo.id||typeof grupo.fit!=="function") return [];
  return (typeof PROSP!=="undefined"?PROSP:[])
    .filter(l=>l&&l.nome&&l.setor)
    .map(l=>({...l,score:fitScore(l,grupo)}))
    .sort((a,b)=>b.score-a.score)
    .slice(0,50);
}

function SmartBatch({grupo,accs,onActivitySaved}){
  const [sel,setSel]=useState({});
  const [emailModal,setEmailModal]=useState(null);
  const [queue,setQueue]=useState([]);
  const [sentCount,setSentCount]=useState(0);
  const today3=new Date(Date.now()-3*24*60*60*1000).toISOString().slice(0,10);
  const candidates=useMemo(()=>{
    if(!grupo||!grupo.id) return [];
    return getTop50(grupo)
      .filter(l=>l&&l.nome&&checkRestrictions(l,grupo.id).length===0)
      .map(l=>{
        const k=grupo.id+"_"+l.rank;
        const a2=accs[k]||{};
        const acts=a2.activities||[];
        const lastE=acts.filter(a=>a.type==="email").slice(-1)[0];
        let lastISO="";
        if(lastE&&lastE.date){const p=lastE.date.split("/");if(p.length===3)lastISO=p[2]+"-"+p[1]+"-"+p[0];}
        const contacted=new Set(acts.map(a=>a.decisor).filter(Boolean));
        const decs=a2.decisors||[];
        const nextDec=decs.find(d=>!contacted.has(d.nome))||decs[0]||null;
        return {...l,lastEmailDate:lastE?lastE.date:null,lastTema:lastE?lastE.note||"":"",
          contactedRecently:lastISO>today3,nextDec,ndecs:decs.length};
      })
      .filter(l=>!l.contactedRecently).slice(0,80);
  },[grupo,accs]);
  const nSel=Object.values(sel).filter(Boolean).length;
  const autoSelect=()=>{
    const sectors={};const chosen={};let count=0;
    for(const l of candidates){
      if(count>=50) break;
      const sec=l.setor||"other";
      if(!sectors[sec]) sectors[sec]=0;
      if(sectors[sec]>=6) continue;
      chosen[l.rank]=true;sectors[sec]++;count++;
    }
    setSel(chosen);
  };
  const openQueue=()=>{
    const sl=candidates.filter(l=>sel[l.rank]);
    setQueue(sl);if(sl.length>0)setEmailModal(sl[0]);
  };

    setSentCount(n=>n+1);
    if(onActivitySaved)onActivitySaved(lead.nome,"email","✉ Email",lead.nextDec?lead.nextDec.nome:"","Lote");
    const rem=queue.filter(l=>l.rank!==lead.rank);
    if(rem.length>0){setQueue(rem);setEmailModal(rem[0]);}
    else{setEmailModal(null);setQueue([]);}
  };
  const gc=grupo?grupo.color:"#E8C97A";
  const gr=grupo?grupo.rgb:"232,201,122";
  return(
    <div style={{padding:"28px 32px",overflowY:"auto",height:"100%"}}>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{fontSize:22,fontWeight:800,fontFamily:"Syne,sans-serif",letterSpacing:-1}}>✉ Disparo Inteligente — 50/dia</div>
          <div style={{fontSize:11,color:"#555",fontFamily:"DM Mono,monospace",marginTop:4}}>Máx 6/setor · Anti-duplicata 3 dias · Prioriza decisores não contatados</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn btno btnsm" onClick={autoSelect}>⚡ Selecionar 50</button>
          {nSel>0&&<button className="btn btnp btnsm" style={{background:gc,color:"#000"}} onClick={openQueue}>✉ Disparar {nSel}</button>}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20}}>
        {[["SELECIONADOS",nSel,gc],["DISPONÍVEIS",candidates.length,"#eee"],["ENVIADOS HOJE",sentCount,"#34D399"],["TOTAL BASE",PROSP.length,"#60A5FA"]].map(([l,v,col])=>(
          <div key={l} style={{background:"#0e0e0e",border:"1px solid #1a1a1a",borderRadius:8,padding:16,textAlign:"center"}}>
            <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"#444",letterSpacing:1,marginBottom:6}}>{l}</div>
            <div style={{fontSize:24,fontWeight:800,color:col,fontFamily:"Syne,sans-serif"}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {candidates.slice(0,60).map(l=>{
          const isSel=!!sel[l.rank];
          const fit=grupo?grupo.fit(l.setor||""):"medio";
          const fc=fitColor(fit);
          return(
            <div key={l.rank} onClick={()=>setSel(s=>({...s,[l.rank]:!s[l.rank]}))}
              style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",cursor:"pointer",
                background:isSel?"rgba("+gr+",.06)":"#0e0e0e",
                border:"1px solid "+(isSel?"rgba("+gr+",.3)":"#1a1a1a"),borderRadius:7,transition:"all .15s"}}>
              <div style={{width:20,height:20,borderRadius:4,flexShrink:0,
                border:"2px solid "+(isSel?gc:"#2a2a2a"),background:isSel?gc:"transparent",
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#000"}}>
                {isSel&&"✓"}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:700,display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                  #{l.rank} {l.nome}
                  <span style={{fontSize:9,fontFamily:"DM Mono,monospace",padding:"1px 6px",borderRadius:100,
                    background:"rgba("+hexRgb(fc)+",.1)",color:fc,border:"1px solid rgba("+hexRgb(fc)+",.25)"}}>{fitLabel(fit)}</span>
                </div>
                <div style={{fontSize:10,color:"#555",fontFamily:"DM Mono,monospace",marginTop:2}}>
                  {l.setor}
                  {l.lastEmailDate?<span style={{color:"#444"}}> · {l.lastEmailDate}{l.lastTema?" — "+String(l.lastTema).slice(0,28):""}</span>:
                    <span style={{color:"#34D399"}}> · nunca contatado</span>}

                {l.nextDec&&<div style={{fontSize:9,color:gc,fontFamily:"DM Mono,monospace",marginTop:2}}>→ {l.nextDec.nome} · {l.nextDec.cargo}</div>}
              </div>
              <button className="btn btno btnsm" onClick={e=>{e.stopPropagation();setEmailModal(l);}} style={{flexShrink:0}}>✉</button>
            </div>
          );
        })}
      </div>
      {emailModal&&grupo&&(
        <EmailModal dc={emailModal.nextDec||null} empresa={emailModal.nome} setor={emailModal.setor||""} grupo={grupo}

          onClose={()=>advance(emailModal)}/>
      )}
    </div>
  );
}

function LoginScreen({onLogin}){
  const [name,setName]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const doLogin=async()=>{
    setErr("");setLoading(true);
    let users=await sharedGet("users")||{};
    if(Object.keys(users).length===0){
      const id=uid();
      users[id]={id,name:"Pedro Ica",pass:"galeria2024",role:"admin"};
      await sharedSet("users",users);
    }
    const u=Object.values(users).find(u=>u.name.toLowerCase()===name.toLowerCase()&&u.pass===pass);
    if(!u){setErr("Nome ou senha incorretos.");setLoading(false);return;}

  };

        {err&&<div style={{fontSize:11,color:"#FF4757",fontFamily:"DM Mono,monospace",marginBottom:12,padding:"8px 12px",background:"rgba(255,71,87,.06)",border:"1px solid rgba(255,71,87,.2)",borderRadius:5}}>{err}</div>}
        <button onClick={doLogin} disabled={loading} style={{width:"100%",padding:"11px 0",borderRadius:5,border:"none",background:"#E8C97A",color:"#000",fontWeight:800,fontSize:13,cursor:"pointer",marginTop:8}}>

  const [fitFil,setFitFil]=useState("all");

    const merged={...v1};
    Object.keys(v3).forEach(k=>{
      if(!merged[k]){merged[k]=v3[k];}
      else{
        merged[k]={...merged[k],
          sugeridos:[...(merged[k].sugeridos||[]),...(v3[k].sugeridos||[]).filter(s=>!(merged[k].sugeridos||[]).some(x=>x.nome===s.nome))],
        };
      }
    });
    return merged;
  });

  const [curUser,setCurUser]=useState(null);
  const [sessLoading,setSessLoading]=useState(true);
  const lastReview=loadSt("ghub_res_review",null);
  const showReminder=!lastReview||(new Date()-new Date(lastReview))>(90*24*60*60*1000);
  useEffect(()=>{(async()=>{
    const sess=await personalGet("session");
    if(sess){setCurUser({id:sess.uid||"pedro",name:sess.name||"Pedro Ica",role:sess.role||"admin"});}

  })();},[]);

  const onLogin=async(user)=>{
    setCurUser(user);
    await personalSet("session",{uid:user.id,name:user.name,role:user.role});
  };
  const logout=async()=>{await personalSet("session",null);setCurUser(null);};

    ['gh_kanban_v1','gh_kanban_v2','gh_decisores_v1','gh_decisores_v2','gh_llmbox_v1','ghub_pd','ghub_lusha_key','ghub_hunter_key']
      .forEach(k=>{ try{localStorage.removeItem(k);}catch{} });

      const shown=loadSt("ghub_cfg_shown",false);

          Obtenha em: <a href="https://console.anthropic.com/settings/keys" target="_blank" style={{color:"#60A5FA"}}>console.anthropic.com/settings/keys</a>
        </div>

      {viewMode==="figurinhas2"?(
        <div className="ws" style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}><FigurinhasV2 accs={accs} setAccs={setAccs} curGrupo={curGrupo} alertas={lsGet("gh_alertas_v2",[])} onKanbanAdd={(nome,cargo,emp,canal)=>{if(window.__addToKanbanV2)window.__addToKanbanV2(nome,cargo,emp,canal);}}/></div>
      ):viewMode==="ka2"?(
        <div className="ws" style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}><KanbanAcionamentosV2 accs={accs}/></div>
      ):viewMode==="top10"?(
        <div className="ws" style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}><Top10View accs={accs} alertas={lsGet("gh_alertas_v2",[])} curGrupo={curGrupo} onEmpresaClick={()=>switchView("figurinhas2")}/></div>

      ):viewMode==="holding"?(
        <div className="ws"><HoldingView/></div>

        <div className="ws" style={{flex:1,overflow:"hidden",display:"flex"}}><SmartBatch grupo={curGrupo} accs={accs} onActivitySaved={onActivitySaved}/></div>
      ):viewMode==="calls"?(

      ):viewMode==="coldcall_dec"?(

      ):viewMode==="empresas"?(
        <div className="ws" style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}><FigurinhasV2 accs={accs} setAccs={setAccs} curGrupo={curGrupo} alertas={lsGet("gh_alertas_v2",[])} onKanbanAdd={(nome,cargo,emp,canal)=>{if(window.__addToKanbanV2)window.__addToKanbanV2(nome,cargo,emp,canal);}}/></div>
      ):viewMode==="hotpipeline"?(
        <div className="ws" style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}><KanbanDiario/></div>
      ):viewMode==="pipeline_gaia"?(
        <div className="ws" style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}><PipelineView tipo="gaia"/></div>
      ):viewMode==="pipeline_holding"?(
        <div className="ws" style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}><PipelineView tipo="holding"/></div>
      ):viewMode==="estrategico"?(
        <div className="ws" style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}><StrategicHub/></div>
      ):(
      <div className="ws">
        <div className="sb" style={{"--tc":curGrupo.color,"--tcr":curGrupo.rgb}}>
          <div className="sbhead">
              <span className="sbtitle">ANUNCIANTES</span>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span className="sbcnt">{filtered.length}</span>
                <button onClick={()=>setAddCoModal(true)} style={{padding:"2px 8px",borderRadius:3,border:"1px solid rgba(0,255,148,.3)",background:"rgba(0,255,148,.06)",color:"#00FF94",fontSize:9,fontFamily:"DM Mono,monospace",cursor:"pointer",fontWeight:700}}>+ Empresa</button>
              </div>
            </div>
          <div className="sbsearch"><input placeholder="Buscar empresa..." value={sbQ} onChange={e=>setSbQ(e.target.value)}/></div>
          <div className="sbfil">
            {[["all","TODOS"],["alto","FIT ALTO"],["medio","FIT MED"],["crm","NO CRM"],["restrito","RESTRITOS"]].map(([f,l])=>(
              <button key={f} className={"fb"+(fitFil===f?" on":"")+(f==="restrito"?" res":"")} onClick={()=>setFitFil(f)}>{l}</button>
            ))}
          </div>
          <div className="sblist">
            {filtered.slice(0,200).map(d=>{
              const fit=curGrupo.fit(d.setor||"");
              const fc=fitColor(fit);
              const res=checkRestrictions(d,curGrupo.id);
              const isRes=res.length>0;
              const isSel=curLead&&curLead.rank===d.rank;
              const hasCrm=!!accs[accKey(curGrupo,d.rank)];
              return(
                <div key={d.rank+d.nome} className={"coitem"+(isSel?" sel":"")+(isRes?" restricted":"")} onClick={()=>setCurLead(d)}>
                  <span className="corank">{d.rank}</span>
                  <div className="cobody">
                    <div className="coname">{d.nome}{isRes&&<span style={{fontSize:7,marginLeft:5,color:"#FF4757"}}>●</span>}{d.custom&&<span style={{fontSize:7,marginLeft:4,padding:"1px 4px",borderRadius:2,background:"rgba(0,255,148,.08)",color:"#00FF94",border:"1px solid rgba(0,255,148,.2)"}}>★</span>}</div>
                    <div className="cosec">{d.setor}{isRes&&<span style={{color:"rgba(255,71,87,.6)",marginLeft:4,fontSize:7}}>conflito</span>}</div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                    {isRes?<span className="restag">RESTRITO</span>:<span className="fittag" style={{background:`rgba(${hexRgb(fc)},.08)`,color:fc,border:`1px solid rgba(${hexRgb(fc)},.2)`}}>{fitLabel(fit)}</span>}
                    {hasCrm&&<div className="crmdot"></div>}
                    {d.custom&&<button onClick={e=>{e.stopPropagation();if(window.confirm("Remover "+d.nome+"?"))removeCompany(d.rank);}} style={{fontSize:8,padding:"1px 4px",borderRadius:2,border:"1px solid rgba(255,71,87,.2)",background:"rgba(255,71,87,.06)",color:"#FF4757",cursor:"pointer",fontFamily:"DM Mono,monospace"}}>✕</button>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="main" style={{"--tc":curGrupo.color,"--tcr":curGrupo.rgb}}>
          {curLead?(
            <AgentView key={curGrupo.id+"_"+curLead.rank} grupo={curGrupo} lead={curLead} acc={getAcc()} onAccUpdate={setAcc}/>
          ):(
            <>
              <div className="subtabs"></div>
              <div className="panel"><div className="empty"><div className="emptyicon">◎</div><div style={{fontSize:16,fontWeight:800}}>{curGrupo.name}</div><div style={{fontSize:10,fontFamily:"DM Mono,monospace",maxWidth:220,lineHeight:1.7,textAlign:"center"}}>{curGrupo.desc}<br/><br/>Selecione um anunciante para começar a prospecção.</div></div></div>
            </>
          )}
        </div>
      </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   PIPELINE VIEW — GAIA e Holding
   Visual kanban limpo, sem precisar clicar em botão extra
   ═══════════════════════════════════════════════════════════════ */

function PipelineView({tipo}) {
  // tipo = 'gaia' ou 'holding'
  const isGaia = tipo === 'gaia';
  
  // Carrega dados do localStorage ou usa defaults
  const [kbData, setKbData] = React.useState(() => {
    const saved = lsGet('gh_kanban_v3', {});
    const tabs  = saved.tabs || KB_DEFAULT_TABS;
    return {
      gaia:    tabs.find(t => t.id === 'gaia')    || KB_DEFAULT_TABS.find(t => t.id === 'gaia'),
      holding: tabs.find(t => t.id === 'holding') || KB_DEFAULT_TABS.find(t => t.id === 'holding'),
    };
  });

  const tab = isGaia ? kbData.gaia : kbData.holding;
  const [dragId,    setDragId]    = React.useState(null);
  const [overCol,   setOverCol]   = React.useState(null);
  const [editCard,  setEditCard]  = React.useState(null); // card obj | {_new, col}
  const [filterEmp, setFilterEmp] = React.useState('Todos');
  const [search,    setSearch]    = React.useState('');

  if (!tab) return null;

  // ── Persistência ─────────────────────────────────────────────
  const persist = (newTab) => {
    const saved = lsGet('gh_kanban_v3', {});
    const tabs  = (saved.tabs || KB_DEFAULT_TABS).map(t => t.id === newTab.id ? newTab : t);
    lsSet('gh_kanban_v3', {...saved, tabs});
    setKbData(prev => ({...prev, [tipo]: newTab}));
  };

  // ── Filtro ────────────────────────────────────────────────────
  const cards = React.useMemo(() => {
    return (tab.cards || []).filter(c => {
      if (search && !c.name.toLowerCase().includes(search.toLowerCase()) &&
          !(c.nota||c.note||'').toLowerCase().includes(search.toLowerCase())) return false;
      if (!isGaia && filterEmp !== 'Todos' && (c.galeria||'') !== filterEmp) return false;
      if (isGaia  && filterEmp !== 'Todos' && (c.product||'') !== filterEmp) return false;
      return true;
    });
  }, [tab.cards, search, filterEmp]);

  // ── Stats ─────────────────────────────────────────────────────
  const stats = React.useMemo(() => {
    if (isGaia) {
      return [
        {label:'Clientes Ativos', val: cards.filter(c=>c.col==='clientes').length, color:'#34D399'},
        {label:'Em Reunião',      val: cards.filter(c=>c.col==='reuniao').length,  color:'#A78BFA'},
        {label:'Proposta',        val: cards.filter(c=>c.col==='proposta').length, color:'#fbbf24'},
        {label:'Aguardando',      val: cards.filter(c=>c.col==='aguardando').length,color:'#9ca3af'},
        {label:'Total',           val: cards.length,                               color:'#FF6B2B'},
      ];
    } else {
      const pipeline = cards.filter(c=>c.col!=='clienteativo').reduce((s,c)=>s+(+c.value||0),0);
      const ativos   = cards.filter(c=>c.col==='clienteativo').reduce((s,c)=>s+(+c.value||0),0);
      return [
        {label:'Pipeline',        val: kbFmtVal(pipeline)||'—',                    color:'#FF6B2B', big:true},
        {label:'Clientes Ativos', val: kbFmtVal(ativos)||'—',                      color:'#34D399', big:true},
        {label:'Concorrências',   val: cards.filter(c=>c.col==='concorrencia').length, color:'#fb923c'},
        {label:'Negociando',      val: cards.filter(c=>c.col==='negociacao').length,   color:'#f472b6'},
        {label:'Total',           val: cards.length,                                   color:'#eee'},
      ];
    }
  }, [cards]);

  // ── Drag & Drop ───────────────────────────────────────────────
  const onDrop = (colId) => {
    if (!dragId) return;
    const newCards = (tab.cards||[]).map(c => c.id===dragId ? {...c, col:colId} : c);
    persist({...tab, cards: newCards});
    setDragId(null); setOverCol(null);
  };

  // ── CRUD ──────────────────────────────────────────────────────
  const saveCard = (data) => {
    let newCards;
    if (data.id && !data._new) {
      newCards = (tab.cards||[]).map(c => c.id===data.id ? {...c,...data} : c);
    } else {
      const {_new, ...rest} = data;
      const newId = Math.max(0, ...(tab.cards||[]).map(c=>c.id||0)) + 1;
      newCards = [...(tab.cards||[]), {...rest, id: newId}];
    }
    persist({...tab, cards: newCards});
    setEditCard(null);
  };

  const deleteCard = (id) => {
    if (!window.confirm('Remover card?')) return;
    persist({...tab, cards: (tab.cards||[]).filter(c => c.id !== id)});
    setEditCard(null);
  };

  // ── Cores por coluna ─────────────────────────────────────────
  const ACCENT = {
    purple:'#a5a0f5', teal:'#34d399', blue:'#60a5fa', amber:'#fbbf24',
    green:'#86efac', red:'#f87171', orange:'#fb923c', gray:'#9ca3af',
    violet:'#c4b5fd', rose:'#fca5a5',
  };
  const colColor = (col) => ACCENT[col.accent||'gray'] || '#9ca3af';
  const colVal   = (colId) => (tab.cards||[])
    .filter(c=>c.col===colId).reduce((s,c)=>s+(+c.value||0),0);

  // ── GAIA tag labels ──────────────────────────────────────────
  const TAG_MAP = {mrr:'MRR','poc-paga':'POC paga','poc-free':'POC free',prop:'Proposta',camp:'Campanha'};
  const TAG_COLOR = {mrr:'#86efac','poc-paga':'#60a5fa','poc-free':'#9ca3af',prop:'#a5a0f5',camp:'#fbbf24'};

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:'#0D0D0D',overflow:'hidden'}}>

      {/* ── STATS BAR ─────────────────────────────────────────── */}
      <div style={{display:'flex',gap:8,padding:'10px 20px',borderBottom:'.5px solid #2D2D44',flexShrink:0,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{fontSize:13,fontWeight:600,color:'#F5F5F5',marginRight:8}}>
          {isGaia ? '⚡ Pipeline GAIA' : '🏢 Pipeline Holding'}
        </div>
        {stats.map(s => (
          <div key={s.label} style={{background:'#111827',border:'.5px solid #2D2D44',borderRadius:8,padding:'6px 14px',display:'flex',flexDirection:'column',gap:1}}>
            <span style={{fontSize:s.big?16:20,fontWeight:700,fontFamily:'IBM Plex Mono,monospace',color:s.color,lineHeight:1}}>{s.val}</span>
            <span style={{fontSize:8,color:'#555',fontFamily:'IBM Plex Mono,monospace',textTransform:'uppercase',letterSpacing:.5}}>{s.label}</span>
          </div>
        ))}

        {/* Filtros */}
        <div style={{marginLeft:'auto',display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          <input
            value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="Buscar..."
            style={{background:'#1A1A2E',border:'.5px solid #2D2D44',borderRadius:6,padding:'5px 10px',color:'#F5F5F5',fontSize:11,fontFamily:'IBM Plex Mono,monospace',outline:'none',width:140}}
          />
          {isGaia ? (
            ['Todos','CR.IA','BrandSync'].map(f => (
              <button key={f} onClick={()=>setFilterEmp(f)} style={{padding:'4px 10px',borderRadius:100,border:'.5px solid',fontSize:9,fontFamily:'IBM Plex Mono,monospace',cursor:'pointer',borderColor:filterEmp===f?'#FF6B2B':'#2D2D44',background:filterEmp===f?'rgba(255,107,43,.12)':'transparent',color:filterEmp===f?'#FF6B2B':'#9B9BB4'}}>{f}</button>
            ))
          ) : (
            ['Todos','Galeria','GAIA','Milà','404','ccCaramelo','Catalyst'].map(f => (
              <button key={f} onClick={()=>setFilterEmp(f)} style={{padding:'4px 10px',borderRadius:100,border:'.5px solid',fontSize:9,fontFamily:'IBM Plex Mono,monospace',cursor:'pointer',borderColor:filterEmp===f?'#FF6B2B':'#2D2D44',background:filterEmp===f?'rgba(255,107,43,.12)':'transparent',color:filterEmp===f?'#FF6B2B':'#9B9BB4'}}>{f}</button>
            ))
          )}
          <button onClick={()=>setEditCard({_new:true, col:(tab.cols||[])[0]?.id||'', name:'', galeria:'', value:'', product:'CR.IA', note:''})}
            style={{padding:'5px 14px',borderRadius:8,border:'none',background:'#FF6B2B',color:'#fff',fontSize:11,fontFamily:'IBM Plex Mono,monospace',cursor:'pointer',fontWeight:600}}>
            + Card
          </button>
        </div>
      </div>

      {/* ── BOARD ────────────────────────────────────────────────── */}
      <div style={{flex:1,overflowX:'auto',overflowY:'hidden',padding:'12px 20px 24px'}}>
        <div style={{display:'flex',gap:10,alignItems:'flex-start',minWidth:'max-content',height:'100%'}}>

          {(tab.cols||[]).map(col => {
            const colCards = cards.filter(c => c.col === col.id);
            const allColCards = (tab.cards||[]).filter(c => c.col === col.id);
            const cc = colColor(col);
            const cv = colVal(col.id);
            const isOver = overCol === col.id;

            return (
              <div key={col.id}
                style={{width:210,flexShrink:0,display:'flex',flexDirection:'column',height:'100%',maxHeight:'calc(100vh - 160px)'}}
                onDragOver={e=>{e.preventDefault();setOverCol(col.id);}}
                onDrop={()=>onDrop(col.id)}
                onDragLeave={()=>setOverCol(null)}>

                {/* Col header */}
                <div style={{padding:'10px 12px 8px',background:isOver?`rgba(${cc.slice(1).match(/.{2}/g).map(x=>parseInt(x,16)).join(',')},0.08)`:'#111827',borderRadius:'8px 8px 0 0',border:`.5px solid ${isOver?cc:'#2D2D44'}`,borderBottom:'none',flexShrink:0}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:3}}>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <div style={{width:7,height:7,borderRadius:'50%',background:cc}}/>
                      <span style={{fontSize:9,fontWeight:700,color:cc,textTransform:'uppercase',letterSpacing:.8,fontFamily:'IBM Plex Mono,monospace'}}>{col.label}</span>
                    </div>
                    <span style={{fontSize:10,fontFamily:'IBM Plex Mono,monospace',background:'rgba(255,255,255,.06)',color:'#9B9BB4',padding:'1px 7px',borderRadius:100}}>{allColCards.length}</span>
                  </div>
                  {cv > 0 && (
                    <div style={{fontSize:10,fontFamily:'IBM Plex Mono,monospace',color:cc,fontWeight:600}}>
                      {kbFmtVal(cv)}
                    </div>
                  )}
                </div>

                {/* Cards */}
                <div style={{flex:1,overflowY:'auto',background:'#0f1623',border:`.5px solid ${isOver?cc:'#2D2D44'}`,borderTop:'none',borderRadius:'0 0 8px 8px',padding:'6px 8px',display:'flex',flexDirection:'column',gap:6}}>
                  {colCards.map(card => {
                    const galLabel = card.galeria || card.product || null;
                    const galColor = {
                      'CR.IA':'rgba(83,74,183,.8)','BrandSync':'rgba(15,110,86,.8)',
                      'Galeria':'rgba(232,201,122,.8)','Milà':'rgba(201,168,124,.8)',
                      '404':'rgba(126,184,212,.8)','ccCaramelo':'rgba(232,145,106,.8)',

                          )}
