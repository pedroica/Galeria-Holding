                      </div>
                    );
                  })}

                  {/* Drop zone */}
                  <div style={{minHeight:32,border:`1px dashed ${isOver?cc:'#2D2D44'}`,borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s',marginTop:2,opacity:.6}}
                    onDragOver={e=>{e.preventDefault();setOverCol(col.id);}}
                    onDrop={()=>onDrop(col.id)}>
                    <span style={{fontSize:9,color:isOver?cc:'#2D2D44',fontFamily:'IBM Plex Mono,monospace'}}>{isOver?'Soltar aqui':'+ novo card'}</span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ── MODAL EDITAR / CRIAR CARD ─────────────────────────── */}
      {editCard && (
        <PipelineCardModal
          card={editCard}
          cols={tab.cols||[]}
          isGaia={isGaia}
          onSave={saveCard}
          onDelete={editCard.id && !editCard._new ? ()=>deleteCard(editCard.id) : null}
          onClose={()=>setEditCard(null)}
        />
      )}
    </div>
  );
}

// KANBAN DIÁRIO — Hot Pipeline GAIA + Holding
// Estilo planilha: linhas = empresas, colunas = etapas
// Storage: gh_hotpipeline_v1
// ═══════════════════════════════════════════════════════════════

const HP_STORAGE = 'gh_hotpipeline_v1';

const HP_ETAPAS = [
  { id:'contato',    label:'1º Contato',      color:'#60A5FA', short:'Contato'   },
  { id:'reuniao',    label:'1ª Reunião',       color:'#A78BFA', short:'Reunião'   },
  { id:'proposta',   label:'Proposta',         color:'#fbbf24', short:'Proposta'  },
  { id:'negociacao', label:'Negociação',       color:'#fb923c', short:'Negoc.'    },
  { id:'fechamento', label:'Fechamento',       color:'#34D399', short:'Fechado'   },
];

const HP_STATUS = [
  { id:'ok',      label:'✓ Ok',         color:'#34D399', bg:'rgba(52,211,153,.12)'  },
  { id:'atencao', label:'⚠ Atenção',    color:'#fbbf24', bg:'rgba(251,191,36,.12)'  },
  { id:'risco',   label:'🔴 Risco',     color:'#f87171', bg:'rgba(248,113,113,.12)' },
  { id:'',        label:'—',            color:'#2D2D44', bg:'transparent'           },
];

const HP_EMPRESA_GALERIA = ['GAIA','Galeria','Milà','Catalyst','404','ccCaramelo','Vitrine','A.gente','GUX'];

function hpLoad() {
  try { return JSON.parse(localStorage.getItem(HP_STORAGE) || 'null') || { gaia: [], holding: [] }; }
  catch { return { gaia: [], holding: [] }; }
}
function hpSave(data) {
  try { localStorage.setItem(HP_STORAGE, JSON.stringify(data)); } catch {}
}
function hpId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

// ── Seed inicial com dados do KB_DEFAULT_TABS ──────────────────
function hpSeedFromKanban() {
  const saved = hpLoad();
  // Só faz seed se ainda não tem dados
  if (saved.gaia.length > 0 || saved.holding.length > 0) return saved;

  const kbRaw  = (() => { try { return JSON.parse(localStorage.getItem('gh_kanban_v3')||'null'); } catch { return null; } })();
  const kbTabs = (kbRaw && kbRaw.tabs) ? kbRaw.tabs : (typeof KB_DEFAULT_TABS !== 'undefined' ? KB_DEFAULT_TABS : []);

  const gaiaTab    = kbTabs.find(t => t.id === 'gaia');
  const holdingTab = kbTabs.find(t => t.id === 'holding');

  // Mapeia colunas do kanban → etapa do HP
  const gaiaColMap    = { poc:'contato', reuniao:'reuniao', proposta:'reuniao', aguardando:'proposta' };
  const holdingColMap = { contatodir:'contato', primreuniao:'reuniao', negocdiret:'proposta', negociacao:'negociacao', concorrencia:'proposta' };

  const gaiaCards = (gaiaTab?.cards || [])
    .filter(c => gaiaColMap[c.col])
    .map(c => ({
      id: hpId(), nome: c.name, empresa_galeria: '',
      produto: c.product || 'CR.IA',
      etapa: gaiaColMap[c.col],
      valor: c.value || 0,
      status: '',
      responsavel: '',
      nota: c.note || '',
      updatedAt: new Date().toLocaleDateString('pt-BR'),
    }));

  const holdingCards = (holdingTab?.cards || [])
    .filter(c => holdingColMap[c.col])
    .map(c => ({
      id: hpId(), nome: c.name, empresa_galeria: c.galeria || '',
      produto: '',
      etapa: holdingColMap[c.col],
      valor: c.value || 0,
      status: '',
      responsavel: '',
      nota: c.note || '',
      updatedAt: new Date().toLocaleDateString('pt-BR'),
    }));

  const seeded = { gaia: gaiaCards, holding: holdingCards };
  hpSave(seeded);
  return seeded;
}

// ── Componente principal ───────────────────────────────────────
function KanbanDiario() {
  const [aba,     setAba]     = React.useState('gaia');
  const [data,    setData]    = React.useState(() => hpSeedFromKanban());
  const [editId,  setEditId]  = React.useState(null);  // id do card em edição inline
  const [addOpen, setAddOpen] = React.useState(false);
  const [search,  setSearch]  = React.useState('');
  const [filtroEtapa, setFiltroEtapa] = React.useState('todas');
  const [filtroEmp,   setFiltroEmp]   = React.useState('Todos');

  const isGaia    = aba === 'gaia';
  const rows      = data[aba] || [];

  const persist = (newData) => { setData(newData); hpSave(newData); };

  const updateRow = (id, changes) => {
    const newRows = rows.map(r => r.id === id ? { ...r, ...changes, updatedAt: new Date().toLocaleDateString('pt-BR') } : r);
    persist({ ...data, [aba]: newRows });
  };

  const deleteRow = (id) => {
    if (!window.confirm('Remover empresa do pipeline diário?')) return;
    persist({ ...data, [aba]: rows.filter(r => r.id !== id) });
  };

  const addRow = (row) => {
    persist({ ...data, [aba]: [...rows, { ...row, id: hpId(), updatedAt: new Date().toLocaleDateString('pt-BR') }] });
    setAddOpen(false);
  };

  // filtros
  const filtered = React.useMemo(() => rows.filter(r => {
    if (search && !r.nome.toLowerCase().includes(search.toLowerCase())) return false;
    if (filtroEtapa !== 'todas' && r.etapa !== filtroEtapa) return false;
    if (!isGaia && filtroEmp !== 'Todos' && r.empresa_galeria !== filtroEmp) return false;
    return true;
  }), [rows, search, filtroEtapa, filtroEmp, isGaia]);

  // KPIs
  const kpis = React.useMemo(() => {
    const ativas = rows.filter(r => r.etapa !== 'fechamento');
    const fechadas = rows.filter(r => r.etapa === 'fechamento');
    const pipeline = ativas.reduce((s,r) => s + (+r.valor||0), 0);
    const risco = rows.filter(r => r.status === 'risco').length;
    const atencao = rows.filter(r => r.status === 'atencao').length;
    return { total: rows.length, pipeline, fechadas: fechadas.length, risco, atencao };
  }, [rows]);

  const etapaCount = (etId) => rows.filter(r => r.etapa === etId).length;

  const cellStyle = (row, etId) => {
    const isActive = row.etapa === etId;
    const et = HP_ETAPAS.find(e => e.id === etId);
    return {
      width: 110, minWidth: 110,
      padding: '0 8px',
      textAlign: 'center',
      cursor: 'pointer',
      background: isActive ? `${et.color}18` : 'transparent',
      borderRight: '.5px solid #1e2433',
      transition: 'background .12s',
    };
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', background:'#0D0D0D', overflow:'hidden' }}>

      {/* ── ABA SELECTOR ────────────────────────────────────────── */}
      <div style={{ display:'flex', alignItems:'center', gap:0, padding:'8px 20px 0', borderBottom:'.5px solid #2D2D44', flexShrink:0, background:'#0D0D0D' }}>
        {[['gaia','⚡ GAIA','#A78BFA'],['holding','🏢 Holding','#FF6B2B']].map(([id,label,color]) => (
          <button key={id} onClick={() => { setAba(id); setSearch(''); setFiltroEtapa('todas'); setFiltroEmp('Todos'); }}
            style={{ padding:'8px 20px', border:'none', borderBottom: aba===id ? `2px solid ${color}` : '2px solid transparent',
              background:'transparent', color: aba===id ? color : '#555', fontSize:12, fontWeight: aba===id?700:400,
              fontFamily:'IBM Plex Mono,monospace', cursor:'pointer', transition:'all .15s' }}>
            {label}
            <span style={{ marginLeft:8, fontSize:9, background: aba===id ? `${color}22`:'#1A1A2E',
              color: aba===id ? color : '#555', padding:'1px 7px', borderRadius:100, fontWeight:400 }}>
              {(data[id]||[]).length}
            </span>
          </button>
        ))}
      </div>

      {/* ── KPIs ───────────────────────────────────────────────── */}
      <div style={{ display:'flex', gap:8, padding:'10px 20px', borderBottom:'.5px solid #2D2D44', flexShrink:0, flexWrap:'wrap' }}>
        {[
          ['Hot Pipeline', kbFmtVal(kpis.pipeline)||'R$ 0', '#FF6B2B', true],
          ['Em Andamento', kpis.total - kpis.fechadas, '#60A5FA', false],
          ['Fechamentos', kpis.fechadas, '#34D399', false],
          ['Em Risco', kpis.risco, '#f87171', false],
          ['Atenção', kpis.atencao, '#fbbf24', false],
        ].map(([label, val, color, big]) => (
          <div key={label} style={{ background:'#111827', border:`.5px solid ${color}22`, borderRadius:8, padding:'8px 14px' }}>
            <div style={{ fontSize: big?18:20, fontWeight:700, fontFamily:'IBM Plex Mono,monospace', color, lineHeight:1 }}>{val}</div>
            <div style={{ fontSize:8, color:'#555', fontFamily:'IBM Plex Mono,monospace', textTransform:'uppercase', letterSpacing:.5, marginTop:3 }}>{label}</div>
          </div>
        ))}

        {/* etapa mini-contadores */}
        <div style={{ marginLeft:'auto', display:'flex', gap:6, alignItems:'center' }}>
          {HP_ETAPAS.map(et => (
            <div key={et.id} onClick={() => setFiltroEtapa(filtroEtapa===et.id?'todas':et.id)}
              style={{ padding:'4px 10px', borderRadius:100, background: filtroEtapa===et.id?`${et.color}18`:'#1A1A2E',
                border:`.5px solid ${filtroEtapa===et.id?et.color:'#2D2D44'}`, cursor:'pointer', display:'flex', alignItems:'center', gap:5 }}>
              <span style={{ fontSize:8, fontFamily:'IBM Plex Mono,monospace', color: filtroEtapa===et.id?et.color:'#555' }}>{et.short}</span>
              <span style={{ fontSize:9, fontWeight:700, fontFamily:'IBM Plex Mono,monospace', color: et.color }}>{etapaCount(et.id)}</span>

        </div>
      </div>

      {/* ── TOOLBAR ─────────────────────────────────────────────── */}
      <div style={{ display:'flex', gap:8, padding:'8px 20px', flexShrink:0, alignItems:'center', flexWrap:'wrap', borderBottom:'.5px solid #1e2433' }}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar empresa..."
          style={{ background:'#1A1A2E', border:'.5px solid #2D2D44', borderRadius:6, padding:'6px 11px',
            color:'#F5F5F5', fontSize:11, fontFamily:'IBM Plex Mono,monospace', outline:'none', width:180 }} />
        {!isGaia && (
          <select value={filtroEmp} onChange={e=>setFiltroEmp(e.target.value)}
            style={{ background:'#1A1A2E', border:'.5px solid #2D2D44', borderRadius:6, padding:'6px 10px',
              color:'#9B9BB4', fontSize:10, fontFamily:'IBM Plex Mono,monospace', outline:'none', cursor:'pointer' }}>
            <option>Todos</option>
            {HP_EMPRESA_GALERIA.map(e=><option key={e}>{e}</option>)}
          </select>
        )}
        <span style={{ fontSize:9, color:'#555', fontFamily:'IBM Plex Mono,monospace', marginRight:'auto' }}>

        </span>
        <button onClick={() => setAddOpen(true)}

          + Adicionar

      </div>

      {/* ── TABELA ──────────────────────────────────────────────── */}
      <div style={{ flex:1, overflow:'auto' }}>
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:11, minWidth:800 }}>
          <thead style={{ position:'sticky', top:0, zIndex:10, background:'#0D0D0D' }}>
            <tr>
              <th style={{ width:200, padding:'9px 16px', textAlign:'left', fontSize:8, fontFamily:'IBM Plex Mono,monospace',
                color:'#555', textTransform:'uppercase', letterSpacing:1, borderBottom:'.5px solid #2D2D44', borderRight:'.5px solid #1e2433' }}>
                Empresa
              </th>
              {!isGaia && (
                <th style={{ width:90, padding:'9px 8px', textAlign:'center', fontSize:8, fontFamily:'IBM Plex Mono,monospace',
                  color:'#555', textTransform:'uppercase', letterSpacing:1, borderBottom:'.5px solid #2D2D44', borderRight:'.5px solid #1e2433' }}>
                  Galeria
                </th>
              )}
              {isGaia && (
                <th style={{ width:90, padding:'9px 8px', textAlign:'center', fontSize:8, fontFamily:'IBM Plex Mono,monospace',
                  color:'#555', textTransform:'uppercase', letterSpacing:1, borderBottom:'.5px solid #2D2D44', borderRight:'.5px solid #1e2433' }}>
                  Produto
                </th>

              {HP_ETAPAS.map(et => (
                <th key={et.id} style={{ width:110, padding:'9px 8px', textAlign:'center',
                  fontSize:8, fontFamily:'IBM Plex Mono,monospace', color: et.color,
                  textTransform:'uppercase', letterSpacing:.8,
                  borderBottom:'.5px solid #2D2D44', borderRight:'.5px solid #1e2433',
                  background:`${et.color}06` }}>
                  {et.short}
                  <div style={{ fontSize:11, fontWeight:700, marginTop:1 }}>{etapaCount(et.id)}</div>
                </th>
              ))}
              <th style={{ width:80, padding:'9px 8px', textAlign:'center', fontSize:8, fontFamily:'IBM Plex Mono,monospace',
                color:'#555', textTransform:'uppercase', letterSpacing:1, borderBottom:'.5px solid #2D2D44', borderRight:'.5px solid #1e2433' }}>

              </th>
              <th style={{ width:80, padding:'9px 8px', textAlign:'center', fontSize:8, fontFamily:'IBM Plex Mono,monospace',
                color:'#555', textTransform:'uppercase', letterSpacing:1, borderBottom:'.5px solid #2D2D44', borderRight:'.5px solid #1e2433' }}>
                Status
              </th>
              <th style={{ minWidth:160, padding:'9px 12px', textAlign:'left', fontSize:8, fontFamily:'IBM Plex Mono,monospace',
                color:'#555', textTransform:'uppercase', letterSpacing:1, borderBottom:'.5px solid #2D2D44' }}>
                Nota / Próxima ação
              </th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan={10} style={{ textAlign:'center', padding:60, color:'#444', fontFamily:'IBM Plex Mono,monospace', fontSize:11 }}>

              </td></tr>
            )}
            {filtered.map((row, idx) => {
              const isEditing = editId === row.id;
              const statusObj = HP_STATUS.find(s => s.id === row.status) || HP_STATUS[3];
              const rowBg = idx%2===0 ? '#0D0D0D' : '#0f1118';

              return (
                <tr key={row.id} style={{ background: rowBg, transition:'background .1s' }}

                  {/* Nome empresa */}
                  <td style={{ padding:'0 16px', borderBottom:'.5px solid #111827', borderRight:'.5px solid #1e2433', height:44 }}>
                    {isEditing ? (
                      <input autoFocus value={row.nome}
                        onChange={e => updateRow(row.id, {nome:e.target.value})}
                        onBlur={() => setEditId(null)}
                        style={{ background:'transparent', border:'none', outline:'none', color:'#F5F5F5', fontSize:12, fontWeight:500, width:'100%', fontFamily:'Inter,sans-serif' }}

                      <div onClick={() => setEditId(row.id)} style={{ display:'flex', alignItems:'center', gap:8, cursor:'text' }}>
                        <div style={{ width:24, height:24, borderRadius:5, background:`linear-gradient(135deg,${getGrad(row.nome)[0]},${getGrad(row.nome)[1]})`,

                        <span style={{ fontSize:12, fontWeight:500, color:'#F5F5F5', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{row.nome}</span>
                      </div>
                    )}
                  </td>

                  {/* Empresa Galeria (Holding) ou Produto (GAIA) */}
                  <td style={{ padding:'0 8px', borderBottom:'.5px solid #111827', borderRight:'.5px solid #1e2433', textAlign:'center' }}>
                    <select value={isGaia ? row.produto||'' : row.empresa_galeria||''}
                      onChange={e => updateRow(row.id, isGaia ? {produto:e.target.value} : {empresa_galeria:e.target.value})}
                      style={{ background:'transparent', border:'none', outline:'none', fontSize:9, fontFamily:'IBM Plex Mono,monospace',
                        color: isGaia ? (row.produto==='CR.IA'?'#A78BFA':'#34D399') : '#FF6B2B', cursor:'pointer', textAlign:'center', width:'100%' }}>

                        <><option value="CR.IA">CR.IA</option><option value="BrandSync">BrandSync</option></>
                      ) : (
                        <><option value="">—</option>{HP_EMPRESA_GALERIA.map(e=><option key={e}>{e}</option>)}</>
                      )}
                    </select>
                  </td>

                  {/* Etapas — célula clicável para mover */}
                  {HP_ETAPAS.map(et => {
                    const isActive = row.etapa === et.id;
                    return (
                      <td key={et.id} onClick={() => updateRow(row.id, {etapa: et.id})}
                        style={{ ...cellStyle(row, et.id), borderBottom:'.5px solid #111827', height:44, position:'relative' }}>
                        {isActive && (
                          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:4 }}>
                            <div style={{ width:8, height:8, borderRadius:'50%', background:et.color, boxShadow:`0 0 6px ${et.color}` }}/>
                            <span style={{ fontSize:8, fontFamily:'IBM Plex Mono,monospace', color:et.color, fontWeight:700 }}>AQUI</span>
                          </div>
                        )}
                      </td>
                    );
                  })}

                  {/* Valor */}
                  <td style={{ padding:'0 8px', borderBottom:'.5px solid #111827', borderRight:'.5px solid #1e2433', textAlign:'center' }}>
                    <input type="number" value={row.valor||''} placeholder="0"
                      onChange={e => updateRow(row.id, {valor:parseInt(e.target.value)||0})}
                      style={{ background:'transparent', border:'none', outline:'none', fontSize:10, fontFamily:'IBM Plex Mono,monospace',
                        color:'#34D399', textAlign:'center', width:'100%', cursor:'text' }}
                    />
                  </td>

                  {/* Status */}
                  <td style={{ padding:'0 8px', borderBottom:'.5px solid #111827', borderRight:'.5px solid #1e2433', textAlign:'center' }}>
                    <select value={row.status||''}
                      onChange={e => updateRow(row.id, {status:e.target.value})}
                      style={{ background: statusObj.bg, border:`.5px solid ${statusObj.color}44`,
                        borderRadius:100, padding:'2px 6px', fontSize:9, fontFamily:'IBM Plex Mono,monospace',
                        color:statusObj.color, cursor:'pointer', outline:'none', textAlign:'center', width:'100%' }}>
                      {HP_STATUS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                    </select>
                  </td>

                  {/* Nota — editável inline */}
                  <td style={{ padding:'0 12px', borderBottom:'.5px solid #111827' }}>
                    <input value={row.nota||''} placeholder="Próxima ação, contexto..."
                      onChange={e => updateRow(row.id, {nota:e.target.value})}
                      style={{ background:'transparent', border:'none', outline:'none', fontSize:10, fontFamily:'IBM Plex Mono,monospace',
                        color:'#9B9BB4', width:'100%', cursor:'text' }}
                    />
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>

        {/* Total pipeline na última linha */}
        {filtered.length > 0 && (
          <div style={{ padding:'10px 16px', borderTop:'.5px solid #2D2D44', display:'flex', alignItems:'center', gap:16,
            background:'#0D0D0D', fontSize:10, fontFamily:'IBM Plex Mono,monospace', color:'#555', position:'sticky', bottom:0 }}>
            <span>{filtered.length} empresa{filtered.length!==1?'s':''}</span>
            <span style={{ color:'#FF6B2B', fontWeight:700 }}>
              Pipeline: {kbFmtVal(filtered.reduce((s,r)=>s+(+r.valor||0),0)) || 'R$ 0'}
            </span>
            <span style={{ color:'#34D399' }}>
              Fechamentos: {kbFmtVal(filtered.filter(r=>r.etapa==='fechamento').reduce((s,r)=>s+(+r.valor||0),0)) || '—'}
            </span>
            <span style={{ marginLeft:'auto', color:'#2D2D44' }}>Atualizado: {filtered[0]?.updatedAt||'—'}</span>
          </div>
        )}
      </div>

      {/* ── MODAL ADICIONAR ─────────────────────────────────────── */}
      {addOpen && <HpAddModal isGaia={isGaia} onSave={addRow} onClose={()=>setAddOpen(false)}/>}
    </div>
  );
}

          </div>

          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
            <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
              <label style={{ fontSize:9, color:'#9B9BB4', fontFamily:'IBM Plex Mono,monospace', textTransform:'uppercase', letterSpacing:.5 }}>

                {isGaia

              <select value={f.etapa} onChange={e=>up('etapa',e.target.value)}
                style={{ background:'#0D0D0D', border:'.5px solid #2D2D44', borderRadius:8, padding:'9px 12px', color:'#F5F5F5', fontSize:12, outline:'none', cursor:'pointer' }}>
                {HP_ETAPAS.map(et=><option key={et.id} value={et.id}>{et.label}</option>)}

            </div>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
            <div style={{ display:'flex', flexDirection:'column', gap:4 }}>

              <input type="number" min="0" value={f.valor} onChange={e=>up('valor',e.target.value)}

                style={{ background:'#0D0D0D', border:'.5px solid #2D2D44', borderRadius:8, padding:'9px 12px', color:'#34D399', fontSize:12, fontFamily:'IBM Plex Mono,monospace', outline:'none' }}/>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
              <label style={{ fontSize:9, color:'#9B9BB4', fontFamily:'IBM Plex Mono,monospace', textTransform:'uppercase', letterSpacing:.5 }}>Status</label>
              <select value={f.status} onChange={e=>up('status',e.target.value)}

// COLD CALL DECISORES
// Lista só empresas com decisores cadastrados
// Fluxo: empresa → decisores → ligar / email / WhatsApp / abordar
// ═══════════════════════════════════════════════════════════════

function ColdCallDecisores({accs, setAccs, curGrupo, alertas, onActivitySaved}) {
  const [selEmpresa,  setSelEmpresa]  = React.useState(null);
  const [search,      setSearch]      = React.useState('');
  const [filtroSetor, setFiltroSetor] = React.useState('Todos');
  const [done,        setDone]        = React.useState({});   // {empresaRank_decNome: tipo}
  const [noteMap,     setNoteMap]     = React.useState({});
  const [abordagem,   setAbordagem]   = React.useState(null); // {decisor, empresa, setor}
  const todayStr = new Date().toLocaleDateString('pt-BR');

  // ── Empresas que têm pelo menos 1 decisor verificado ──────────
  const empresasComDec = React.useMemo(() => {
    const base = (typeof PROSP !== 'undefined' ? PROSP : []).filter(e => e.setor);
    return base
      .map(e => {
        const k   = curGrupo.id + '_' + e.rank;
        const acc = (accs||{})[k] || {decisors:[], sugeridos:[], activities:[]};
        return { ...e, acc, nVer: (acc.decisors||[]).length, nSug: (acc.sugeridos||[]).length };
      })
      .filter(e => e.nVer > 0)
      .sort((a,b) => b.nVer - a.nVer);
  }, [accs, curGrupo.id]);

  const setores = React.useMemo(() => {
    const s = new Set(empresasComDec.map(e => e.setor).filter(Boolean));
    return ['Todos', ...Array.from(s).sort()];
  }, [empresasComDec]);

  const filtradas = React.useMemo(() => {
    const q = search.toLowerCase();
    return empresasComDec.filter(e => {
      if (q && !e.nome.toLowerCase().includes(q)) return false;
      if (filtroSetor !== 'Todos' && e.setor !== filtroSetor) return false;
      return true;
    });
  }, [empresasComDec, search, filtroSetor]);

  const totalDone = Object.keys(done).length;

  // ── Log de atividade ──────────────────────────────────────────
  const logAtividade = async (empresa, decisor, tipo) => {
    const key = empresa.rank + '_' + decisor.nome;
    setDone(d => ({ ...d, [key]: tipo }));

    // Salvar na acc da empresa
    const k   = curGrupo.id + '_' + empresa.rank;
    const acc = (accs||{})[k] || {decisors:[], sugeridos:[], activities:[]};
    const nota = noteMap[key] || '';
    const atividade = {
      type: tipo,
      date: todayStr,
      isoDate: new Date().toISOString(),
      desc: (tipo === 'call' ? '📞 Cold Call' : tipo === 'email' ? '✉ Email' : '💬 WhatsApp') + (decisor.nome ? ` — ${decisor.nome}` : ''),
      nota,
      decisor: decisor.nome,
    };
    const novoAcc = { ...acc, activities: [...(acc.activities||[]), atividade] };
    const newAccs = { ...(accs||{}), [k]: novoAcc };
    setAccs(newAccs);
    lsSet('gh_decisores_v3', newAccs);
    if (onActivitySaved) await onActivitySaved(empresa.nome, tipo, atividade.desc, '', nota);
  };

  const gc = curGrupo?.color || '#FF6B2B';

  // ── VIEW: decisores de uma empresa selecionada ────────────────
  if (selEmpresa) {
    const verificados = selEmpresa.acc.decisors || [];
    const atividades  = (selEmpresa.acc.activities || []).slice(-5).reverse();

    return (
      <div style={{display:'flex', flexDirection:'column', height:'100%', background:'#0D0D0D', overflow:'hidden'}}>
        {abordagem && (
          <AbordagemModal
            decisor={abordagem.decisor}
            empresa={abordagem.empresa}
            setor={abordagem.setor}
            onClose={() => setAbordagem(null)}
            onKanbanAdd={() => {}}
          />
        )}

        {/* Header */}
        <div style={{padding:'14px 20px', borderBottom:'.5px solid #2D2D44', display:'flex', alignItems:'center', gap:12, flexShrink:0}}>
          <button onClick={() => setSelEmpresa(null)}
            style={{padding:'5px 12px', borderRadius:6, border:'.5px solid #2D2D44', background:'transparent', color:'#9B9BB4', fontSize:11, cursor:'pointer', fontFamily:'IBM Plex Mono,monospace'}}>
            ← Voltar
          </button>
          <div style={{flex:1}}>
            <div style={{fontSize:16, fontWeight:700, color:'#F5F5F5'}}>{selEmpresa.nome}</div>
            <div style={{fontSize:9, color:'#555', fontFamily:'IBM Plex Mono,monospace', marginTop:2}}>
              {selEmpresa.setor} · {verificados.length} decisor{verificados.length!==1?'es':''} verificado{verificados.length!==1?'s':''}
            </div>
          </div>
          <div style={{fontSize:11, fontFamily:'IBM Plex Mono,monospace', color:'#34D399'}}>
            {Object.keys(done).filter(k => k.startsWith(selEmpresa.rank+'_')).length} contatos hoje
          </div>
        </div>

        <div style={{flex:1, overflowY:'auto', padding:'20px'}}>

          {/* Decisores */}
          <div style={{marginBottom:28}}>
            <div style={{fontSize:9, fontFamily:'IBM Plex Mono,monospace', color:'#9B9BB4', textTransform:'uppercase', letterSpacing:1, marginBottom:14, display:'flex', alignItems:'center', gap:8}}>
              📋 Decisores
              <div style={{flex:1, height:.5, background:'#2D2D44'}}/>
            </div>

            <div style={{display:'flex', flexDirection:'column', gap:10}}>
              {verificados.map((dec, idx) => {
                const key     = selEmpresa.rank + '_' + dec.nome;
                const isDone  = !!done[key];
                const doneType = done[key];
                const g = getGrad(dec.nome);

                return (
                  <div key={idx} style={{
                    background: isDone ? 'rgba(52,211,153,.04)' : '#111827',
                    border: `.5px solid ${isDone ? 'rgba(52,211,153,.3)' : '#2D2D44'}`,
                    borderRadius: 10, padding: '14px 16px',
                    opacity: isDone ? .7 : 1, transition: 'all .15s'
                  }}>
                    <div style={{display:'flex', alignItems:'flex-start', gap:12}}>
                      {/* Avatar */}
                      <div style={{width:40, height:40, borderRadius:10, background:`linear-gradient(135deg,${g[0]},${g[1]})`,
                        display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, fontWeight:700, color:'#fff', flexShrink:0}}>
                        {ini(dec.nome)}
                      </div>

                      {/* Info */}
                      <div style={{flex:1, minWidth:0}}>
                        <div style={{fontSize:14, fontWeight:600, color:'#F5F5F5', marginBottom:2}}>{dec.nome}</div>
                        <div style={{fontSize:10, color:'#9B9BB4', fontFamily:'IBM Plex Mono,monospace', marginBottom:6}}>{dec.cargo}</div>

                        {/* Contatos disponíveis */}
                        <div style={{display:'flex', gap:6, flexWrap:'wrap', marginBottom:8}}>
                          {dec.email && (
                            <a href={`mailto:${dec.email}`}
                              style={{fontSize:9, fontFamily:'IBM Plex Mono,monospace', color:'#60A5FA', background:'rgba(96,165,250,.1)', border:'.5px solid rgba(96,165,250,.3)', padding:'3px 8px', borderRadius:100, textDecoration:'none'}}>
                              ✉ {dec.email}
                            </a>
                          )}
                          {dec.wa && (
                            <a href={`https://wa.me/${dec.wa.replace(/\D/g,'')}`} target="_blank"
                              style={{fontSize:9, fontFamily:'IBM Plex Mono,monospace', color:'#25D366', background:'rgba(37,211,102,.1)', border:'.5px solid rgba(37,211,102,.3)', padding:'3px 8px', borderRadius:100, textDecoration:'none'}}>
                              💬 {dec.wa}
                            </a>
                          )}
                          {dec.linkedin && (
                            <a href={dec.linkedin} target="_blank"
                              style={{fontSize:9, fontFamily:'IBM Plex Mono,monospace', color:'#A78BFA', background:'rgba(167,139,250,.1)', border:'.5px solid rgba(167,139,250,.3)', padding:'3px 8px', borderRadius:100, textDecoration:'none'}}>
                              in LinkedIn
                            </a>
                          )}
                        </div>

                        {/* Nota */}
                        {!isDone && (
                          <input
                            value={noteMap[key] || ''}
                            onChange={ev => setNoteMap(n => ({...n, [key]: ev.target.value}))}
                            placeholder="Nota rápida (ex: falou que pode se reunir semana que vem)..."
                            style={{width:'100%', background:'#0D0D0D', border:'.5px solid #2D2D44', borderRadius:6,
                              padding:'6px 10px', color:'#F5F5F5', fontSize:10, fontFamily:'IBM Plex Mono,monospace', outline:'none', marginBottom:8}}
                          />
                        )}

                        {/* Ações */}
                        {!isDone ? (
                          <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
                            <button onClick={() => logAtividade(selEmpresa, dec, 'call')}
                              style={{padding:'6px 14px', borderRadius:7, border:'none', background:gc, color:'#fff',
                                fontSize:10, fontFamily:'IBM Plex Mono,monospace', cursor:'pointer', fontWeight:700}}>
                              📞 Ligar
                            </button>
                            <button onClick={() => logAtividade(selEmpresa, dec, 'email')}
                              style={{padding:'6px 14px', borderRadius:7, border:`.5px solid ${gc}44`, background:`${gc}12`,
                                color:gc, fontSize:10, fontFamily:'IBM Plex Mono,monospace', cursor:'pointer'}}>
                              ✉ Email
                            </button>
                            {dec.wa && (
                              <button onClick={() => { window.open(`https://wa.me/${dec.wa.replace(/\D/g,'')}`, '_blank'); logAtividade(selEmpresa, dec, 'wa'); }}
                                style={{padding:'6px 14px', borderRadius:7, border:'.5px solid rgba(37,211,102,.3)', background:'rgba(37,211,102,.1)',
                                  color:'#25D366', fontSize:10, fontFamily:'IBM Plex Mono,monospace', cursor:'pointer'}}>
                                💬 WhatsApp
                              </button>
                            )}
                            <button onClick={() => setAbordagem({decisor:dec, empresa:selEmpresa.nome, setor:selEmpresa.setor})}
                              style={{padding:'6px 14px', borderRadius:7, border:'.5px solid #2D2D44', background:'transparent',
                                color:'#9B9BB4', fontSize:10, fontFamily:'IBM Plex Mono,monospace', cursor:'pointer'}}>
                              ⚡ Gerar abordagem
                            </button>
                          </div>
                        ) : (
                          <div style={{display:'flex', alignItems:'center', gap:8}}>
                            <span style={{fontSize:11, color:'#34D399', fontFamily:'IBM Plex Mono,monospace', fontWeight:700}}>
                              ✓ {doneType==='call'?'Ligado':doneType==='email'?'Email enviado':'WhatsApp enviado'} hoje
                            </span>
                            <button onClick={() => setDone(d => { const n={...d}; delete n[key]; return n; })}
                              style={{fontSize:9, color:'#555', fontFamily:'IBM Plex Mono,monospace', background:'none', border:'none', cursor:'pointer'}}>
                              desfazer
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Últimas atividades */}
          {atividades.length > 0 && (
            <div>
              <div style={{fontSize:9, fontFamily:'IBM Plex Mono,monospace', color:'#555', textTransform:'uppercase', letterSpacing:1, marginBottom:10, display:'flex', alignItems:'center', gap:8}}>
                Histórico recente
                <div style={{flex:1, height:.5, background:'#1e1e1e'}}/>
              </div>
              {atividades.map((a, i) => (
                <div key={i} style={{display:'flex', gap:10, padding:'8px 0', borderBottom:'.5px solid #111827'}}>
                  <span style={{fontSize:14, flexShrink:0}}>{a.type==='call'?'📞':a.type==='email'?'✉':'💬'}</span>
                  <div>
                    <div style={{fontSize:10, color:'#F5F5F5', fontFamily:'IBM Plex Mono,monospace'}}>{a.desc}</div>
                    {a.nota && <div style={{fontSize:9, color:'#555', marginTop:2}}>{a.nota}</div>}
                    <div style={{fontSize:8, color:'#333', marginTop:2, fontFamily:'IBM Plex Mono,monospace'}}>{a.date}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ── VIEW: lista de empresas com decisores ─────────────────────
  return (
    <div style={{display:'flex', flexDirection:'column', height:'100%', background:'#0D0D0D', overflow:'hidden'}}>

      {/* Header */}
      <div style={{padding:'12px 20px', borderBottom:'.5px solid #2D2D44', flexShrink:0}}>
        <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>
          <div style={{fontSize:14, fontWeight:700, color:'#F5F5F5'}}>📞 Cold Call — Decisores</div>
          <div style={{fontSize:9, fontFamily:'IBM Plex Mono,monospace', color:'#555', marginLeft:4}}>
            {filtradas.length} empresa{filtradas.length!==1?'s':''} com decisores · {todayStr}
          </div>
          {/* Mini KPI */}
          <div style={{marginLeft:'auto', display:'flex', gap:8}}>
            {[['Feitos hoje', totalDone, '#34D399'], ['Com decisores', empresasComDec.length, gc]].map(([l,v,c]) => (
              <div key={l} style={{background:'#111827', border:`.5px solid ${c}22`, borderRadius:8, padding:'5px 12px', textAlign:'center'}}>
                <div style={{fontSize:16, fontWeight:700, color:c, fontFamily:'IBM Plex Mono,monospace', lineHeight:1}}>{v}</div>
                <div style={{fontSize:8, color:'#555', fontFamily:'IBM Plex Mono,monospace', textTransform:'uppercase', letterSpacing:.5, marginTop:2}}>{l}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Filtros */}
        <div style={{display:'flex', gap:8, flexWrap:'wrap', alignItems:'center'}}>
          <input value={search} onChange={ev => setSearch(ev.target.value)} placeholder="Buscar empresa..."
            style={{background:'#1A1A2E', border:'.5px solid #2D2D44', borderRadius:6, padding:'6px 11px',
              color:'#F5F5F5', fontSize:11, fontFamily:'IBM Plex Mono,monospace', outline:'none', width:180}} />
          <select value={filtroSetor} onChange={ev => setFiltroSetor(ev.target.value)}
            style={{background:'#1A1A2E', border:'.5px solid #2D2D44', borderRadius:6, padding:'6px 10px',
              color:'#9B9BB4', fontSize:10, fontFamily:'IBM Plex Mono,monospace', outline:'none', cursor:'pointer'}}>
            {setores.map(s => <option key={s}>{s}</option>)}
          </select>
          <span style={{fontSize:9, color:'#444', fontFamily:'IBM Plex Mono,monospace'}}>
            Ordenado por: mais decisores primeiro
          </span>
        </div>
      </div>

      {/* Lista */}
      <div style={{flex:1, overflowY:'auto', padding:'10px 20px'}}>
        {filtradas.length === 0 && (
          <div style={{textAlign:'center', padding:60, color:'#555', fontFamily:'IBM Plex Mono,monospace'}}>
            <div style={{fontSize:36, marginBottom:12}}>📞</div>
            <div style={{fontSize:13, marginBottom:6, color:'#F5F5F5'}}>Nenhuma empresa com decisores</div>
            <div style={{fontSize:10}}>Vá em 🎴 Empresas → clique numa empresa → ⚡ Enriquecer</div>
          </div>
        )}
        <div style={{display:'flex', flexDirection:'column', gap:6}}>
          {filtradas.map((e, idx) => {
            const feitos = Object.keys(done).filter(k => k.startsWith(e.rank+'_')).length;
            const g = getGrad(e.nome);
            const borderC = feitos > 0 ? 'rgba(52,211,153,.4)' : e.nVer >= 3 ? '#FF6B2B44' : '#2D2D44';

            return (
              <div key={e.rank} onClick={() => setSelEmpresa(e)}
                style={{display:'flex', alignItems:'center', gap:12, padding:'12px 16px',
                  background: feitos > 0 ? 'rgba(52,211,153,.03)' : '#111827',
                  border: `.5px solid ${borderC}`, borderRadius:10, cursor:'pointer', transition:'all .15s'}}
                onMouseOver={ev => ev.currentTarget.style.borderColor='#FF6B2B'}
                onMouseOut={ev => ev.currentTarget.style.borderColor=borderC}>

                {/* Avatar */}
                <div style={{width:38, height:38, borderRadius:9, background:`linear-gradient(135deg,${g[0]},${g[1]})`,
                  display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700, color:'#fff', flexShrink:0}}>
                  {ini(e.nome)}
                </div>

                {/* Info */}
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontSize:13, fontWeight:600, color:'#F5F5F5', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>
                    {e.nome}
                  </div>
                  <div style={{fontSize:9, color:'#555', fontFamily:'IBM Plex Mono,monospace', marginTop:2}}>
                    {e.setor}
                  </div>
                </div>

                {/* Decisores badges */}
                <div style={{display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4, flexShrink:0}}>
                  <div style={{display:'flex', gap:5}}>
                    <span style={{fontSize:9, fontFamily:'IBM Plex Mono,monospace', padding:'2px 8px', borderRadius:100,
                      background:'rgba(255,107,43,.1)', color:'#FF6B2B', border:'.5px solid rgba(255,107,43,.3)'}}>
                      ✓ {e.nVer} dec.
                    </span>
                    {e.nSug > 0 && (
                      <span style={{fontSize:9, fontFamily:'IBM Plex Mono,monospace', padding:'2px 8px', borderRadius:100,
                        background:'rgba(155,155,180,.08)', color:'#9B9BB4', border:'.5px solid #2D2D44'}}>
                        ⟳ {e.nSug}
                      </span>
                    )}
                  </div>
                  {feitos > 0 && (
                    <span style={{fontSize:8, fontFamily:'IBM Plex Mono,monospace', color:'#34D399'}}>
                      ✓ {feitos} contatado{feitos!==1?'s':''} hoje
                    </span>
                  )}
                </div>

                <span style={{color:'#2D2D44', fontSize:18, flexShrink:0}}>›</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}



// ── Modal: Cadastrar Decisor Manualmente ────────────────────────
function DecModalCadastro({onSave, onClose}) {
  const [f, setF] = React.useState({nome:'',cargo:'',email:'',wa:'',linkedin:''});
  const up = (k,v) => setF(p=>({...p,[k]:v}));
  const handle = () => { if(!f.nome.trim()) return; onSave(f); };
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.88)',zIndex:3000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}
      onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:'#111827',border:'.5px solid #2D2D44',borderRadius:12,width:'100%',maxWidth:460,padding:24}}>
        <div style={{fontSize:15,fontWeight:600,color:'#F5F5F5',marginBottom:18}}>+ Novo Decisor</div>
        {[
          ['nome','Nome completo *','Ex: Ana Souza','#F5F5F5'],
          ['cargo','Cargo','CMO, Dir. Marketing...','#9B9BB4'],
          ['email','Email','email@empresa.com','#60A5FA'],
          ['wa','WhatsApp','5511999999999 (só números)','#25D366'],
          ['linkedin','LinkedIn','linkedin.com/in/...','#A78BFA'],
        ].map(([campo,label,ph,cor])=>(
          <div key={campo} style={{marginBottom:10}}>
            <div style={{fontSize:9,color:'#9B9BB4',fontFamily:'IBM Plex Mono,monospace',textTransform:'uppercase',letterSpacing:.5,marginBottom:4}}>{label}</div>
            <input value={f[campo]} onChange={e=>up(campo,e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&campo==='linkedin'&&handle()}
              placeholder={ph}
              style={{width:'100%',background:'#0D0D0D',border:'.5px solid #2D2D44',borderRadius:8,padding:'9px 12px',
                color:cor,fontSize:12,fontFamily:'IBM Plex Mono,monospace',outline:'none',boxSizing:'border-box'}}/>
          </div>
        ))}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
          <button onClick={onClose}
            style={{padding:'8px 18px',borderRadius:8,border:'.5px solid #2D2D44',background:'transparent',color:'#9B9BB4',fontSize:12,cursor:'pointer'}}>
            Cancelar
          </button>
          <button onClick={handle}
            style={{padding:'8px 20px',borderRadius:8,border:'none',background:'#FF6B2B',color:'#fff',fontSize:12,fontWeight:600,cursor:'pointer'}}>
            Salvar
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Modal: Enviar Email Direto ────────────────────────────────────
function EmailDiretoModal({decisor, empresa, onClose, onSend}) {
  const [assunto, setAssunto] = React.useState('');
  const [corpo,   setCorpo]   = React.useState('');
  const [nota,    setNota]    = React.useState('');
  const [enviado, setEnviado] = React.useState(false);

  const abrirGmail = () => {
    const para   = encodeURIComponent(decisor.email||'');
    const subj   = encodeURIComponent(assunto);
    const body   = encodeURIComponent(corpo);
    window.open(`https://mail.google.com/mail/u/0/?view=cm&to=${para}&su=${subj}&body=${body}`,'_blank');
    setEnviado(true);
  };

  const abrirOutlook = () => {
    const para = encodeURIComponent(decisor.email||'');
    const subj = encodeURIComponent(assunto);
    const body = encodeURIComponent(corpo);
    window.open(`https://outlook.live.com/mail/0/deeplink/compose?to=${para}&subject=${subj}&body=${body}`,'_blank');
    setEnviado(true);
  };

  const copiar = () => {
    navigator.clipboard.writeText(`Para: ${decisor.email||''}
Assunto: ${assunto}

${corpo}`);
    setEnviado(true);
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.88)',zIndex:3000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}
      onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:'#111827',border:'.5px solid #2D2D44',borderRadius:12,width:'100%',maxWidth:560,padding:24,maxHeight:'90vh',overflowY:'auto'}}>
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:600,color:'#F5F5F5'}}>✉ Email para {decisor.nome}</div>
            <div style={{fontSize:9,color:'#555',fontFamily:'IBM Plex Mono,monospace',marginTop:2}}>{decisor.cargo} · {empresa.nome}</div>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',color:'#555',cursor:'pointer',fontSize:20}}>×</button>
        </div>

        {/* Para */}
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',background:'#0D0D0D',borderRadius:6,marginBottom:8,border:'.5px solid #1e2433'}}>
          <span style={{fontSize:9,color:'#555',fontFamily:'IBM Plex Mono,monospace',minWidth:40}}>Para</span>
          <span style={{fontSize:11,color:'#60A5FA',fontFamily:'IBM Plex Mono,monospace'}}>{decisor.email||'sem email cadastrado'}</span>
        </div>

        {/* Assunto */}
        <input value={assunto} onChange={e=>setAssunto(e.target.value)} placeholder="Assunto do email..."
          style={{width:'100%',background:'#0D0D0D',border:'.5px solid #2D2D44',borderRadius:6,padding:'8px 12px',
            color:'#F5F5F5',fontSize:12,fontFamily:'Inter,sans-serif',outline:'none',marginBottom:8,boxSizing:'border-box'}}/>

        {/* Corpo */}
        <textarea value={corpo} onChange={e=>setCorpo(e.target.value)} placeholder="Escreva o email..."
          rows={8}
          style={{width:'100%',background:'#0D0D0D',border:'.5px solid #2D2D44',borderRadius:6,padding:'10px 12px',
            color:'#F5F5F5',fontSize:12,fontFamily:'Inter,sans-serif',outline:'none',resize:'vertical',lineHeight:1.7,
            marginBottom:12,boxSizing:'border-box'}}/>

        {/* Nota interna */}
        <input value={nota} onChange={e=>setNota(e.target.value)} placeholder="Nota interna (opcional — salva no histórico)"
          style={{width:'100%',background:'#0D0D0D',border:'.5px solid #1e2433',borderRadius:6,padding:'6px 12px',
            color:'#555',fontSize:10,fontFamily:'IBM Plex Mono,monospace',outline:'none',marginBottom:14,boxSizing:'border-box'}}/>

        {/* Ações */}
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button onClick={abrirGmail}
            style={{flex:1,padding:'10px',borderRadius:8,border:'none',background:'#EA4335',color:'#fff',
              fontSize:11,fontFamily:'IBM Plex Mono,monospace',cursor:'pointer',fontWeight:600}}>
            Abrir no Gmail
          </button>
          <button onClick={abrirOutlook}
            style={{flex:1,padding:'10px',borderRadius:8,border:'none',background:'#0078D4',color:'#fff',
              fontSize:11,fontFamily:'IBM Plex Mono,monospace',cursor:'pointer',fontWeight:600}}>
            Abrir no Outlook
          </button>
          <button onClick={copiar}
            style={{padding:'10px 14px',borderRadius:8,border:'.5px solid #2D2D44',background:'transparent',
              color:'#9B9BB4',fontSize:11,fontFamily:'IBM Plex Mono,monospace',cursor:'pointer'}}>
            Copiar
          </button>
        </div>

        {enviado&&(
          <div style={{marginTop:12,display:'flex',gap:8,alignItems:'center'}}>
            <div style={{flex:1,height:.5,background:'#2D2D44'}}/>
            <button onClick={()=>{onSend(nota);}}
              style={{padding:'8px 20px',borderRadius:8,border:'.5px solid #1D9E75',background:'rgba(29,158,117,.1)',
                color:'#1D9E75',fontSize:11,fontFamily:'IBM Plex Mono,monospace',cursor:'pointer',fontWeight:600}}>
              ✓ Confirmar envio e salvar no histórico
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

.kes-btn-p:hover{background:#e55a1f}
.kes-btn-s{background:transparent;color:#9B9BB4;border:.5px solid #2D2D44;border-radius:8px;padding:8px 18px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.kes-btn-s:hover{border-color:#FF6B2B;color:#FF6B2B}

.kes-btn-danger:hover{background:rgba(226,75,74,.2)}
.kes-divider{height:.5px;background:#2D2D44;margin:14px 0}

/* mobile */
@media(max-width:768px){
  .kes-cols,.fcs-cols{gap:8px}

  body{overflow-x:hidden;overflow-y:auto}
