<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeria Holding — Central Comercial</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Syne',sans-serif;background:#060606;color:#eee;min-height:100vh;overflow:hidden;display:flex;flex-direction:column}
input,select,button,textarea{font-family:inherit}
a{text-decoration:none}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
.topbar{display:flex;align-items:stretch;background:#0a0a0a;border-bottom:1px solid #181818;height:50px;flex-shrink:0;overflow-x:auto}
.brand{display:flex;align-items:center;gap:9px;padding:0 18px;border-right:1px solid #181818;flex-shrink:0}
.bdot{width:7px;height:7px;border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.bname{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;white-space:nowrap}
.tabs-row{display:flex;align-items:stretch;flex:1}
.ctab{display:flex;align-items:center;gap:7px;padding:0 15px;border-right:1px solid #181818;cursor:pointer;transition:all .15s;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0}
.ctab:hover{background:rgba(255,255,255,.025)}
.ctab.on{border-bottom-color:var(--tc)}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--tc)}
.tname{font-size:10px;font-family:'DM Mono',monospace;letter-spacing:.5px;color:#555}
.ctab.on .tname{color:var(--tc)}
.tb-right{display:flex;align-items:center;gap:10px;padding:0 14px;border-left:1px solid #181818;flex-shrink:0}
.api-chip{display:flex;align-items:center;gap:4px;font-size:9px;font-family:'DM Mono',monospace;color:#333;letter-spacing:.5px}
.apdot{width:5px;height:5px;border-radius:50%}
.cfgbtn{padding:4px 10px;border:1px solid #1e1e1e;border-radius:3px;background:transparent;color:#444;font-size:9px;font-family:'DM Mono',monospace;cursor:pointer;letter-spacing:.5px}
.cfgbtn:hover{border-color:#555;color:#aaa}
.resbtn{padding:4px 10px;border:1px solid rgba(255,71,87,.3);border-radius:3px;background:rgba(255,71,87,.06);color:#FF4757;font-size:9px;font-family:'DM Mono',monospace;cursor:pointer;letter-spacing:.5px}
.resbtn:hover{background:rgba(255,71,87,.12)}
.ws{display:flex;flex:1;overflow:hidden}
.sb{width:295px;flex-shrink:0;border-right:1px solid #181818;display:flex;flex-direction:column;background:#080808}
.sbhead{padding:11px 14px;border-bottom:1px solid #181818;display:flex;align-items:center;justify-content:space-between}
.sbtitle{font-size:9px;font-family:'DM Mono',monospace;color:#333;letter-spacing:2px;text-transform:uppercase}
.sbcnt{font-size:9px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:100px;border:1px solid var(--tc);color:var(--tc)}
.sbsearch{padding:8px 12px;border-bottom:1px solid #181818}
.sbsearch input{width:100%;background:#060606;border:1px solid #1a1a1a;border-radius:3px;padding:6px 9px;color:#eee;font-family:'DM Mono',monospace;font-size:10px;outline:none}
.sbsearch input:focus{border-color:var(--tc)}
.sbsearch input::placeholder{color:#252525}
.sbfil{display:flex;gap:4px;padding:6px 12px;border-bottom:1px solid #181818;flex-wrap:wrap}
.fb{padding:3px 8px;border-radius:3px;border:1px solid #1a1a1a;background:transparent;color:#333;font-size:8px;font-family:'DM Mono',monospace;cursor:pointer;letter-spacing:.5px}
.fb.on{border-color:var(--tc);color:var(--tc)}
.fb.res{border-color:rgba(255,71,87,.3);color:#FF4757}
.fb.res.on{background:rgba(255,71,87,.08)}
.sblist{flex:1;overflow-y:auto}
.coitem{padding:10px 12px;border-bottom:1px solid #111;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .1s}
.coitem:hover{background:rgba(255,255,255,.018)}
.coitem.sel{border-left:2px solid var(--tc);background:rgba(255,255,255,.02)}
.coitem.restricted{border-left:2px solid rgba(255,71,87,.4);background:rgba(255,71,87,.025)}
.corank{font-family:'DM Mono',monospace;font-size:8px;color:#2a2a2a;min-width:24px;text-align:right}
.cobody{flex:1;min-width:0}
.coname{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cosec{font-size:8px;font-family:'DM Mono',monospace;color:#333;margin-top:1px}
.fittag{font-size:7px;font-family:'DM Mono',monospace;padding:2px 5px;border-radius:100px;white-space:nowrap}
.restag{font-size:7px;font-family:'DM Mono',monospace;padding:2px 6px;border-radius:100px;white-space:nowrap;background:rgba(255,71,87,.1);color:#FF4757;border:1px solid rgba(255,71,87,.25)}
.crmdot{width:5px;height:5px;border-radius:50%;background:#4B9EFF;flex-shrink:0}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.subtabs{display:flex;border-bottom:1px solid #181818;background:#080808;flex-shrink:0}
.st{padding:10px 16px;font-size:9px;font-family:'DM Mono',monospace;color:#333;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.5px;transition:all .15s}
.st:hover{color:#888}
.st.on{color:var(--tc);border-bottom-color:var(--tc)}
.panel{flex:1;overflow-y:auto;padding:22px 26px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:#0e0e0e;border:1px solid #181818;border-radius:5px;padding:14px}
.clbl{font-size:8px;font-family:'DM Mono',monospace;color:#333;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.cval{font-size:14px;font-weight:700}
.csub{font-size:9px;font-family:'DM Mono',monospace;color:#333;margin-top:3px}
.sec{font-size:8px;font-family:'DM Mono',monospace;color:#2a2a2a;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:#181818}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.tag{font-size:9px;font-family:'DM Mono',monospace;padding:3px 8px;border-radius:3px;background:#0e0e0e;border:1px solid #181818;color:#333}
.taghl{border-color:rgba(var(--tcr),.25);color:var(--tc);background:rgba(var(--tcr),.05)}
.btn{padding:7px 13px;border-radius:3px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.3px}
.btnp{color:#000;border:none}
.btno{background:transparent;color:#888;border:1px solid #222}
.btno:hover{border-color:var(--tc);color:var(--tc)}
.btnsm{padding:5px 9px;font-size:9px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.deccard{background:#0e0e0e;border:1px solid #181818;border-radius:5px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:7px}
.decav{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;border:1px solid #1e1e1e}
.decinfo{flex:1;min-width:0}
.decname{font-size:11px;font-weight:700}
.deccargo{font-size:9px;font-family:'DM Mono',monospace;color:#444;margin-top:1px}
.dectags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.dt{font-size:8px;font-family:'DM Mono',monospace;padding:1px 6px;border-radius:2px;background:#111;border:1px solid #1a1a1a;color:#333}
.dtok{color:var(--tc);border-color:rgba(var(--tcr),.2)}
.decacts{display:flex;gap:4px;flex-wrap:wrap}
.feeditem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #111}
.fiicon{width:26px;height:26px;border-radius:50%;background:#0e0e0e;border:1px solid #181818;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.fibody{flex:1}
.fititle{font-size:11px;font-weight:600;margin-bottom:2px}
.fimeta{font-size:8px;font-family:'DM Mono',monospace;color:#333}
.finote{font-size:10px;color:#444;margin-top:4px;font-family:'DM Mono',monospace;border-left:2px solid #181818;padding-left:7px;line-height:1.5}
.aiout{background:#0e0e0e;border:1px solid rgba(var(--tcr),.15);border-radius:5px;padding:15px;margin-bottom:14px;font-size:11px;font-family:'DM Mono',monospace;line-height:1.8;color:#888}
.monitem{background:#0e0e0e;border:1px solid #181818;border-radius:5px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.monbody{flex:1}.montitle{font-size:11px;font-weight:700;margin-bottom:3px}
.mondesc{font-size:10px;font-family:'DM Mono',monospace;color:#444;line-height:1.5}
.montime{font-size:8px;font-family:'DM Mono',monospace;color:#2a2a2a;margin-top:4px}
.monbadge{font-size:7px;font-family:'DM Mono',monospace;padding:2px 6px;border-radius:100px;flex-shrink:0;letter-spacing:.5px}
.frow{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.flbl{font-size:8px;font-family:'DM Mono',monospace;color:#333;letter-spacing:1px;text-transform:uppercase}
.finp{background:#060606;border:1px solid #1a1a1a;border-radius:3px;padding:7px 9px;color:#eee;font-family:'DM Mono',monospace;font-size:10px;outline:none;width:100%}
.finp:focus{border-color:var(--tc)}
.finp::placeholder{color:#222}
textarea.finp{resize:vertical;min-height:70px;line-height:1.6}
select.finp{cursor:pointer}
.modov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.mod{background:#0e0e0e;border:1px solid #222;border-radius:7px;width:100%;max-width:480px;max-height:86vh;overflow-y:auto;padding:22px}
.mod-wide{max-width:680px}
.modtitle{font-size:15px;font-weight:800;margin-bottom:16px;letter-spacing:-.5px}
.modacts{display:flex;gap:7px;margin-top:16px;justify-content:flex-end}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;opacity:.2;text-align:center}
.emptyicon{font-size:44px}
.lbar{height:1px;background:#181818;overflow:hidden;margin:5px 0}
.lfill{height:100%;background:var(--tc);animation:la 1.4s ease-in-out infinite}
@keyframes la{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
.stxt{font-size:9px;font-family:'DM Mono',monospace;color:var(--tc);padding:4px 0}
.accname{font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1}
.accmeta{font-size:9px;font-family:'DM Mono',monospace;color:#333;margin-top:5px}
.acctop{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.angtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.angtab{padding:4px 9px;border-radius:3px;border:1px solid #1a1a1a;background:transparent;color:#333;font-size:8px;font-family:'DM Mono',monospace;cursor:pointer;letter-spacing:.5px}
.angtab.on{border-color:var(--tc);color:var(--tc)}

/* RESTRICTION BANNER */
.res-banner{background:rgba(255,71,87,.06);border:1px solid rgba(255,71,87,.25);border-radius:5px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.res-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.res-body{flex:1}
.res-title{font-size:11px;font-weight:700;color:#FF4757;margin-bottom:4px}
.res-desc{font-size:10px;font-family:'DM Mono',monospace;color:#884040;line-height:1.6}
.res-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rtag{font-size:8px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:100px;background:rgba(255,71,87,.1);color:#FF4757;border:1px solid rgba(255,71,87,.2)}

/* RESTRICTION PANEL */
.res-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #111;border-radius:4px;margin-bottom:4px;background:#0c0c0c}
.res-co{font-size:11px;font-weight:700;flex:1}
.res-reason{font-size:9px;font-family:'DM Mono',monospace;color:#444;flex:2}
.res-agency{font-size:8px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:100px}

/* REMINDER BANNER */
.reminder{background:rgba(255,181,71,.05);border:1px solid rgba(255,181,71,.25);border-radius:5px;padding:12px 16px;margin-bottom:0;display:flex;align-items:center;gap:12px;flex-shrink:0}
.reminder-txt{flex:1;font-size:11px;color:#FFB547;font-family:'DM Mono',monospace}
.reminder-btn{padding:5px 12px;border-radius:3px;border:1px solid rgba(255,181,71,.4);background:transparent;color:#FFB547;font-size:9px;font-family:'DM Mono',monospace;cursor:pointer;white-space:nowrap}
/* ADD COMPANY MODAL */
.addco-modal{background:#0e0e0e;border:1px solid #222;border-radius:8px;width:100%;max-width:420px;padding:22px}
.addco-badge{font-size:8px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:100px;background:rgba(0,255,148,.08);color:#00FF94;border:1px solid rgba(0,255,148,.2);white-space:nowrap}
/* ENRICH AGENT */
.enrich-box{background:#0a0a0a;border:1px solid rgba(167,139,250,.2);border-radius:8px;padding:14px;margin-bottom:14px}
.enrich-step{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #111}
.enrich-step:last-child{border-bottom:none}
.enrich-num{width:20px;height:20px;border-radius:50%;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);display:flex;align-items:center;justify-content:center;font-size:9px;color:#A78BFA;font-weight:700;flex-shrink:0;margin-top:2px}
.enrich-body{flex:1}
.wa-hist-badge{display:inline-flex;align-items:center;gap:3px;font-size:8px;font-family:'DM Mono',monospace;padding:1px 6px;border-radius:100px;background:rgba(37,211,102,.1);color:#25D366;border:1px solid rgba(37,211,102,.2)}

/* ── KANBAN SCROLLBAR INSIDE VIEW ── */
.kb-board-scroll::-webkit-scrollbar{height:4px}
.kb-board-scroll::-webkit-scrollbar-thumb{background:#222;border-radius:2px}


/* ═══ MELHORIA 5 — REDESIGN GALERIA HOLDING ═══ */
:root{
  --gh-orange:#FF6B2B;
  --gh-black:#0D0D0D;
  --gh-dark:#1A1A2E;
  --gh-mid:#2D2D44;
  --gh-white:#F5F5F5;
  --gh-muted:#9B9BB4;
  --gh-green:#1D9E75;
  --gh-red:#E24B4A;
  --gh-yellow:#EF9F27;
  --s2:#111827;
  --border:#2D2D44;
}
body{font-family:'Inter',sans-serif!important;background:var(--gh-black)!important}
input,select,button,textarea{font-family:'Inter',sans-serif!important}
.topbar{background:var(--gh-black)!important;border-bottom:1px solid var(--gh-mid)!important;height:52px!important}
.brand{border-right:1px solid var(--gh-mid)!important}
.bname{font-family:'IBM Plex Mono',monospace!important;color:var(--gh-white)!important;letter-spacing:2px!important}
.bdot{background:var(--gh-orange)!important;animation:none!important;width:8px!important;height:8px!important;border-radius:2px!important}
.ctab{border-right:1px solid var(--gh-mid)!important}
.ctab:hover{background:rgba(255,107,43,.04)!important}
.tb-right{border-left:1px solid var(--gh-mid)!important}
.sb{background:#0f0f1a!important;border-right:1px solid var(--gh-mid)!important}
.sbhead{border-bottom:1px solid var(--gh-mid)!important}
.sbtitle{font-family:'IBM Plex Mono',monospace!important;color:var(--gh-muted)!important}
.sbsearch input{background:var(--gh-dark)!important;border:1px solid var(--gh-mid)!important;color:var(--gh-white)!important;font-family:'IBM Plex Mono',monospace!important}
.sbsearch input:focus{border-color:var(--gh-orange)!important}
.coitem:hover{background:rgba(255,107,43,.04)!important}
.coitem.sel{border-left:2px solid var(--gh-orange)!important;background:rgba(255,107,43,.06)!important}
.coname{font-family:'Inter',sans-serif!important;font-size:11px!important}
.cosec{font-family:'IBM Plex Mono',monospace!important;color:var(--gh-muted)!important}
.card{background:var(--gh-dark)!important;border:1px solid var(--gh-mid)!important;border-radius:6px!important}
.card:hover{border-color:var(--gh-orange)!important}
.btn.btnp{background:var(--gh-orange)!important;color:#fff!important;border:none!important;border-radius:4px!important}
.btn.btnp:hover{background:#e55a1f!important}
.btn.btno{border:1px solid var(--gh-mid)!important;color:var(--gh-muted)!important;background:transparent!important;border-radius:4px!important}
.btn.btno:hover{border-color:var(--gh-orange)!important;color:var(--gh-orange)!important}
.modov{background:rgba(0,0,0,.95)!important}
.mod{background:var(--gh-dark)!important;border:1px solid var(--gh-mid)!important;border-radius:8px!important}
.modtitle{font-family:'Inter',sans-serif!important;letter-spacing:-.3px!important}
.finp{background:var(--gh-black)!important;border:1px solid var(--gh-mid)!important;color:var(--gh-white)!important;font-family:'IBM Plex Mono',monospace!important;border-radius:4px!important}
.finp:focus{border-color:var(--gh-orange)!important}
.sec{font-family:'IBM Plex Mono',monospace!important;color:var(--gh-muted)!important}
.sec::after{background:var(--gh-mid)!important}
.subtabs{background:#0f0f1a!important;border-bottom:1px solid var(--gh-mid)!important}
.st{font-family:'IBM Plex Mono',monospace!important}
.st.on{color:var(--gh-orange)!important;border-bottom-color:var(--gh-orange)!important}
.panel{background:var(--gh-black)!important}
.deccard{background:var(--gh-dark)!important;border:1px solid var(--gh-mid)!important;border-radius:6px!important}
.cfgbtn{border:1px solid var(--gh-mid)!important;color:var(--gh-muted)!important}
.cfgbtn:hover{border-color:var(--gh-orange)!important;color:var(--gh-orange)!important}
.resbtn{border-color:rgba(226,75,74,.4)!important;color:var(--gh-red)!important}
.angtab{border:1px solid var(--gh-mid)!important;color:var(--gh-muted)!important;font-family:'IBM Plex Mono',monospace!important}
.angtab.on{border-color:var(--gh-orange)!important;color:var(--gh-orange)!important}
.aiout{background:var(--gh-dark)!important;border:1px solid rgba(255,107,43,.2)!important;font-family:'IBM Plex Mono',monospace!important;color:var(--gh-muted)!important}
.tag{font-family:'IBM Plex Mono',monospace!important;background:var(--gh-mid)!important;color:var(--gh-muted)!important;border:none!important}
.taghl{background:rgba(255,107,43,.08)!important;color:var(--gh-orange)!important}
.feeditem{border-bottom:1px solid var(--gh-mid)!important}
.fiicon{background:var(--gh-dark)!important;border:1px solid var(--gh-mid)!important}
.fititle{font-family:'Inter',sans-serif!important}
.fimeta{font-family:'IBM Plex Mono',monospace!important;color:var(--gh-muted)!important}
.finote{font-family:'IBM Plex Mono',monospace!important;border-left:2px solid var(--gh-orange)!important;color:var(--gh-muted)!important}

/* ═══ FIGURINHAS ═══ */
.fig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:16px 0}
.fig-card{background:var(--gh-dark);border-radius:8px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.fig-card.verified{border:1.5px solid var(--gh-orange);box-shadow:0 0 12px rgba(255,107,43,.15)}
.fig-card.suggested{border:1.5px dashed var(--gh-mid)}
.fig-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.fig-card.verified:hover{box-shadow:0 6px 20px rgba(255,107,43,.25)}
.fig-avatar{width:100%;height:80px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;font-family:'Inter',sans-serif;letter-spacing:-1px}
.fig-body{padding:10px;background:var(--gh-dark)}
.fig-name{font-size:11px;font-weight:700;color:var(--gh-white);line-height:1.3;margin-bottom:3px}
.fig-cargo{font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--gh-muted);line-height:1.4}
.fig-badge{position:absolute;top:7px;right:7px;font-size:8px;font-family:'IBM Plex Mono',monospace;padding:2px 6px;border-radius:100px}
.fig-badge.v{background:rgba(29,158,117,.15);color:var(--gh-green);border:1px solid rgba(29,158,117,.3)}
.fig-badge.s{background:rgba(155,155,180,.08);color:var(--gh-muted);border:1px solid rgba(155,155,180,.2)}
.fig-actions{display:flex;gap:4px;padding:8px 10px;background:#111827;border-top:1px solid var(--gh-mid)}

/* ═══ KANBAN ACIONAMENTOS ═══ */

/* ── PORTFÓLIO EXECUTIVO ─────────────────────────────────────── */
.pex-wrap{display:flex;flex-direction:column;height:100%;background:#0D0D0D;overflow:hidden}
.pex-dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:16px 20px 0;flex-shrink:0}
.pex-kpi{background:#111827;border:.5px solid #2D2D44;border-radius:10px;padding:12px 14px}
.pex-kpi-label{font-size:8px;font-family:'IBM Plex Mono',monospace;color:#9B9BB4;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.pex-kpi-val{font-size:22px;font-weight:500;font-family:'IBM Plex Mono',monospace;line-height:1}
.pex-kpi-sub{font-size:9px;font-family:'IBM Plex Mono',monospace;color:#555;margin-top:3px}
.pex-header{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:.5px solid #2D2D44;flex-shrink:0;flex-wrap:wrap}
.pex-table-wrap{flex:1;overflow:auto;padding:0 20px 20px}
.pex-table{width:100%;border-collapse:collapse;font-size:11px;min-width:900px}
.pex-table th{font-size:8px;font-family:'IBM Plex Mono',monospace;color:#9B9BB4;text-transform:uppercase;letter-spacing:1px;padding:10px 12px;border-bottom:.5px solid #2D2D44;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
.pex-table th:hover{color:#FF6B2B}
.pex-table td{padding:10px 12px;border-bottom:.5px solid #111827;color:#F5F5F5;vertical-align:middle}
.pex-table tr:hover td{background:rgba(255,107,43,.03)}
.pex-badge{font-size:8px;font-family:'IBM Plex Mono',monospace;padding:2px 8px;border-radius:100px;white-space:nowrap}
.pex-badge.ativo{background:rgba(29,158,117,.12);color:#1D9E75;border:.5px solid rgba(29,158,117,.25)}
.pex-badge.risco{background:rgba(226,75,74,.1);color:#E24B4A;border:.5px solid rgba(226,75,74,.25)}
.pex-badge.atencao{background:rgba(239,159,39,.1);color:#EF9F27;border:.5px solid rgba(239,159,39,.25)}
.pex-badge.encerrado{background:rgba(155,155,180,.08);color:#9B9BB4;border:.5px solid #2D2D44}
.pex-progress{height:4px;background:#2D2D44;border-radius:2px;overflow:hidden;width:80px}
.pex-progress-fill{height:100%;border-radius:2px;background:#FF6B2B;transition:width .4s}

/* ── MODAL COMPARTILHADO ─────────────────────────────────────── */
.kes-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.kes-modal{background:#111827;border:.5px solid #2D2D44;border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:24px}
.kes-modal.wide{max-width:680px}
.kes-modal-title{font-size:15px;font-weight:500;color:#F5F5F5;margin-bottom:18px;letter-spacing:-.3px}
.kes-field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.kes-label{font-size:9px;font-family:'IBM Plex Mono',monospace;color:#9B9BB4;text-transform:uppercase;letter-spacing:.5px}
.kes-input{background:#0D0D0D;border:.5px solid #2D2D44;border-radius:8px;padding:9px 12px;color:#F5F5F5;font-size:12px;font-family:'Inter',sans-serif;outline:none;width:100%;transition:border-color .15s}
.kes-input:focus{border-color:#FF6B2B}
.kes-input::placeholder{color:#444}
textarea.kes-input{resize:vertical;min-height:72px;line-height:1.6}
select.kes-input{cursor:pointer}
.kes-modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kes-modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.kes-btn-p{background:#FF6B2B;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:12px;font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;transition:background .15s}
.kes-btn-p:hover{background:#e55a1f}
.kes-btn-s{background:transparent;color:#9B9BB4;border:.5px solid #2D2D44;border-radius:8px;padding:8px 18px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.kes-btn-s:hover{border-color:#FF6B2B;color:#FF6B2B}
.kes-btn-danger{background:rgba(226,75,74,.1);color:#E24B4A;border:.5px solid rgba(226,75,74,.3);border-radius:8px;padding:8px 14px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.kes-btn-danger:hover{background:rgba(226,75,74,.2)}
.kes-divider{height:.5px;background:#2D2D44;margin:14px 0}

/* mobile */
@media(max-width:768px){
  .kes-cols,.fcs-cols{gap:8px}
  .kes-col,.fcs-col{width:200px}
  .fcs-dash,.pex-dash{grid-template-columns:1fr 1fr}
  .pex-table-wrap{padding:0 12px 20px}
  .kes-header{gap:6px}
  .kes-search{width:140px}
  body{overflow-x:hidden;overflow-y:auto}
  .topbar{height:auto;min-height:50px;flex-wrap:wrap}
  .tb-right{flex-wrap:wrap;padding:4px 8px;gap:3px!important}
}

/* ── MOBILE V3 ───────────────────────────────────────────────── */
@media(max-width:768px){
  button,.clickable,.st,.ctab,.kes-chip{min-height:40px}
  .tb-right button{min-height:34px}
  .modov{padding:0;align-items:stretch}
  .mod{max-width:100vw;width:100vw;max-height:100dvh;height:100dvh;border-radius:0}
  .kes-modal-ov{padding:0;align-items:stretch}
  .kes-modal{max-width:100vw;width:100vw;max-height:100dvh;border-radius:0}
  .kes-board,.fcs-board{scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .kes-col,.fcs-col{min-width:85vw;scroll-snap-align:center}
  .pex-table-wrap{-webkit-overflow-scrolling:touch}
  .subtabs{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}

}

/* ══════════════════════════════════════════════════
   FASE 4-A — Modal animations + depth
   ══════════════════════════════════════════════════ */
@keyframes gh-fade-in  { from{opacity:0} to{opacity:1} }
@keyframes gh-slide-up { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

/* backdrop fade */
.modov,.kes-modal-ov { animation:gh-fade-in 180ms ease-out both; }
/* panel slide-up */
.mod,.kes-modal { animation:gh-slide-up 200ms ease-out both; }
/* iOS-style depth: blur + lighter overlay */
.modov,.kes-modal-ov {
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  background:rgba(0,0,0,.78)!important;
}

/* button press feedback */
.gh-btn-primary:active,.kes-btn-p:active,.btn.btnp:active {
  transform:translateY(1px) scale(.98);
  transition:transform .08s ease-out;
}

/* keyboard focus ring */
:focus-visible {
  outline:2px solid rgba(255,107,43,.55);
  outline-offset:2px;
  border-radius:3px;
}

/* ══════════════════════════════════════════════════
   FASE 4-B — Touch targets (pointer:coarse only)
   ══════════════════════════════════════════════════ */
@media (pointer:coarse) {
  /* Apple HIG mínimo: 44px */
  button,.clickable,.st,.ctab,.kes-chip,.fb { min-height:44px; }
  .tb-right button { min-height:40px; }
  /* sidebar items mais confortáveis */
  .coitem { min-height:48px; padding:12px; }
  /* filtros: área de toque maior */
  .fb { padding:6px 12px; }
  /* subtabs (navegação principal) */
  .st { padding:12px 16px; }
}

/* ══════════════════════════════════════════════════
   FASE 4-D — Typography + micro-polish
   ══════════════════════════════════════════════════ */
/* D1: unify leftover DM Mono → IBM Plex Mono */
.corank,.fb,.restag,.fittag,.cfgbtn,.resbtn {
  font-family:'IBM Plex Mono',monospace!important;
}
/* D2: .corank era #2a2a2a sobre #0f0f1a — contraste <1.5:1, invisível */
.corank { color:#3d3d5c!important; }
/* D3: search border transition (estava instantâneo) */
.sbsearch input,.gh-input { transition:border-color .15s; }
/* D4: card hover border transition suave */
.card { transition:border-color .15s; }
</style>

<script>
/* ── MIGRAÇÃO DO SEED (externo em seed.json) + LOADER ────────────
   O seed (~2.050 empresas, ~640KB) saiu do HTML e só é baixado uma
   única vez, quando ainda não existe a flag ghub_mailing_v2. Depois,
   os scripts do app (pré-compilados, sem Babel no navegador) são
   carregados em sequência. */
(async function(){
  async function migrarSeed(){
    try{
      if(localStorage.getItem('ghub_mailing_v2')) return;
      var seed = await fetch('seed.json').then(function(r){return r.json();});
      var ex={};
      try{ex=JSON.parse(localStorage.getItem('gh_decisores_v3')||'{}');}catch(e){}
      var merged=Object.assign({},seed);
      Object.keys(ex).forEach(function(k){
        if(merged[k]){
          var names=ex[k].decisors.map(function(d){return d.nome.toLowerCase();});
          var novo=merged[k].decisors.filter(function(d){return !names.includes(d.nome.toLowerCase());});
          merged[k]=Object.assign({},ex[k],{decisors:ex[k].decisors.concat(novo)});
        } else { merged[k]=ex[k]; }
      });
      var GRUPO_IDS=['galeria','mila','404','cccaramelo','gaia','catalyst','mantiqueira','agente','vitrine','gux'];
      var fullMerged=Object.assign({},merged);
      Object.keys(seed).forEach(function(k){
        var rank=k.replace('galeria_','');
        GRUPO_IDS.forEach(function(gid){
          if(gid==='galeria') return;
          var gkey=gid+'_'+rank;
          if(!fullMerged[gkey]){ fullMerged[gkey]=seed[k]; }
        });
      });
      localStorage.setItem('gh_decisores_v3',JSON.stringify(fullMerged));
      localStorage.setItem('ghub_mailing_v2','1');
      console.log('[Mailing] OK: '+Object.keys(seed).length+' empresas migradas');
    }catch(e){console.warn('[Mailing] Erro:',e);}
  }
  function loadScript(src){
    return new Promise(function(res,rej){
      var el=document.createElement('script');
      el.src=src; el.onload=res;
      el.onerror=function(){rej(new Error('Falha ao carregar '+src));};
      document.body.appendChild(el);
    });
  }
  // Blocos React: executados via eval global (mesma semantica do
  // babel-standalone original — function/var globais, const/let
  // isolados por bloco, evitando colisao de 'useState' etc.)
  async function runBlock(src){
    var code = await fetch(src).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status+' em '+src);
      return r.text();
    });
    (0,eval)(code + "\n//# sourceURL=" + src);
  }
  await migrarSeed();
  // scripts classicos (sem const globais duplicados)
  for(var s0 of ['gh-core.js','block0_util.js','templates_agencias.js','block_regua.js','block_xp.js']){
    try{ await loadScript(s0); }catch(e){ console.error(e); }
  }
  // blocos react pre-compilados
  for(var s1 of ['block1.js','block2.js','block3.js','block6.js','block7.js','block4.js','block5.js','block_regua_views.js','block_bomdias.js','block_xp_view.js','block_diario.js','block_blocklist.js','block_agente.js']){
    try{ await runBlock(s1); }catch(e){ console.error(e); }
  }
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
