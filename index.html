// ─── CHECK RESTRICTION ────────────────────────────────────────────────────────
function checkRestrictions(lead, groupId, customRestrictions=[]) {
  const allRes = [...RESTRICTIONS, ...customRestrictions];
  const matched = allRes.filter(r => {
    if (!r.agencies.includes(groupId)) return false;
    // Check expiry
    if (r.expiresAt) {
      const exp = new Date(r.expiresAt);
      if (exp < new Date()) return false; // expired, no longer restricted
    }
    return r.keywords.some(kw => lead.nome.toUpperCase().includes(kw.toUpperCase()));
  });
  return matched;
}

async function hunterVerify(email){try{const r=await fetch(`https://api.hunter.io/v2/email-verifier?email=${email}&api_key=${HUNTER_KEY}`);const d=await r.json();return d.data||null;}catch{return null;}}
async function lushaSearch(fn,ln,company){try{const r=await fetch(`https://api.lusha.com/v2/person?firstName=${encodeURIComponent(fn)}&lastName=${encodeURIComponent(ln)}&company=${encodeURIComponent(company)}`,{headers:{"api_key":LUSHA_KEY}});const d=await r.json();const p=(d.data&&d.data.phoneNumbers)||[];return p.length>0?p[0].internationalNumber||"":" ";}catch{return "";}}
async function lushaEnrich(fn,ln,company){try{const r=await fetch(`https://api.lusha.com/v2/person?firstName=${encodeURIComponent(fn)}&lastName=${encodeURIComponent(ln)}&company=${encodeURIComponent(company)}`,{headers:{"api_key":LUSHA_KEY}});const d=await r.json();const phones=(d.data&&d.data.phoneNumbers)||[];const emails=(d.data&&d.data.emails)||[];return{phone:phones.length>0?phones[0].internationalNumber||"":"",email:emails.length>0?emails[0].emailAddress||"":""};}catch{return{phone:"",email:"";};}}
async function pipedriveSearch(email,key){try{const r=await fetch(`https://api.pipedrive.com/v1/persons/search?term=${encodeURIComponent(email)}&api_token=${key}`);const d=await r.json();return d.data&&d.data.items&&d.data.items.length>0?d.data.items[0].item:null;}catch{return null;}}
async function pipedriveCreate(contact,empresa,key){try{const r=await fetch(`https://api.pipedrive.com/v1/persons?api_token=${key}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:contact.nome,email:[{value:contact.email,primary:true}],phone:[{value:contact.wa||"",primary:true}],org_name:empresa,job_title:contact.cargo||""})});const d=await r.json();return d.data||null;}catch{return null;}}
async function createDeal(empresa,nomeCo,key){try{const r=await fetch(`https://api.pipedrive.com/v1/deals?api_token=${key}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:nomeCo+" — "+empresa,status:"open"})});const d=await r.json();return d.data||null;}catch{return null;}}
async function createActivity(dealId,label,note,key){try{await fetch(`https://api.pipedrive.com/v1/activities?api_token=${key}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subject:label,type:"task",note,done:0,...(dealId?{deal_id:dealId}:{})})});}catch{}}
async function gerarEmail(nome,empresa,setor,grupo,angulo,tom,hist){
  const assinatura=ASSINATURAS[grupo.id]||("Pedro Ica\nHead of Growth | "+grupo.name);
  const prompt=`${grupo.prompt}\n\nEscreva um email de prospecção B2B para ${empresa} do setor ${setor}.\nÂNGULO: ${angulo}\nTOM: ${tom}\n${nome?"DESTINATÁRIO: "+nome+"\n":""}${hist?"HISTÓRICO: "+hist+"\n":""}DOR IDENTIFICADA: ${grupo.dor(setor)}\n\nREGRAS: primeira linha específica sobre ${empresa}, conectar a dor ao que ${grupo.name} faz, benchmark do setor ${setor}, CTA de 20 min, máximo 180 palavras.\nUSE OBRIGATORIAMENTE esta assinatura no final:\n${assinatura}\nRetorne APENAS JSON sem markdown: {"assunto":"...","corpo":"..."}`;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:900,messages:[{role:"user",content:prompt}]})});
  const d=await r.json();
  const txt=(d.content&&d.content[0]&&d.content[0].text)||"{}";
  return JSON.parse(txt.replace(/```json|```/g,"").trim());
}
async function gerarIntel(empresa,setor,grupo,decs,hist){
  const prompt=`Você é analista de inteligência comercial para ${grupo.name} (${grupo.desc}).\nEMPRESA: ${empresa} | SETOR: ${setor}\nDECISORES: ${decs||"nenhum"}\nHISTÓRICO: ${hist||"nenhuma atividade"}\n\nGere análise estratégica em parágrafos fluidos (sem bullets) cobrindo: diagnóstico de fit com ${grupo.name}, recomendação baseada no histórico, serviço com maior chance de abrir porta e insight de timing do setor ${setor}. Máximo 200 palavras.`;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:700,messages:[{role:"user",content:prompt}]})});
  const d=await r.json();
  return(d.content&&d.content[0]&&d.content[0].text)||"";
}
async function gerarAlertas(empresa,setor,grupo){
  const prompt=`Simule 3 alertas de inteligência de mercado sobre ${empresa} (setor ${setor}) relevantes para ${grupo.name}. JSON sem markdown: [{"title":"...","desc":"...","urgency":"new"}]`;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,messages:[{role:"user",content:prompt}]})});
  const d=await r.json();
  try{return JSON.parse((d.content&&d.content[0]&&d.content[0].text||"[]").replace(/```json|```/g,"").trim());}catch{return[];}
}

function fitColor(f){return f==="alto"?"#00FF94":f==="medio"?"#FFB547":"#FF4757";}
function fitLabel(f){return f==="alto"?"FIT ALTO":f==="medio"?"FIT MED":"SEM FIT";}
function initials(name){return(name||"?").split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();}
function loadSt(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}}
function saveSt(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function hexRgb(h){const m=h.replace("#","").match(/.{2}/g);return m?m.map(x=>parseInt(x,16)).join(","):"255,255,255";}

// ─── AGENTE DE ENRIQUECIMENTO ─────────────────────────────────────────────────
function EnrichAgent({empresa,grupo,acc,onAccUpdate,onClose}){
  const [nomeCMO,setNomeCMO]=useState("");
  const [cargoCMO,setCargoCMO]=useState("CMO");
  const [lushaResult,setLushaResult]=useState(null);
  const [lushaLoading,setLushaLoading]=useState(false);
  const [lushaMsg,setLushaMsg]=useState("");
  const [done,setDone]=useState(false);

  const openGoogle=()=>{
    const q=encodeURIComponent('"'+empresa+'" CMO OR "Head de Mídia" OR "Head de Marketing" site:linkedin.com');
    window.open("https://www.google.com/search?q="+q,"_blank");
  };
  const runLusha=async()=>{
    if(!nomeCMO.trim())return;
    setLushaLoading(true);setLushaMsg("");
    const parts=nomeCMO.trim().split(" ");
    const fn=parts[0];const ln=parts.slice(1).join(" ")||parts[0];
    const res=await lushaEnrich(fn,ln,empresa);
    setLushaLoading(false);
    if(!res.phone&&!res.email){setLushaMsg("Lusha não encontrou dados — adicione manualmente após salvar.");}
    else{setLushaMsg("");}
    setLushaResult(res);setDone(true);
  };
  const salvar=()=>{
    if(!nomeCMO.trim())return;
    const d={nome:nomeCMO.trim(),cargo:cargoCMO,email:lushaResult?lushaResult.email||"":"",wa:lushaResult?lushaResult.phone||"":"",li:"",aiSuggested:true,addedAt:new Date().toLocaleDateString("pt-BR")};
    const existing=acc.decisors||[];
    if(!existing.find(x=>x.nome===d.nome)){onAccUpdate({...acc,decisors:[...existing,d]});}
    onClose();
  };
  return(
    <div className="modov"><div className="mod">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div className="modtitle" style={{marginBottom:0}}>⚡ Agente de Enriquecimento</div>
        <button onClick={onClose} style={{background:"none",border:"none",color:"#444",cursor:"pointer",fontSize:20}}>×</button>
      </div>
      <div style={{fontSize:11,fontFamily:"DM Mono,monospace",color:"#555",marginBottom:14}}>Empresa: <span style={{color:"#eee",fontWeight:700}}>{empresa}</span></div>
      <div className="enrich-box">
        <div className="enrich-step">
          <div className="enrich-num">1</div>
          <div className="enrich-body">
            <div style={{fontSize:11,fontWeight:700,marginBottom:4}}>Buscar CMO/Head de Mídia no Google</div>
            <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"#555",marginBottom:8}}>Abre busca no Google para encontrar o responsável por mídia/marketing no LinkedIn.</div>
            <button className="btn btno btnsm" onClick={openGoogle} style={{color:"#A78BFA",borderColor:"rgba(167,139,250,.3)"}}>🔍 Abrir Google + LinkedIn</button>
          </div>
        </div>
        <div className="enrich-step">
          <div className="enrich-num">2</div>
          <div className="enrich-body">
            <div style={{fontSize:11,fontWeight:700,marginBottom:6}}>Informar nome encontrado</div>
            <div className="g2" style={{marginBottom:0}}>
              <div className="frow"><div className="flbl">NOME COMPLETO</div><input className="finp" placeholder="Ex: Ana Paula Silva" value={nomeCMO} onChange={e=>setNomeCMO(e.target.value)}/></div>
              <div className="frow"><div className="flbl">CARGO</div><input className="finp" placeholder="CMO, Head de Mídia..." value={cargoCMO} onChange={e=>setCargoCMO(e.target.value)}/></div>
            </div>
          </div>
        </div>
        <div className="enrich-step">
          <div className="enrich-num">3</div>
          <div className="enrich-body">
            <div style={{fontSize:11,fontWeight:700,marginBottom:4}}>Enriquecer com Lusha</div>
            <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"#555",marginBottom:8}}>Busca telefone e email corporativo automaticamente.</div>
            <button className="btn btno btnsm" onClick={runLusha} disabled={!nomeCMO||lushaLoading} style={{color:"#A78BFA",borderColor:"rgba(167,139,250,.3)"}}>{lushaLoading?"Buscando...":"⚡ Enriquecer com Lusha"}</button>
            {lushaMsg&&<div style={{fontSize:9,color:"#FFB547",fontFamily:"DM Mono,monospace",marginTop:6}}>{lushaMsg}</div>}
          </div>
        </div>
        {done&&(
          <div className="enrich-step">
            <div className="enrich-num" style={{background:"rgba(52,211,153,.2)",borderColor:"rgba(52,211,153,.4)",color:"#34D399"}}>✓</div>
            <div className="enrich-body">
              <div style={{fontSize:11,fontWeight:700,color:"#34D399",marginBottom:4}}>Resultado Lusha</div>
              {lushaResult&&(lushaResult.email||lushaResult.phone)?(
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  {lushaResult.email&&<div style={{fontSize:10,fontFamily:"DM Mono,monospace",color:"#60A5FA"}}>✉ {lushaResult.email}</div>}
                  {lushaResult.phone&&<div style={{fontSize:10,fontFamily:"DM Mono,monospace",color:"#25D366"}}>💬 {lushaResult.phone}</div>}
                </div>
              ):<div style={{fontSize:10,fontFamily:"DM Mono,monospace",color:"#555"}}>Dados não encontrados — preencha manualmente após salvar.</div>}
            </div>
          </div>
        )}
      </div>
      <div className="modacts">
        <button className="btn btno btnsm" onClick={onClose}>Cancelar</button>
        {nomeCMO&&<button className="btn btnp btnsm" style={{background:grupo.color}} onClick={salvar}>✓ Salvar Decisor</button>}
      </div>
    </div></div>
  );
}

// ─── EMAIL MODAL ──────────────────────────────────────────────────────────────

          <button onClick={onClose} style={{background:"none",border:"none",color:"#444",cursor:"pointer",fontSize:20}}>×</button>

        {restrictions&&restrictions.length>0&&(
          <div style={{margin:"12px 20px 0",background:"rgba(255,71,87,.06)",border:"1px solid rgba(255,71,87,.25)",borderRadius:5,padding:"10px 12px"}}>
            <div style={{fontSize:10,color:"#FF4757",fontWeight:700,marginBottom:4}}>⚠ ATENÇÃO — Lead com restrição de conflito</div>

// ─── DEC CARD ─────────────────────────────────────────────────────────────────
function DecCard({dc,empresa,setor,grupo,isEditing,onToggleEdit,onUpdate,onRemove,pdKey,restrictions,onWALog}){
  const [pdStatus,setPdStatus]=useState(null);
  const [pdLoading,setPdLoading]=useState(false);
  const [showEmail,setShowEmail]=useState(false);
  const [verifying,setVerifying]=useState(false);
  const verifyEmail=async()=>{if(!dc.email)return;setVerifying(true);const v=await hunterVerify(dc.email);if(v)onUpdate("emailStatus",v.result);setVerifying(false);};
  const syncPD=async()=>{if(!pdKey||!dc.email)return;setPdLoading(true);const ex=await pipedriveSearch(dc.email,pdKey);setPdStatus(ex?"exists":(await pipedriveCreate(dc,empresa,pdKey))?"ok":"error");setPdLoading(false);};
  const handleWA=()=>{window.open("https://wa.me/"+dc.wa.replace(/\D/g,""),"_blank");if(onWALog)onWALog(dc.nome);};
  const stC={"ok":"#34D399","invalid":"#FF4757","risky":"#FFB547","unknown":"#555","exists":"#A78BFA"};
  return(
    <>
      {showEmail&&<EmailModal dc={dc} empresa={empresa} setor={setor} grupo={grupo} angulo={grupo.angles[0]} hist="" restrictions={restrictions} onClose={()=>setShowEmail(false)}/>}
      <div className="deccard">
        <div className="decav" style={{background:`rgba(${grupo.rgb},.1)`,color:grupo.color}}>{initials(dc.nome||"?")}</div>
        <div className="decinfo">
          <div className="decname">{dc.nome||"Nome não informado"}{dc.aiSuggested&&<span style={{fontSize:7,marginLeft:5,padding:"1px 4px",borderRadius:3,background:"rgba(167,139,250,.12)",color:"#A78BFA"}}>IA</span>}</div>
          <div className="deccargo">{dc.cargo||"Cargo não informado"}</div>
          <div className="dectags">
            <span className={"dt"+(dc.email?" dtok":"")}>✉ {dc.email||"sem email"}{dc.emailStatus&&<span style={{fontSize:8,padding:"1px 4px",borderRadius:8,background:stC[dc.emailStatus]||"#222",color:"#000",marginLeft:4}}>{dc.emailStatus}</span>}</span>
            <span className={"dt"+(dc.wa?" dtok":"")}>💬 {dc.wa||"sem WA"}</span>
          </div>
        </div>
        <div className="decacts">
          {dc.email&&<button className="btn btno btnsm" onClick={()=>setShowEmail(true)}>✉ Email IA</button>}
          {dc.wa&&<button className="btn btno btnsm" style={{color:"#25D366",borderColor:"rgba(37,211,102,.3)"}} onClick={handleWA}>💬 WA</button>}
          {dc.li&&<button className="btn btno btnsm" onClick={()=>window.open(dc.li.startsWith("http")?dc.li:"https://"+dc.li,"_blank")}>in</button>}
          {dc.email&&!dc.emailStatus&&<button className="btn btno btnsm" onClick={verifyEmail} disabled={verifying}>{verifying?"...":"Validar"}</button>}
          {pdKey&&dc.email&&<button className="btn btno btnsm" onClick={syncPD} disabled={pdLoading} style={{color:"#A78BFA",borderColor:"rgba(167,139,250,.3)"}}>{pdLoading?"...":pdStatus==="exists"?"No Pipe":pdStatus==="ok"?"Criado!":"Pipedrive"}</button>}
          <button className="btn btno btnsm" onClick={onToggleEdit}>{isEditing?"Fechar":"Editar"}</button>
          <button className="btn btnsm" onClick={onRemove} style={{background:"rgba(255,71,87,.08)",color:"#FF4757",border:"1px solid rgba(255,71,87,.2)"}}>✕</button>
        </div>
      </div>
      {isEditing&&(
        <div style={{background:"#0a0a0a",border:"1px solid #181818",borderRadius:4,padding:12,marginBottom:8}}>
          <div className="g2">{[["nome","Nome"],["cargo","Cargo"],["email","Email"],["wa","WhatsApp"]].map(([f,pl])=>(
            <div className="frow" key={f}><div className="flbl">{pl}</div><input className="finp" placeholder={pl} value={dc[f]||""} onChange={e=>onUpdate(f,e.target.value)}/></div>
          ))}</div>
          <div className="frow"><div className="flbl">LinkedIn URL</div><input className="finp" placeholder="linkedin.com/in/..." value={dc.li||""} onChange={e=>onUpdate("li",e.target.value)}/></div>
        </div>
      )}
    </>
  );
}

  // Find restricted leads
  const resLeads=PROSP.filter(l=>{
    return GRUPO.some(g=>checkRestrictions(l,g.id).length>0);
  });

function getSequenceStatus(acc,grupo){
  var acts=acc.activities||[];
  var decs=acc.decisors||[];
  var channels=["email","whatsapp","linkedin"];
  return decs.map(function(d){
    var decActs=acts.filter(function(a){return a.decisor===d.nome;});
    var usedCh=new Set(decActs.map(function(a){return a.type;}));
    var hasReply=decActs.some(function(a){return a.type==="response";});
    var nextCh=channels.find(function(ch){return!usedCh.has(ch);})||null;
    return{dec:d,contacted:decActs.length>0,hasReply:hasReply,nextChannel:nextCh,attempts:decActs.length,lastDate:decActs.length>0?decActs[decActs.length-1].date:null};
  });
}

function getNextAction(acc,grupo){
  if(!acc||!grupo)return{dec:null,channel:null,reason:"Configure a conta primeiro"};
  var seq=getSequenceStatus(acc,grupo);
  var uncontacted=seq.find(function(s){return!s.contacted;});
  if(uncontacted)return{dec:uncontacted.dec,channel:"email",reason:"Primeiro contato"};
  var noReply=seq.find(function(s){return s.contacted&&!s.hasReply&&s.nextChannel;});
  if(noReply)return{dec:noReply.dec,channel:noReply.nextChannel,reason:"Sem resposta — tentando "+noReply.nextChannel};
  return{dec:null,channel:null,reason:"Todos os canais usados — buscar novos decisores"};
}

function NextActionPanel({acc,grupo,onEmail,onEnrich}){
  var nextAct=getNextAction(acc,grupo);
  if(!nextAct||(!nextAct.dec&&!nextAct.reason))return null;
  return(
    <div style={{background:"rgba("+grupo.rgb+",.04)",border:"1px solid rgba("+grupo.rgb+",.15)",borderRadius:8,padding:14,marginBottom:16}}>
      <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:grupo.color,letterSpacing:1,marginBottom:6}}>🎯 PRÓXIMA AÇÃO</div>
      <div style={{fontSize:12,fontWeight:600,marginBottom:4}}>
        {nextAct.dec?nextAct.dec.nome+" — "+(nextAct.channel||"").toUpperCase():"Buscar novos decisores"}
      </div>
      <div style={{fontSize:10,color:"#666",fontFamily:"DM Mono,monospace",marginBottom:8}}>{nextAct.reason}</div>
      {nextAct.channel==="email"&&nextAct.dec&&(
        <button className="btn btnp btnsm" style={{background:grupo.color,color:"#000"}} onClick={onEmail}>✉ Enviar agora</button>
      )}
      {nextAct.channel==="whatsapp"&&nextAct.dec&&nextAct.dec.wa&&(
        <button className="btn btno btnsm" style={{color:"#25D366",borderColor:"rgba(37,211,102,.3)"}} onClick={function(){window.open("https://wa.me/"+(nextAct.dec.wa||"").replace(/[^0-9]/g,""),"_blank");}}>💬 WhatsApp</button>
      )}
      {nextAct.channel==="linkedin"&&nextAct.dec&&(
        <button className="btn btno btnsm" style={{color:"#0077B5",borderColor:"rgba(0,119,181,.3)"}} onClick={function(){window.open(nextAct.dec.li&&nextAct.dec.li.startsWith("http")?nextAct.dec.li:"https://www.linkedin.com","_blank");}}>in LinkedIn</button>
      )}
      {!nextAct.dec&&<button className="btn btno btnsm" style={{color:"#FFB547",borderColor:"rgba(255,181,71,.3)"}} onClick={onEnrich}>⚡ Enriquecer</button>}
    </div>
  );
}

// ─── NULL-SAFE UTILS ──────────────────────────────────────────────────────────
function fitScore(lead,grupo){
  if(!lead||!grupo||typeof grupo.fit!=="function") return 0;
  const f=grupo.fit(lead.setor||"");
  const base=f==="alto"?100:f==="medio"?60:20;
  const boost=lead.rank<=50?30:lead.rank<=100?20:lead.rank<=200?10:0;
  const res=checkRestrictions(lead,grupo.id);
  return base+boost+(res.length>0?-50:0);
}
function getTop50(grupo){
  if(!grupo||!grupo.id||typeof grupo.fit!=="function") return [];
  return (typeof PROSP!=="undefined"?PROSP:[])
    .filter(l=>l&&l.nome&&l.setor)
    .map(l=>({...l,score:fitScore(l,grupo)}))
    .sort((a,b)=>b.score-a.score)
    .slice(0,50);
}

function uid(){return Math.random().toString(36).slice(2,10);}
function today(){return new Date().toISOString().slice(0,10);}
function nowStr(){return new Date().toLocaleString("pt-BR");}
async function sharedGet(k){try{const v=localStorage.getItem("ghub_sh_"+k);return v?JSON.parse(v):null;}catch(e){return null;}}
async function sharedSet(k,v){try{localStorage.setItem("ghub_sh_"+k,JSON.stringify(v));}catch(e){}}
async function personalGet(k){try{const v=localStorage.getItem("ghub_me_"+k);return v?JSON.parse(v):null;}catch(e){return null;}}
async function personalSet(k,v){try{if(v===null){localStorage.removeItem("ghub_me_"+k);}else{localStorage.setItem("ghub_me_"+k,JSON.stringify(v));}}catch(e){}}
async function logActivity(curUser,empresa,grupoName,tipo,tipoLabel,decisor,nota){
  const entry={id:uid(),isoDate:today(),time:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
    userId:curUser?curUser.id:"pedro",userName:curUser?curUser.name:"Pedro Ica",
    empresa,grupoName,tipo,tipoLabel,decisor:decisor||"",nota:nota||""};
  const log=await sharedGet("activities_log")||[];
  log.push(entry);
  if(log.length>3000)log.splice(0,log.length-3000);
  await sharedSet("activities_log",log);
  return entry;
}

// ─── SMART BATCH ─────────────────────────────────────────────────────────────
function SmartBatch({grupo,accs,pdKey,onActivitySaved}){
  const [sel,setSel]=useState({});
  const [emailModal,setEmailModal]=useState(null);
  const [queue,setQueue]=useState([]);
  const [sentCount,setSentCount]=useState(0);
  const today3=new Date(Date.now()-3*24*60*60*1000).toISOString().slice(0,10);
  const candidates=useMemo(()=>{
    if(!grupo||!grupo.id) return [];
    return getTop50(grupo)
      .filter(l=>l&&l.nome&&checkRestrictions(l,grupo.id).length===0)
      .map(l=>{
        const k=grupo.id+"_"+l.rank;
        const a2=accs[k]||{};
        const acts=a2.activities||[];
        const lastE=acts.filter(a=>a.type==="email").slice(-1)[0];
        let lastISO="";
        if(lastE&&lastE.date){const p=lastE.date.split("/");if(p.length===3)lastISO=p[2]+"-"+p[1]+"-"+p[0];}
        const contacted=new Set(acts.map(a=>a.decisor).filter(Boolean));
        const decs=a2.decisors||[];
        const nextDec=decs.find(d=>!contacted.has(d.nome))||decs[0]||null;
        return {...l,lastEmailDate:lastE?lastE.date:null,lastTema:lastE?lastE.note||"":"",
          contactedRecently:lastISO>today3,nextDec,ndecs:decs.length};
      })
      .filter(l=>!l.contactedRecently).slice(0,80);
  },[grupo,accs]);
  const nSel=Object.values(sel).filter(Boolean).length;
  const autoSelect=()=>{
    const sectors={};const chosen={};let count=0;
    for(const l of candidates){
      if(count>=50) break;
      const sec=l.setor||"other";
      if(!sectors[sec]) sectors[sec]=0;
      if(sectors[sec]>=6) continue;
      chosen[l.rank]=true;sectors[sec]++;count++;
    }
    setSel(chosen);
  };
  const openQueue=()=>{
    const sl=candidates.filter(l=>sel[l.rank]);
    setQueue(sl);if(sl.length>0)setEmailModal(sl[0]);
  };
  const advance=(lead)=>{
    setSentCount(n=>n+1);
    if(onActivitySaved)onActivitySaved(lead.nome,"email","✉ Email",lead.nextDec?lead.nextDec.nome:"","Lote");
    const rem=queue.filter(l=>l.rank!==lead.rank);
    if(rem.length>0){setQueue(rem);setEmailModal(rem[0]);}
    else{setEmailModal(null);setQueue([]);}
  };
  const gc=grupo?grupo.color:"#E8C97A";
  const gr=grupo?grupo.rgb:"232,201,122";
  return(
    <div style={{padding:"28px 32px",overflowY:"auto",height:"100%"}}>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{fontSize:22,fontWeight:800,fontFamily:"Syne,sans-serif",letterSpacing:-1}}>✉ Disparo Inteligente — 50/dia</div>
          <div style={{fontSize:11,color:"#555",fontFamily:"DM Mono,monospace",marginTop:4}}>Máx 6/setor · Anti-duplicata 3 dias · Prioriza decisores não contatados</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn btno btnsm" onClick={autoSelect}>⚡ Selecionar 50</button>
          {nSel>0&&<button className="btn btnp btnsm" style={{background:gc,color:"#000"}} onClick={openQueue}>✉ Disparar {nSel}</button>}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20}}>
        {[["SELECIONADOS",nSel,gc],["DISPONÍVEIS",candidates.length,"#eee"],["ENVIADOS HOJE",sentCount,"#34D399"],["TOTAL BASE",PROSP.length,"#60A5FA"]].map(([l,v,col])=>(
          <div key={l} style={{background:"#0e0e0e",border:"1px solid #1a1a1a",borderRadius:8,padding:16,textAlign:"center"}}>
            <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"#444",letterSpacing:1,marginBottom:6}}>{l}</div>
            <div style={{fontSize:24,fontWeight:800,color:col,fontFamily:"Syne,sans-serif"}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {candidates.slice(0,60).map(l=>{
          const isSel=!!sel[l.rank];
          const fit=grupo?grupo.fit(l.setor||""):"medio";
          const fc=fitColor(fit);
          return(
            <div key={l.rank} onClick={()=>setSel(s=>({...s,[l.rank]:!s[l.rank]}))}
              style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",cursor:"pointer",
                background:isSel?"rgba("+gr+",.06)":"#0e0e0e",
                border:"1px solid "+(isSel?"rgba("+gr+",.3)":"#1a1a1a"),borderRadius:7,transition:"all .15s"}}>
              <div style={{width:20,height:20,borderRadius:4,flexShrink:0,
                border:"2px solid "+(isSel?gc:"#2a2a2a"),background:isSel?gc:"transparent",
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#000"}}>
                {isSel&&"✓"}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:700,display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                  #{l.rank} {l.nome}
                  <span style={{fontSize:9,fontFamily:"DM Mono,monospace",padding:"1px 6px",borderRadius:100,
                    background:"rgba("+hexRgb(fc)+",.1)",color:fc,border:"1px solid rgba("+hexRgb(fc)+",.25)"}}>{fitLabel(fit)}</span>
                </div>
                <div style={{fontSize:10,color:"#555",fontFamily:"DM Mono,monospace",marginTop:2}}>
                  {l.setor}
                  {l.lastEmailDate?<span style={{color:"#444"}}> · {l.lastEmailDate}{l.lastTema?" — "+String(l.lastTema).slice(0,28):""}</span>:
                    <span style={{color:"#34D399"}}> · nunca contatado</span>}
                </div>
                {l.nextDec&&<div style={{fontSize:9,color:gc,fontFamily:"DM Mono,monospace",marginTop:2}}>→ {l.nextDec.nome} · {l.nextDec.cargo}</div>}
              </div>
              <button className="btn btno btnsm" onClick={e=>{e.stopPropagation();setEmailModal(l);}} style={{flexShrink:0}}>✉</button>
            </div>
          );
        })}
      </div>
      {emailModal&&grupo&&(
        <EmailModal dc={emailModal.nextDec||null} empresa={emailModal.nome} setor={emailModal.setor||""} grupo={grupo}
          angulo={grupo.angles[0]} hist="" restrictions={checkRestrictions(emailModal,grupo.id)}
          onClose={()=>advance(emailModal)}/>
      )}
    </div>
  );
}

                  {l.setor} · #{l.rank} · {l.daysSince===999?"nunca contatado":l.daysSince===0?"hoje":"há "+l.daysSince+" dias"}
                </div>
                {!isDone&&<input placeholder="Nota rápida..." value={noteMap[l.rank]||""}
                  onChange={e=>setNoteMap(n=>({...n,[l.rank]:e.target.value}))}
                  style={{marginTop:6,width:"100%",maxWidth:280,background:"#060606",border:"1px solid #1e1e1e",
                    borderRadius:4,padding:"4px 8px",color:"#eee",fontSize:10,fontFamily:"DM Mono,monospace",outline:"none"}}/>}
              </div>
              {!isDone?(
                <div style={{display:"flex",gap:6,flexShrink:0}}>
                  <button onClick={()=>logCall(l,"call")} style={{padding:"7px 14px",borderRadius:5,border:"none",background:gc,color:"#000",fontWeight:700,fontSize:11,cursor:"pointer"}}>📞 Ligar</button>
                  <button onClick={()=>logCall(l,"email")} style={{padding:"7px 12px",borderRadius:5,border:"1px solid #1e1e1e",background:"transparent",color:"#aaa",fontSize:11,cursor:"pointer"}}>✉</button>
                </div>
              ):<div style={{fontSize:11,color:"#34D399",fontFamily:"DM Mono,monospace",flexShrink:0}}>✓ {done[l.rank]==="call"?"ligado":"enviado"}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── HOLDING VIEW ─────────────────────────────────────────────────────────────
function HoldingView(){
  const [sel,setSel]=useState(null);
  const RESTR=typeof RESTRICTIONS!=="undefined"?RESTRICTIONS:[];
  return(
    <div style={{flex:1,overflow:"auto",padding:"28px 32px"}}>
      <div style={{marginBottom:24}}>
        <div style={{fontSize:26,fontWeight:800,letterSpacing:"-1px",fontFamily:"Syne,sans-serif"}}>Galeria Holding</div>
        <div style={{fontSize:11,color:"#555",fontFamily:"DM Mono,monospace",marginTop:5}}>Todas as empresas — clique para ver conflitos de cliente</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:12}}>
        {GRUPO.map(g=>{
          const myRes=RESTR.filter(r=>r.agencies&&r.agencies.includes(g.id));
          const isOpen=sel===g.id;
          return(
            <div key={g.id} onClick={()=>setSel(isOpen?null:g.id)}
              style={{background:"#0e0e0e",border:"1px solid "+(isOpen?g.color:"#1a1a1a"),
                borderRadius:10,padding:18,cursor:"pointer",transition:"all .2s"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <div style={{width:9,height:9,borderRadius:"50%",background:g.color}}></div>
                <div style={{fontSize:15,fontWeight:800,fontFamily:"Syne,sans-serif",color:g.color}}>{g.name}</div>
              </div>
              <div style={{fontSize:10,color:"#444",fontFamily:"DM Mono,monospace",lineHeight:1.5,marginBottom:10}}>{g.desc}</div>
              {isOpen&&(myRes.length>0?(
                <div>
                  <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"#FF4757",marginBottom:7,letterSpacing:1}}>⚠ CONFLITOS</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                    {myRes.map((r,i)=><span key={i} style={{fontSize:8,fontFamily:"DM Mono,monospace",padding:"2px 6px",borderRadius:3,background:"rgba(255,71,87,.1)",color:"#FF4757",border:"1px solid rgba(255,71,87,.2)"}}>{r.category}</span>)}
                  </div>
                </div>
              ):<div style={{fontSize:10,fontFamily:"DM Mono,monospace",color:"#34D399"}}>✓ Sem restrições</div>)}
              {!isOpen&&myRes.length>0&&<div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"rgba(255,71,87,.5)",marginTop:5}}>{myRes.length} conflito(s)</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({curUser,onClose}){
  const [log,setLog]=useState([]);
  const [loading,setLoading]=useState(true);
  const [period,setPeriod]=useState("today");
  useEffect(()=>{(async()=>{const l=await sharedGet("activities_log")||[];setLog(l);setLoading(false);})();},[]);
  const todayStr=today();
  const weekAgo=new Date(Date.now()-7*24*60*60*1000).toISOString().slice(0,10);
  const filtered=log.filter(e=>{
    if(period==="today")return e.isoDate===todayStr;
    if(period==="week")return e.isoDate>=weekAgo;
    return true;
  });
  const todayCount=log.filter(e=>e.isoDate===todayStr).length;
  const weekCount=log.filter(e=>e.isoDate>=weekAgo).length;
  const callCount=filtered.filter(e=>e.tipo==="call").length;
  const meetCount=filtered.filter(e=>e.tipo==="meeting").length;
  const ratio=callCount>0?(meetCount/callCount*100).toFixed(0)+"%":"—";
  const byEmpresa={};filtered.forEach(e=>{byEmpresa[e.empresa]=(byEmpresa[e.empresa]||0)+1;});
  const maxE=Math.max(...Object.values(byEmpresa),1);
  const exportCSV=()=>{
    const rows=["data,hora,usuario,empresa,decisor,tipo,nota"];
    filtered.forEach(e=>{rows.push([e.isoDate,e.time,e.userName,e.empresa,e.decisor,e.tipo,e.nota].join(","));});
    const blob=new Blob([rows.join("\n")],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="dashboard_"+period+".csv";a.click();
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.92)",zIndex:9999,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:20,overflowY:"auto"}}>
      <div style={{background:"#0e0e0e",border:"1px solid #1e1e1e",borderRadius:10,width:"100%",maxWidth:700,padding:28}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22}}>
          <div><div style={{fontSize:20,fontWeight:800,fontFamily:"Syne,sans-serif"}}>📊 Dashboard Comercial</div></div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={exportCSV} style={{padding:"5px 12px",border:"1px solid #1e1e1e",borderRadius:3,background:"transparent",color:"#34D399",fontSize:9,fontFamily:"DM Mono,monospace",cursor:"pointer"}}>↓ CSV</button>
            <button onClick={onClose} style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:22}}>×</button>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20}}>
          {[["HOJE",todayCount,"#E8C97A"],["7 DIAS",weekCount,"#eee"],["COLD CALLS",callCount,"#60A5FA"],["RATIO REUNIÃO",ratio,"#34D399"]].map(([l,v,col])=>(
            <div key={l} style={{background:"#111",border:"1px solid #1a1a1a",borderRadius:8,padding:16,textAlign:"center"}}>
              <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"#444",letterSpacing:1,marginBottom:6}}>{l}</div>
              <div style={{fontSize:22,fontWeight:800,color:col,fontFamily:"Syne,sans-serif"}}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:6,marginBottom:16}}>
          {[["today","Hoje"],["week","7 dias"],["all","Tudo"]].map(([v,l])=>(
            <button key={v} onClick={()=>setPeriod(v)} style={{padding:"4px 10px",borderRadius:3,
              border:"1px solid "+(period===v?"#E8C97A":"#1e1e1e"),background:period===v?"rgba(232,201,122,.08)":"transparent",
              color:period===v?"#E8C97A":"#555",fontSize:9,fontFamily:"DM Mono,monospace",cursor:"pointer"}}>{l}</button>
          ))}
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"#444",letterSpacing:1,marginBottom:10,textTransform:"uppercase"}}>Top Empresas</div>
          {Object.entries(byEmpresa).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([e,n])=>(
            <div key={e} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <div style={{flex:1,fontSize:11,color:"#888",fontFamily:"DM Mono,monospace",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e}</div>
              <div style={{width:n/maxE*80,height:4,background:"#E8C97A",borderRadius:2,opacity:.7}}></div>
              <div style={{fontSize:10,color:"#E8C97A",minWidth:20,textAlign:"right",fontFamily:"DM Mono,monospace"}}>{n}</div>
            </div>
          ))}
        </div>
        {loading?<div style={{textAlign:"center",padding:20,color:"#333",fontSize:11}}>Carregando...</div>:
          filtered.length===0?<div style={{textAlign:"center",padding:20,color:"#333",fontSize:11}}>Nenhuma atividade no período</div>:(
            <div style={{maxHeight:280,overflowY:"auto"}}>
              {[...filtered].reverse().map((e,i)=>(
                <div key={i} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 0",borderBottom:"1px solid #111"}}>
                  <div style={{width:28,height:28,borderRadius:"50%",background:"#111",border:"1px solid #1a1a1a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>
                    {{email:"✉",call:"📞",whatsapp:"💬",linkedin:"in",meeting:"🤝",response:"↩"}[e.tipo]||"◎"}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12,fontWeight:600}}>{e.empresa}{e.decisor?" → "+e.decisor:""}</div>
                    <div style={{fontSize:9,color:"#555",fontFamily:"DM Mono,monospace",marginTop:2}}>{e.isoDate} {e.time} · {e.userName}</div>
                    {e.nota&&<div style={{fontSize:10,color:"#666",marginTop:3,borderLeft:"2px solid #1a1a1a",paddingLeft:8}}>{e.nota}</div>}
                  </div>
                </div>
              ))}
            </div>
          )
        }
      </div>
    </div>
  );
}

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function ModalPortal({children}){
  var el=typeof document!=="undefined"?document.getElementById("modal-root"):null;
  if(!el||!ReactDOM.createPortal)return children;
  return ReactDOM.createPortal(children,el);
}

function LoginScreen({onLogin}){
  const [name,setName]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const doLogin=async()=>{
    setErr("");setLoading(true);
    let users=await sharedGet("users")||{};
    if(Object.keys(users).length===0){
      const id=uid();
      users[id]={id,name:"Pedro Ica",pass:"galeria2024",role:"admin"};
      await sharedSet("users",users);
    }
    const u=Object.values(users).find(u=>u.name.toLowerCase()===name.toLowerCase()&&u.pass===pass);
    if(!u){setErr("Nome ou senha incorretos.");setLoading(false);return;}
    await personalSet("session",{uid:u.id,name:u.name,role:u.role});
    onLogin(u);setLoading(false);
  };
  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#060606"}}>
      <div style={{width:"100%",maxWidth:360,padding:36,background:"#0e0e0e",border:"1px solid #1e1e1e",borderRadius:12}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{fontSize:24,fontWeight:800,fontFamily:"Syne,sans-serif",letterSpacing:-1}}>GALERIA HOLDING</div>
          <div style={{fontSize:10,fontFamily:"DM Mono,monospace",color:"#333",letterSpacing:3,marginTop:4}}>CENTRAL COMERCIAL</div>
        </div>
        <div className="frow"><div className="flbl">NOME</div><input className="finp" placeholder="Seu nome" value={name} onChange={e=>setName(e.target.value)}/></div>
        <div className="frow"><div className="flbl">SENHA</div><input className="finp" type="password" placeholder="Senha" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doLogin()}/></div>
        {err&&<div style={{fontSize:11,color:"#FF4757",fontFamily:"DM Mono,monospace",marginBottom:12,padding:"8px 12px",background:"rgba(255,71,87,.06)",border:"1px solid rgba(255,71,87,.2)",borderRadius:5}}>{err}</div>}
        <button onClick={doLogin} disabled={loading} style={{width:"100%",padding:"11px 0",borderRadius:5,border:"none",background:"#E8C97A",color:"#000",fontWeight:800,fontSize:13,cursor:"pointer",marginTop:8}}>
          {loading?"Entrando...":"Entrar"}
        </button>
        <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"#222",textAlign:"center",marginTop:12}}>Pedro Ica / galeria2024</div>
      </div>
    </div>
  );
}

function App(){
  const [curGrupo,setCurGrupo]=useState(GRUPO[0]);
  const [curLead,setCurLead]=useState(null);
  const [sbQ,setSbQ]=useState("");
  const [fitFil,setFitFil]=useState("all");
  const [accs,setAccs]=useState(()=>loadSt("ghub_accs",{}));
  const [pdKey,setPdKey]=useState(()=>loadSt("ghub_pd",""));
  const [cfgOpen,setCfgOpen]=useState(false);
  const [cfgPD,setCfgPD]=useState("");
  const [resOpen,setResOpen]=useState(false);

  // Quarterly reminder
  const lastReview=loadSt("ghub_res_review",null);
  const showReminder=!lastReview||(new Date()-new Date(lastReview))>(90*24*60*60*1000);

  // Session restore
  useEffect(()=>{(async()=>{
    const sess=await personalGet("session");
    if(sess){setCurUser({id:sess.uid||"pedro",name:sess.name||"Pedro Ica",role:sess.role||"admin"});}
    setSessLoading(false);
  })();},[]);

  const onLogin=async(user)=>{
    setCurUser(user);
    await personalSet("session",{uid:user.id,name:user.name,role:user.role});
  };
  const logout=async()=>{await personalSet("session",null);setCurUser(null);};
  const onActivitySaved=async(empresa,tipo,tipoLabel,decisor,nota)=>{
    if(curUser) await logActivity(curUser,empresa,curGrupo.name,tipo,tipoLabel,decisor,nota);
  };

  useEffect(()=>{saveSt("ghub_accs",accs);},[accs]);
  useEffect(()=>{saveSt("ghub_pd",pdKey);},[pdKey]);
  useEffect(()=>{
    document.documentElement.style.setProperty("--tc",curGrupo.color);
    document.documentElement.style.setProperty("--tcr",curGrupo.rgb);
  },[curGrupo]);

  const filtered=useMemo(()=>PROSP.filter(d=>{
    const fit=curGrupo.fit(d.setor||"");
    const res=checkRestrictions(d,curGrupo.id);
    if(fitFil==="restrito"&&res.length===0)return false;
    if(fitFil==="crm"&&!accs[curGrupo.id+"_"+d.rank])return false;
    if(fitFil==="alto"&&fit!=="alto")return false;
    if(fitFil==="medio"&&fit!=="medio")return false;
    if(sbQ&&!d.nome.includes(sbQ.toUpperCase()))return false;
    return true;
  }),[curGrupo,fitFil,sbQ,accs]);

  const accKey=(g,r)=>g.id+"_"+r;
  const getAcc=()=>curLead?accs[accKey(curGrupo,curLead.rank)]||{decisors:[],activities:[],intel:null,alerts:[],pdDealId:null}:{};
  const setAcc=v=>setAccs(a=>({...a,[accKey(curGrupo,curLead.rank)]:v}));

  if(sessLoading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#060606",color:"#333",fontFamily:"DM Mono,monospace",fontSize:12}}>Carregando...</div>;
  if(!curUser) return <LoginScreen onLogin={onLogin}/>;

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
      {cfgOpen&&(<div className="modov"><div className="mod">
        <div className="modtitle">⚙ Configurações</div>
        <div className="frow"><div className="flbl">PIPEDRIVE API KEY</div><input className="finp" type="password" placeholder="api key do pipedrive" value={cfgPD} onChange={e=>setCfgPD(e.target.value)}/></div>
        <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"#333",marginTop:4,marginBottom:12}}>Hunter.io e Lusha já configurados. Pipedrive opcional para sync de CRM.</div>
        <div className="modacts"><button className="btn btno btnsm" onClick={()=>setCfgOpen(false)}>Cancelar</button><button className="btn btnp btnsm" style={{background:curGrupo.color}} onClick={()=>{setPdKey(cfgPD);setCfgOpen(false);}}>Salvar</button></div>
      </div></div>)}
      {resOpen&&<RestrictionsPanel onClose={()=>setResOpen(false)}/>}

      {/* QUARTERLY REMINDER BANNER */}
      {showReminder&&(
        <div className="reminder" style={{padding:"10px 18px"}}>
          <span style={{fontSize:14}}>📅</span>
          <div className="reminder-txt">Revisão trimestral de restrições pendente — confirme se os clientes e conflitos ainda estão ativos.</div>
          <button className="reminder-btn" onClick={()=>setResOpen(true)}>Ver restrições</button>
          <button className="reminder-btn" style={{borderColor:"rgba(255,181,71,.2)",color:"#555"}} onClick={()=>saveSt("ghub_res_review",new Date().toISOString())}>Dispensar</button>
        </div>
      )}

      {/* TOPBAR */}
      <div className="topbar">
        <div className="brand"><div className="bdot" style={{background:curGrupo.color}}></div><span className="bname" style={{color:curGrupo.color}}>HOLDING</span></div>
        <div className="tabs-row">
          {GRUPO.map(g=>(
            <div key={g.id} className={"ctab"+(curGrupo.id===g.id?" on":"")} style={{"--tc":g.color}} onClick={()=>{setCurGrupo(g);setCurLead(null);}}>
              <div className="tdot" style={{background:g.color}}></div>
              <span className="tname" style={curGrupo.id===g.id?{color:g.color}:{}}>{g.name}</span>
            </div>
          ))}
        </div>
        <div className="tb-right">
          <div className="api-chip"><div className="apdot" style={{background:"#00FF94"}}></div><span>HUNTER</span></div>
          <div className="api-chip"><div className="apdot" style={{background:pdKey?"#00FF94":"#2a2a2a"}}></div><span>PIPEDRIVE</span></div>
          <button onClick={()=>{setViewMode("holding");setCurLead(null);}} style={{padding:"4px 10px",border:"1px solid #1e1e1e",borderRadius:3,background:"transparent",color:"#555",fontSize:9,fontFamily:"DM Mono,monospace",cursor:"pointer"}}>🏢 Holding</button>
          <button onClick={()=>{setViewMode("batch");setCurLead(null);}} style={{padding:"4px 10px",border:"1px solid #1e1e1e",borderRadius:3,background:"transparent",color:"#555",fontSize:9,fontFamily:"DM Mono,monospace",cursor:"pointer"}}>✉ Lote</button>
          <button onClick={()=>{setViewMode("calls");setCurLead(null);}} style={{padding:"4px 10px",border:"1px solid rgba(255,71,87,.3)",borderRadius:3,background:"transparent",color:"#FF4757",fontSize:9,fontFamily:"DM Mono,monospace",cursor:"pointer"}}>📞 Calls</button>
          <button onClick={()=>setDashOpen(true)} style={{padding:"4px 10px",border:"1px solid rgba(96,165,250,.3)",borderRadius:3,background:"transparent",color:"#60A5FA",fontSize:9,fontFamily:"DM Mono,monospace",cursor:"pointer"}}>📊 Dash</button>
          <button className="resbtn" onClick={()=>setResOpen(true)}>⚠ Restrições</button>
          <button className="cfgbtn" onClick={()=>{setCfgPD(pdKey);setCfgOpen(true);}}>⚙ Config</button>
        </div>
      </div>

      {/* WORKSPACE */}
      {dashOpen&&<Dashboard curUser={curUser} onClose={()=>setDashOpen(false)}/>}
      {viewMode==="holding"?(
        <div className="ws"><HoldingView/></div>
      ):viewMode==="batch"?(
        <div className="ws" style={{flex:1,overflow:"hidden",display:"flex"}}><SmartBatch grupo={curGrupo} accs={accs} pdKey={pdKey} onActivitySaved={onActivitySaved}/></div>
      ):viewMode==="calls"?(
        <div className="ws" style={{flex:1,overflow:"hidden",display:"flex"}}><ColdCallView grupo={curGrupo} accs={accs} onActivitySaved={onActivitySaved}/></div>
      ):(
      <div className="ws">
        <div className="sb" style={{"--tc":curGrupo.color,"--tcr":curGrupo.rgb}}>
          <div className="sbhead"><span className="sbtitle">ANUNCIANTES</span><span className="sbcnt">{filtered.length}</span></div>
          <div className="sbsearch"><input placeholder="Buscar empresa..." value={sbQ} onChange={e=>setSbQ(e.target.value)}/></div>
          <div className="sbfil">
            {[["all","TODOS"],["alto","FIT ALTO"],["medio","FIT MED"],["crm","NO CRM"],["restrito","RESTRITOS"]].map(([f,l])=>(
              <button key={f} className={"fb"+(fitFil===f?" on":"")+(f==="restrito"?" res":"")} onClick={()=>setFitFil(f)}>{l}</button>
            ))}
          </div>
          <div className="sblist">
            {filtered.slice(0,200).map(d=>{
              const fit=curGrupo.fit(d.setor||"");
              const fc=fitColor(fit);
              const res=checkRestrictions(d,curGrupo.id);
              const isRes=res.length>0;
              const isSel=curLead&&curLead.rank===d.rank;
              const hasCrm=!!accs[accKey(curGrupo,d.rank)];
              return(
                <div key={d.rank+d.nome} className={"coitem"+(isSel?" sel":"")+(isRes?" restricted":"")} onClick={()=>setCurLead(d)}>
                  <span className="corank">{d.rank}</span>
                  <div className="cobody">
                    <div className="coname">{d.nome}{isRes&&<span style={{fontSize:7,marginLeft:5,color:"#FF4757"}}>●</span>}</div>
                    <div className="cosec">{d.setor}{isRes&&<span style={{color:"rgba(255,71,87,.6)",marginLeft:4,fontSize:7}}>conflito</span>}</div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                    {isRes?<span className="restag">RESTRITO</span>:<span className="fittag" style={{background:`rgba(${hexRgb(fc)},.08)`,color:fc,border:`1px solid rgba(${hexRgb(fc)},.2)`}}>{fitLabel(fit)}</span>}
                    {hasCrm&&<div className="crmdot"></div>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="main" style={{"--tc":curGrupo.color,"--tcr":curGrupo.rgb}}>
          {curLead?(
            <AgentView key={curGrupo.id+"_"+curLead.rank} grupo={curGrupo} lead={curLead} acc={getAcc()} pdKey={pdKey} onAccUpdate={setAcc}/>
          ):(
            <>
              <div className="subtabs"></div>
              <div className="panel"><div className="empty"><div className="emptyicon">◎</div><div style={{fontSize:16,fontWeight:800}}>{curGrupo.name}</div><div style={{fontSize:10,fontFamily:"DM Mono,monospace",maxWidth:220,lineHeight:1.7,textAlign:"center"}}>{curGrupo.desc}<br/><br/>Selecione um anunciante para começar a prospecção.</div></div></div>
            </>
          )}
        </div>
      </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
