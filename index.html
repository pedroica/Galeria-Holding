// ─── CHECK RESTRICTION ────────────────────────────────────────────────────────
function checkRestrictions(lead, groupId, customRestrictions=[]) {
  const allRes = [...RESTRICTIONS, ...customRestrictions];
  const matched = allRes.filter(r => {
    if (!r.agencies.includes(groupId)) return false;
    // Check expiry
    if (r.expiresAt) {
      const exp = new Date(r.expiresAt);
      if (exp < new Date()) return false; // expired, no longer restricted
    }
    return r.keywords.some(kw => lead.nome.toUpperCase().includes(kw.toUpperCase()));
  });
  return matched;
}

function getAssinatura(grupoId){
  if(grupoId==="gaia") return "Equipe GAIA\nGAIA — Martech | Galeria Holding";
  const nomes={"galeria":"Galeria","mila":"Milà","404":"404","cccaramelo":"cccaramelo","catalyst":"Catalyst","mantiqueira":"Mantiqueira","agente":"A.gente","vitrine":"Vitrine","gux":"GUX"};
  const nome=nomes[grupoId]||grupoId;
  return `Equipe ${nome}\n${nome} faz parte da Galeria Holding\ngaleria-holding.com.br`;
}

async function gerarEmail(nome,empresa,setor,grupo,angulo,tom,hist){
  const promptRico=PROMPTS_RICOS[grupo.id]||grupo.prompt;
  const assinatura=getAssinatura(grupo.id);
  const prompt=`${promptRico}

Escreva um email de prospecção B2B PERSONALIZADO para a empresa ${empresa} do setor ${setor}.
ÂNGULO: ${angulo}
TOM: ${tom}
${nome?"DESTINATÁRIO: "+nome+"\n":""}${hist?"HISTÓRICO DE CONTATO: "+hist+"\nATENÇÃO: este é um follow-up — mencione sutilmente o contato anterior sem repetir o mesmo argumento.\n":""}
DOR IDENTIFICADA PARA ESTE SETOR: ${grupo.dor(setor)}

REGRAS OBRIGATÓRIAS:
1. Primeira linha: observação ESPECÍFICA e CONCRETA sobre ${empresa} — algo sobre o negócio deles, não genérico
2. Segunda parte: conectar a dor identificada ao que ${grupo.name} resolve — de forma direta e sem jargão
3. Uma frase com prova ou referência de resultado (pode ser de setor similar)
4. CTA simples: propor 20 minutos de conversa, sem pressão
5. Tom: ${tom.toLowerCase()}, humano, sem corporativês, parágrafos curtos com linha em branco entre eles
6. Máximo 160 palavras no corpo
7. ASSINATURA OBRIGATÓRIA (use exatamente assim no final):

${assinatura}

Retorne APENAS JSON válido sem markdown: {"assunto":"...","corpo":"..."}`;
  const r=await claudeFetch({model:"claude-sonnet-4-20250514",max_tokens:900,messages:[{role:"user",content:prompt}]});
  const d=await r.json();
  const txt=(d.content&&d.content[0]&&d.content[0].text)||"{}";
  return JSON.parse(txt.replace(/```json|```/g,"").trim());
}
async function gerarIntel(empresa,setor,grupo,decs,hist){
  const prompt=`Você é analista de inteligência comercial para ${grupo.name} (${grupo.desc}).\nEMPRESA: ${empresa} | SETOR: ${setor}\nDECISORES: ${decs||"nenhum"}\nHISTÓRICO: ${hist||"nenhuma atividade"}\n\nGere análise estratégica em parágrafos fluidos (sem bullets) cobrindo: diagnóstico de fit com ${grupo.name}, recomendação baseada no histórico, serviço com maior chance de abrir porta e insight de timing do setor ${setor}. Máximo 200 palavras.`;
  const r=await claudeFetch({model:"claude-sonnet-4-20250514",max_tokens:700,messages:[{role:"user",content:prompt}]});
  const d=await r.json();
  return(d.content&&d.content[0]&&d.content[0].text)||"";
}
async function gerarAlertas(empresa,setor,grupo){
  const prompt=`Simule 3 alertas de inteligência de mercado sobre ${empresa} (setor ${setor}) relevantes para ${grupo.name}. JSON sem markdown: [{"title":"...","desc":"...","urgency":"new"}]`;
  const r=await claudeFetch({model:"claude-sonnet-4-20250514",max_tokens:500,messages:[{role:"user",content:prompt}]});
  const d=await r.json();
  try{return JSON.parse((d.content&&d.content[0]&&d.content[0].text||"[]").replace(/```json|```/g,"").trim());}catch{return[];}
}

// ─── GLOBAL MAILING CSV ──────────────────────────────────────────────────────
function exportMailing(accs,grupo){
  const rows=["empresa,setor,nome,cargo,email,whatsapp,linkedin,contatado,adicionado_em"];
  PROSP.forEach(lead=>{
    const key=grupo.id+"_"+lead.rank;
    const acc=accs[key];
    if(!acc||!(acc.decisors||[]).length) return;
    acc.decisors.forEach(d=>{
      if(!d.nome) return;
      const contacted=(acc.activities||[]).some(a=>a.decisor===d.nome);
      var qg=function(v){return String(v||"").replace(/,/g," ");};
      rows.push([qg(lead.nome),qg(lead.setor),qg(d.nome),qg(d.cargo),qg(d.email),qg(d.wa),qg(d.li),contacted?"sim":"nao",qg(d.addedAt)].join(","));
    });
  });
  if(rows.length===1){alert("Nenhum decisor enriquecido ainda.");return;}
  var csvData=rows.join("\n");var blob=new Blob([csvData],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="mailing_completo_"+grupo.name+"_"+new Date().toISOString().slice(0,10)+".csv";a.click();
}

// ─── VCARD / IPHONE ───────────────────────────────────────────────────────────
function downloadVCard(dc,empresa){
  var vlines=["BEGIN:VCARD","VERSION:3.0","FN:"+(dc.nome||""),"ORG:"+empresa,"TITLE:"+(dc.cargo||""),"EMAIL;TYPE=WORK:"+(dc.email||""),"TEL;TYPE=CELL:"+(dc.wa||""),"URL:"+(dc.li||""),"NOTE:Galeria Holding","END:VCARD"];
  var v=vlines.join("\r\n");
  const blob=new Blob([v],{type:"text/vcard"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(dc.nome||"contato").replace(/\s+/g,"_")+".vcf";a.click();
}

// ─── FIT SCORE for pipeline ───────────────────────────────────────────────────
function fitScore(lead,grupo){
  const f=grupo.fit(lead.setor||"");
  const base=f==="alto"?100:f==="medio"?60:20;
  const boost=lead.rank<=50?30:lead.rank<=100?20:lead.rank<=200?10:0;
  const res=checkRestrictions(lead,grupo.id).length>0?-50:0;
  return base+boost+res;
}

function getTop50(grupo){
  return PROSP
    .map(l=>({...l,score:fitScore(l,grupo)}))
    .sort((a,b)=>b.score-a.score)
    .slice(0,50);
}

// ─── ENRICH FUNCTION ─────────────────────────────────────────────────────────
async function enrichLead(lead,pdKey,onResult){
  const domain=getDomain(lead.nome);
  const results=[];
  if(domain){
    const emails=await hunterSearch(domain);
    const mkKw=["cmo","chief marketing","marketing","brand","comunicacao","media","midia","vp market","diretor","gerente","head"];
    const filtered=emails.filter(e=>mkKw.some(k=>(e.position||"").toLowerCase().includes(k)));
    const src=filtered.length>0?filtered:emails.slice(0,5);
    for(const em of src.slice(0,5)){
      const fn=(em.first_name||"").trim(),ln=(em.last_name||"").trim();
      let wa="";
      if(fn&&ln) wa=await lushaSearch(fn,ln,lead.nome);
      const d={nome:(fn+" "+ln).trim(),cargo:em.position||"Marketing",email:em.value||"",wa:wa||"",li:em.linkedin||"",emailStatus:em.verification&&em.verification.result||null,addedAt:new Date().toLocaleDateString("pt-BR")};
      results.push(d);
      if(pdKey) await pipedriveCreate(d,lead.nome,pdKey);
    }
  }
  onResult(results,domain);
}

function initials(name){return(name||"?").split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();}
function loadSt(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}}
function saveSt(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function hexRgb(h){const m=h.replace("#","").match(/.{2}/g);return m?m.map(x=>parseInt(x,16)).join(","):"255,255,255";}

  const syncPD=async()=>{if(!pdKey||!dc.email)return;setPdLoading(true);const ex=await pipedriveSearch(dc.email,pdKey);setPdStatus(ex?"exists":(await pipedriveCreate(dc,empresa,pdKey))?"ok":"error");setPdLoading(false);};
  const stC={"ok":"#34D399","invalid":"#FF4757","risky":"#FFB547","unknown":"#555","exists":"#A78BFA"};
  return(
    <>
      {showEmail&&<EmailModal dc={dc} empresa={empresa} setor={setor} grupo={grupo} angulo={grupo.angles[0]} hist="" restrictions={restrictions} onClose={()=>setShowEmail(false)}/>}

            <span className={"dt"+(dc.email?" dtok":"")}>✉ {dc.email||"sem email"}{dc.emailStatus&&<span style={{fontSize:8,padding:"1px 4px",borderRadius:8,background:stC[dc.emailStatus]||"#222",color:"#000",marginLeft:4}}>{dc.emailStatus}</span>}</span>

          <button className="btn btno btnsm" onClick={onToggleEdit}>{isEditing?"Fechar":"Editar"}</button>

        <div style={{background:"#0a0a0a",border:"1px solid #181818",borderRadius:4,padding:12,marginBottom:8}}>

// ─── AGENT VIEW ───────────────────────────────────────────────────────────────
function AgentView({grupo,lead,acc,pdKey,curUser,onAccUpdate,onActivitySaved,accs}){
  const [tab,setTab]=useState("overview");
  const [curAngle,setCurAngle]=useState(0);
  const [emailModal,setEmailModal]=useState(false);
  const [intelLoading,setIntelLoading]=useState(false);
  const [monLoading,setMonLoading]=useState(false);
  const [actModal,setActModal]=useState(false);
  const [decModal,setDecModal]=useState(false);
  const [editDec,setEditDec]=useState({});
  const [actType,setActType]=useState("email");
  const [actDec,setActDec]=useState("");
  const [actNote,setActNote]=useState("");
  const [newDec,setNewDec]=useState({nome:"",cargo:"",email:"",wa:"",li:""});

  const setor=lead.setor||"";
  const fit=grupo.fit(setor);
  const dor=grupo.dor(setor);
  const restrictions=checkRestrictions(lead,grupo.id);
  const isRestricted=restrictions.length>0;
  const hist=(acc.activities||[]).map(a=>a.typeLabel+" "+a.date+(a.note?": "+a.note:"")).join("; ");
  const decStr=(acc.decisors||[]).map(d=>d.nome+" ("+d.cargo+")").join(", ");

  const tabs=[["overview","VISÃO GERAL"],["decisores","DECISORES"],["historico","HISTÓRICO"],["email","EMAIL"],["intel","INTELIGÊNCIA"],["pipeline","TOP 50 FIT"]];

  const genIntel=async()=>{setIntelLoading(true);const t=await gerarIntel(lead.nome,setor,grupo,decStr,hist);onAccUpdate({...acc,intel:t});setIntelLoading(false);};
  const runMon=async()=>{setMonLoading(true);const al=await gerarAlertas(lead.nome,setor,grupo);onAccUpdate({...acc,alerts:[...(acc.alerts||[]),...al.map(a=>({...a,date:new Date().toLocaleDateString("pt-BR")})) ]});setMonLoading(false);};

  const saveAct=async()=>{
    const tmap={email:"✉ Email",call:"📞 Ligação",whatsapp:"💬 WhatsApp",linkedin:"in LinkedIn",meeting:"🤝 Reunião",response:"↩ Resposta"};
    const a={type:actType,typeLabel:tmap[actType]||actType,decisor:actDec,note:actNote,date:new Date().toLocaleDateString("pt-BR"),synced:false};
    const newActs=[...(acc.activities||[]),a];
    onAccUpdate({...acc,activities:newActs});
    if(pdKey){await createActivity(acc.pdDealId,tmap[actType]+" — "+lead.nome,actNote,pdKey);a.synced=true;}
    // Log globally for dashboard
    if(onActivitySaved) await onActivitySaved(lead.nome,actType,tmap[actType]||actType,actDec,actNote);
    setActModal(false);setActNote("");
    if(newActs.length>=3&&newActs.length%3===0)setTimeout(genIntel,800);
  };

  const saveDec=async()=>{
    if(!newDec.nome)return;
    const d={...newDec,addedAt:new Date().toLocaleDateString("pt-BR")};
    onAccUpdate({...acc,decisors:[...(acc.decisors||[]),d]});
    if(pdKey) await pipedriveCreate(d,lead.nome,pdKey);
    setDecModal(false);setNewDec({nome:"",cargo:"",email:"",wa:"",li:""});
  };

  const [enriching,setEnriching]=useState(false);
  const [enrichLog,setEnrichLog]=useState("");
  const [aiSuggestions,setAiSuggestions]=useState([]);

  const doEnrich=async()=>{
    setEnriching(true);
    setAiSuggestions([]);
    setEnrichLog("Buscando decisores via Hunter + Lusha...");
    // Step 1: Hunter + Lusha
    await enrichLead(lead,pdKey,(results,domain)=>{
      if(!domain){
        setEnrichLog("Domínio não mapeado — sugerindo decisores via IA...");
        suggestWithAI();
        return;
      }
      if(!results.length){
        setEnrichLog("Hunter não encontrou contatos — sugerindo via IA...");
        suggestWithAI();
        return;
      }
      const existing=acc.decisors||[];
      const novos=results.filter(r=>r.email&&!existing.some(e=>e.email===r.email));
      onAccUpdate({...acc,decisors:[...existing,...novos]});
      setEnrichLog("✓ "+novos.length+" decisores adicionados via Hunter+Lusha"+(pdKey?" + Pipedrive":"")+". Gerando sugestões IA...");
      suggestWithAI(novos);
    });
  };

  const suggestWithAI=async(found)=>{
    try{
      const prompt=`Você é especialista em prospecção B2B. A empresa é ${lead.nome} do setor ${lead.setor}. 
Sugira os 5 principais cargos/perfis de decisão de marketing que provavelmente existem nesta empresa, com nomes fictícios verossímeis para o contexto brasileiro, cargo preciso e uma dica de onde encontrar esta pessoa.
Responda APENAS JSON sem markdown: [{"nome":"...","cargo":"...","dica":"...","linkedin_busca":"..."}]`;
      const r=await claudeFetch({model:"claude-sonnet-4-20250514",max_tokens:600,messages:[{role:"user",content:prompt}]});
      const d=await r.json();
      const txt=(d.content&&d.content[0]&&d.content[0].text)||"[]";
      const sugs=JSON.parse(txt.replace(/\`\`\`json|\`\`\`/g,"").trim());
      setAiSuggestions(sugs);
      setEnrichLog(prev=>prev+" IA sugeriu "+sugs.length+" perfis adicionais.");
    }catch(e){setEnrichLog(prev=>prev+" (IA indisponível)");}
    setEnriching(false);
  };

  const addSuggestion=(s)=>{
    const d={nome:s.nome,cargo:s.cargo,email:"",wa:"",li:s.linkedin_busca||"",aiSuggested:true,addedAt:new Date().toLocaleDateString("pt-BR")};
    onAccUpdate({...acc,decisors:[...(acc.decisors||[]),d]});
    setAiSuggestions(prev=>prev.filter(x=>x.nome!==s.nome));
  };
  // Auto-enrich when no decisors yet
  useEffect(()=>{
    if((acc.decisors||[]).length===0 && !enriching){
      doEnrich();
    }
  },[lead.rank]);

  const syncDeal=async()=>{if(!pdKey)return;const deal=await createDeal(lead.nome,grupo.name,pdKey);if(deal)onAccUpdate({...acc,pdDealId:deal.id});};

  // Insight state
  const [insight,setInsight]=useState("");
  const [insightLoading,setInsightLoading]=useState(false);

  const loadInsight=async()=>{
    setInsightLoading(true);
    const t=await getSectorInsight(lead.nome,setor,grupo.name,grupo.desc);
    setInsight(t);
    setInsightLoading(false);
  };

  // Auto-load insight on first visit
  useEffect(()=>{
    if(!insight&&!insightLoading) loadInsight();
  },[lead.rank,grupo.id]);

  // Auto-contact: registers activity when clicking email/WA/LinkedIn
  const autoContact=async(dc,tipo,tipoLabel,url)=>{
    window.open(url,"_blank");
    const tmap={email:"✉ Email",whatsapp:"💬 WhatsApp",linkedin:"in LinkedIn"};
    const a={type:tipo,typeLabel:tmap[tipo]||tipo,decisor:dc.nome,note:"Contato via "+tipoLabel,date:new Date().toLocaleDateString("pt-BR"),synced:false};
    const newActs=[...(acc.activities||[]),a];
    onAccUpdate({...acc,activities:newActs});
    if(onActivitySaved) await onActivitySaved(lead.nome,tipo,tmap[tipo]||tipo,dc.nome,"Contato via "+tipoLabel);
  };
  const updDec=(i,f,v)=>{const a=[...(acc.decisors||[])];a[i]={...a[i],[f]:v};onAccUpdate({...acc,decisors:a});};
  const rmDec=i=>{const a=[...(acc.decisors||[])];a.splice(i,1);onAccUpdate({...acc,decisors:a});};

  const ResBanner=()=>isRestricted?(
    <div className="res-banner">
      <div className="res-icon">⚠</div>
      <div className="res-body">
        <div className="res-title">LEAD RESTRITO — Conflito de cliente</div>
        <div className="res-desc">Este anunciante é concorrente direto de um cliente ativo de {grupo.name}. Prossiga com cautela e valide com liderança antes de qualquer abordagem.</div>
        <div className="res-tags">{restrictions.map((r,i)=><span key={i} className="rtag">{r.reason}</span>)}</div>
      </div>
    </div>
  ):null;

  const renderTab=()=>{
    if(tab==="overview") return(
      <div>
        <ResBanner/>
        <div className="acctop">
          <div><div className="accname">{lead.nome}</div><div className="accmeta">Rank #{lead.rank} · {setor} · <span style={{color:fitColor(fit),fontSize:8,background:`rgba(${hexRgb(fitColor(fit))},.08)`,border:`1px solid rgba(${hexRgb(fitColor(fit))},.2)`,padding:"1px 6px",borderRadius:100}}>{fitLabel(fit)}</span>{isRestricted&&<span className="restag" style={{marginLeft:6}}>RESTRITO</span>}</div></div>
          <div className="btnrow">
            <button className="btn btno btnsm" onClick={runMon} disabled={monLoading}>{monLoading?"...":"◉ Monitorar"}</button>
            <button className="btn btnp btnsm" style={{background:grupo.color}} onClick={()=>setTab("decisores")}>+ Decisor</button>
          </div>
        </div>
        {/* INSIGHT */}
        {(insight||insightLoading)&&(
          <div className="insight-card" style={{marginBottom:16}}>
            <div className="insight-badge">💡 INSIGHT DE SETOR</div>
            {insightLoading?<div className="stxt">Analisando {setor}...</div>:<div className="insight-body">{insight}</div>}
          </div>
        )}

        <div className="g3">
          <div className="card"><div className="clbl">DECISORES</div><div className="cval">{(acc.decisors||[]).length}</div><div className="csub">cadastrados</div></div>
          <div className="card"><div className="clbl">CONTATADOS</div><div className="cval" style={{color:grupo.color}}>{[...new Set((acc.activities||[]).map(a=>a.decisor).filter(Boolean))].length}</div><div className="csub">decisores</div></div>
          <div className="card"><div className="clbl">ÚLTIMO CONTATO</div><div className="cval" style={{fontSize:12}}>{acc.activities&&acc.activities.length>0?acc.activities[acc.activities.length-1].date:"—"}</div><div className="csub">{acc.activities&&acc.activities.length>0?acc.activities[acc.activities.length-1].typeLabel:"sem contato"}</div></div>
        </div>

        <div className="sec">DECISORES — ÁLBUM</div>
        {(acc.decisors||[]).length===0?(

// ─── STORAGE (localStorage — works on Vercel) ────────────────────────────────
function uid(){return Math.random().toString(36).slice(2,10);}
function today(){return new Date().toISOString().slice(0,10);}
function nowStr(){return new Date().toLocaleString("pt-BR");}

// Shared = stored with "shared_" prefix, readable by all on same browser
// In production all users share the same Vercel domain so localStorage is shared
async function sharedGet(key){
  try{const v=localStorage.getItem("ghub_sh_"+key);return v?JSON.parse(v):null;}catch{return null;}
}
async function sharedSet(key,val){
  try{localStorage.setItem("ghub_sh_"+key,JSON.stringify(val));}catch{}
}
async function personalGet(key){
  try{const v=localStorage.getItem("ghub_me_"+key);return v?JSON.parse(v):null;}catch{return null;}
}
async function personalSet(key,val){
  try{if(val===null){localStorage.removeItem("ghub_me_"+key);}else{localStorage.setItem("ghub_me_"+key,JSON.stringify(val));}}catch{}
}

// ─── LOGIN SCREEN ─────────────────────────────────────────────────────────────
function LoginScreen({onLogin}){
  const [mode,setMode]=useState("login");// login | invite
  const [name,setName]=useState("");
  const [pass,setPass]=useState("");
  const [invCode,setInvCode]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  const doLogin=async()=>{
    setErr("");setLoading(true);
    const users=await sharedGet("users")||{};
    // Admin bootstrap
    if(Object.keys(users).length===0){
      const adminId=uid();
      const admin={id:adminId,name:"Admin",pass:"galeria2024",role:"admin",empresas:GRUPO.map(g=>g.id),createdAt:nowStr()};
      users[adminId]=admin;
      await sharedSet("users",users);
    }
    const user=Object.values(users).find(u=>u.name.toLowerCase()===name.toLowerCase()&&u.pass===pass);
    if(!user){setErr("Nome ou senha incorretos.");setLoading(false);return;}
    await personalSet("session",{uid:user.id,name:user.name,role:user.role,empresas:user.empresas});
    onLogin(user);
    setLoading(false);
  };

  const doInvite=async()=>{
    setErr("");setLoading(true);
    const invites=await sharedGet("invites")||{};
    const inv=Object.values(invites).find(i=>i.code===invCode&&!i.used);
    if(!inv){setErr("Código de convite inválido ou já usado.");setLoading(false);return;}
    if(!name||!pass){setErr("Preencha nome e senha.");setLoading(false);return;}
    const users=await sharedGet("users")||{};
    const exists=Object.values(users).find(u=>u.name.toLowerCase()===name.toLowerCase());
    if(exists){setErr("Este nome já está em uso.");setLoading(false);return;}
    const newUid=uid();
    users[newUid]={id:newUid,name,pass,role:"member",empresas:inv.empresas||[],createdAt:nowStr()};
    await sharedSet("users",users);
    inv.used=true;inv.usedBy=name;inv.usedAt=nowStr();
    await sharedSet("invites",invites);
    await personalSet("session",{uid:newUid,name,role:"member",empresas:inv.empresas||[]});
    onLogin(users[newUid]);
    setLoading(false);
  };

  const s={input:{width:"100%",background:"#111",border:"1px solid #1e1e1e",borderRadius:4,padding:"10px 12px",color:"#eee",fontFamily:"DM Mono,monospace",fontSize:12,outline:"none",marginBottom:10}};
  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#060606"}}>
      <div style={{width:"100%",maxWidth:360,padding:32,background:"#0e0e0e",border:"1px solid #1e1e1e",borderRadius:10}}>
        <div style={{marginBottom:24,textAlign:"center"}}>
          <div style={{fontSize:22,fontWeight:800,letterSpacing:-1,marginBottom:4}}>GALERIA HOLDING</div>
          <div style={{fontSize:10,fontFamily:"DM Mono,monospace",color:"#333",letterSpacing:2}}>CENTRAL COMERCIAL</div>
        </div>
        <div style={{display:"flex",gap:0,marginBottom:20}}>
          {[["login","Entrar"],["invite","Usar convite"]].map(([m,l])=>(
            <button key={m} onClick={()=>setMode(m)} style={{flex:1,padding:"8px 0",border:"1px solid "+(mode===m?"#E8C97A":"#1e1e1e"),borderRadius:m==="login"?"4px 0 0 4px":"0 4px 4px 0",background:mode===m?"rgba(232,201,122,.08)":"transparent",color:mode===m?"#E8C97A":"#444",fontSize:10,fontFamily:"DM Mono,monospace",cursor:"pointer",letterSpacing:.5}}>{l}</button>
          ))}
        </div>
        {mode==="invite"&&<input style={s.input} placeholder="Código de convite" value={invCode} onChange={e=>setInvCode(e.target.value)}/>}
        <input style={s.input} placeholder="Seu nome" value={name} onChange={e=>setName(e.target.value)}/>
        <input style={{...s.input,marginBottom:16}} type="password" placeholder="Senha" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(mode==="login"?doLogin():doInvite())}/>

      </div>

    </div></div>
  );

    id:uid(),

    time:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
    userId:curUser.id,
    userName:curUser.name,
    empresa,
    grupoName,
    tipo,tipoLabel,
    decisor:decisor||"",
    nota:nota||""
  };
  // Save to shared log
  const log=await sharedGet("activities_log")||[];
  log.push(entry);
  if(log.length>2000) log.splice(0,log.length-2000);

  // Sync to Pipedrive if key present
  if(pdKey) await createActivity(null,tipoLabel+" — "+empresa+" ("+grupoName+")",nota,pdKey);
  return entry;
}

  var togSel=function(rank){setSel(function(s){return Object.assign({},s,{[rank]:!s[rank]});});};
  var selTop=function(){var ns={};getTop50(grupo).filter(function(l){return!checkRes(l,grupo.id).length;}).slice(0,5).forEach(function(l){ns[l.rank]=true;});setSel(ns);};
  var openBatch=function(){var sl=leads.filter(function(l){return sel[l.rank];});setQueue(sl);if(sl.length)setEmailModal(sl[0]);};

  return(
    <div style={{padding:"28px 32px",overflowY:"auto",height:"100%"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
        <div>
          <div style={{fontSize:22,fontWeight:800,fontFamily:"'Syne',sans-serif"}}>Disparo em Lote</div>
          <div style={{fontSize:11,color:"#555",fontFamily:"DM Mono,monospace",marginTop:4}}>Selecione leads e dispare múltiplos emails</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn btno btnsm" onClick={selTop}>⚡ Sugerir Top 5</button>
          {nSel>0&&<button className="btn btnp btnsm" style={{background:grupo.color,color:"#000"}} onClick={openBatch}>✉ Disparar {nSel} emails</button>}
        </div>
      </div>
      <div style={{background:"rgba("+grupo.rgb+",.04)",border:"1px solid rgba("+grupo.rgb+",.15)",borderRadius:8,padding:14,marginBottom:18}}>
        <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:grupo.color,letterSpacing:1,marginBottom:8}}>🤖 FILA SUGERIDA — maior fit sem restrição</div>
        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          {getTop50(grupo).filter(function(l){return!checkRes(l,grupo.id).length;}).slice(0,5).map(function(l){return(
            <button key={l.rank} onClick={function(){togSel(l.rank);}} style={{padding:"5px 11px",borderRadius:5,border:"1px solid "+(sel[l.rank]?grupo.color:"#1e1e1e"),background:sel[l.rank]?"rgba("+grupo.rgb+",.08)":"transparent",color:sel[l.rank]?grupo.color:"#666",fontSize:11,cursor:"pointer"}}>#{l.rank} {l.nome}</button>
          );})}
        </div>
      </div>
      <div style={{maxHeight:420,overflowY:"auto"}}>
        {leads.map(function(l){
          var res=checkRes(l,grupo.id);var isRes=res.length>0;
          var accK=grupo.id+"_"+l.rank;var hasDec=accs[accK]&&accs[accK].decisors&&accs[accK].decisors.length;
          return(
            <div key={l.rank} className="batch-row">
              <div className={"bcheck"+(sel[l.rank]?" on":"")} onClick={function(){if(!isRes)togSel(l.rank);}}>
                {sel[l.rank]&&"✓"}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:600}}>{l.nome} {isRes&&<span className="restag">RESTRITO</span>}</div>
                <div style={{fontSize:10,color:"#444",fontFamily:"DM Mono,monospace"}}>{l.setor} · #{l.rank}{hasDec?" · "+hasDec+" decisor(es)":""}</div>
              </div>
              <button className="btn btno btnsm" onClick={function(){setEmailModal(l);}}>✉</button>
            </div>
          );
        })}
      </div>
      {emailModal&&(
        <EmailModal
          dc={accs[grupo.id+"_"+emailModal.rank]&&accs[grupo.id+"_"+emailModal.rank].decisors&&accs[grupo.id+"_"+emailModal.rank].decisors[0]||null}
          empresa={emailModal.nome} setor={emailModal.setor} grupo={grupo} hist="" restrictions={checkRes(emailModal,grupo.id)}
          onClose={function(){var rem=queue.filter(function(l){return l.rank!==emailModal.rank;});if(rem.length){setQueue(rem);setEmailModal(rem[0]);}else{setEmailModal(null);setQueue([]);}}}
          onSent={function(){if(onActivitySaved)onActivitySaved(emailModal.nome,"email","✉ Email","","Email de lote");}}
        />
      )}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App(){
  const [curUser,setCurUser]=useState(null);
  const [sessionLoading,setSessionLoading]=useState(true);
  const [curGrupo,setCurGrupo]=useState(GRUPO[0]);
  const [curLead,setCurLead]=useState(null);
  const [sbQ,setSbQ]=useState("");
  const [fitFil,setFitFil]=useState("all");
  const [accs,setAccs]=useState({});
  const [pdKey,setPdKey]=useState("");
  const [cfgOpen,setCfgOpen]=useState(false);
  const [cfgPD,setCfgPD]=useState("");
  const [resOpen,setResOpen]=useState(false);
  const [adminOpen,setAdminOpen]=useState(false);
  const [dashOpen,setDashOpen]=useState(false);
  const [viewMode,setViewMode]=useState('accounts'); // accounts | holding | batch
  const [secFil,setSecFil]=useState('all');

  // Restore session
  useEffect(()=>{(async()=>{
    const sess=await personalGet("session");
    if(sess){
      // Verify user still exists
      const users=await sharedGet("users")||{};
      const u=users[sess.uid];
      if(u){
        setCurUser(u);
        const a=await personalGet("accs_"+sess.uid)||{};
        const p=await personalGet("pd_"+sess.uid)||"";
        setAccs(a);setPdKey(p);
      }
    }
    setSessionLoading(false);
  })();},[]);

  const onLogin=async(user)=>{
    setCurUser(user);
    const a=await personalGet("accs_"+user.id)||{};
    const p=await personalGet("pd_"+user.id)||"";
    setAccs(a);setPdKey(p);
  };

  const logout=async()=>{await personalSet("session",null);setCurUser(null);setAccs({});setPdKey("");};

  // Quarterly reminder
  const lastReview=loadSt("ghub_res_review",null);
  const showReminder=!lastReview||(new Date()-new Date(lastReview))>(90*24*60*60*1000);

  const saveAccs=useCallback(async(newAccs)=>{
    setAccs(newAccs);
    if(curUser) await personalSet("accs_"+curUser.id,newAccs);
  },[curUser]);

  const savePD=async(key)=>{
    setPdKey(key);
    if(curUser) await personalSet("pd_"+curUser.id,key);
  };

  useEffect(()=>{
    document.documentElement.style.setProperty("--tc",curGrupo.color);
    document.documentElement.style.setProperty("--tcr",curGrupo.rgb);
  },[curGrupo]);

  // Filter grupos by user permissions
  const allowedGrupos=useMemo(()=>curUser?GRUPO.filter(g=>(curUser.empresas||[]).includes(g.id)):[]  ,[curUser]);

  const sectors=useMemo(()=>{const s=new Set();PROSP.forEach(l=>s.add(l.setor));return["all",...Array.from(s).sort()];}, []);

  const filtered=useMemo(()=>{
    if(!curUser) return [];
    var cg=safeCurGrupo||GRUPO[0];
    return PROSP.filter(d=>{
      const fit=cg.fit(d.setor||"");
      const res=checkRes(d,cg.id);
      if(fitFil==="restrito"&&res.length===0)return false;
      if(fitFil==="crm"&&!accs[cg.id+"_"+d.rank])return false;
      if(fitFil==="alto"&&fit!=="alto")return false;
      if(fitFil==="medio"&&fit!=="medio")return false;
      if(secFil!=="all"&&d.setor!==secFil)return false;
      if(sbQ&&!d.nome.includes(sbQ.toUpperCase()))return false;
      return true;
    });
  },[safeCurGrupo,fitFil,secFil,sbQ,accs,curUser]);

  const accKey=(g,r)=>g.id+"_"+r;
  const getAcc=()=>curLead?accs[accKey(curGrupo,curLead.rank)]||{decisors:[],activities:[],intel:null,alerts:[],pdDealId:null}:{};
  const setAcc=v=>saveAccs({...accs,[accKey(curGrupo,curLead.rank)]:v});

  // Wrap saveActivity to also log globally
  const onActivitySaved=async(empresa,tipo,tipoLabel,decisor,nota)=>{
    if(curUser) await logActivity(curUser,empresa,curGrupo.name,tipo,tipoLabel,decisor,nota,pdKey);
  };

  if(sessionLoading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#060606",color:"#333",fontFamily:"DM Mono,monospace",fontSize:11}}>Carregando...</div>;
  if(!curUser) return <LoginScreen onLogin={onLogin}/>;

  // If no allowed grupos, show message
  if(allowedGrupos.length===0) return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#060606",color:"#555",fontFamily:"DM Mono,monospace",fontSize:11,flexDirection:"column",gap:12}}>
      <div>Sua conta não tem acesso a nenhuma empresa do grupo.</div>
      <button onClick={logout} style={{padding:"6px 14px",borderRadius:3,border:"1px solid #1e1e1e",background:"transparent",color:"#555",fontSize:10,fontFamily:"DM Mono,monospace",cursor:"pointer"}}>Sair</button>
    </div>
  );

  // Ensure curGrupo is allowed
  const safeCurGrupo=allowedGrupos.find(g=>g.id===curGrupo.id)||allowedGrupos[0];
  if(safeCurGrupo.id!==curGrupo.id){setCurGrupo(safeCurGrupo);setCurLead(null);}

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
      {cfgOpen&&(<div className="modov"><div className="mod">
        <div className="modtitle">⚙ Configurações</div>
        <div className="frow"><div className="flbl">PIPEDRIVE API KEY</div><input className="finp" type="password" placeholder="api key do pipedrive" value={cfgPD} onChange={e=>setCfgPD(e.target.value)}/></div>
        <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"#333",marginTop:4,marginBottom:12}}>Claude, Hunter.io e Lusha já configurados. Pipedrive para sync de CRM.</div>
        <div className="modacts"><button className="btn btno btnsm" onClick={()=>setCfgOpen(false)}>Cancelar</button><button className="btn btnp btnsm" style={{background:curGrupo.color}} onClick={()=>{savePD(cfgPD);setCfgOpen(false);}}>Salvar</button></div>
      </div></div>)}
      {resOpen&&<RestrictionsPanel onClose={()=>setResOpen(false)}/>}
      {adminOpen&&curUser.role==="admin"&&<AdminPanel curUser={curUser} onClose={()=>setAdminOpen(false)}/>}
      {dashOpen&&<Dashboard curUser={curUser} accs={accs} onClose={()=>setDashOpen(false)}/>}

      {showReminder&&(
        <div className="reminder" style={{padding:"8px 16px"}}>
          <span style={{fontSize:13}}>📅</span>
          <div className="reminder-txt">Revisão trimestral de restrições pendente.</div>
          <button className="reminder-btn" onClick={()=>setResOpen(true)}>Ver restrições</button>
          <button className="reminder-btn" style={{borderColor:"rgba(255,181,71,.2)",color:"#555"}} onClick={()=>saveSt("ghub_res_review",new Date().toISOString())}>Dispensar</button>
        </div>
      )}

      {/* TOPBAR */}
      <div className="topbar">
        <div className="brand"><div className="bdot" style={{background:curGrupo.color}}></div><span className="bname" style={{color:curGrupo.color}}>HOLDING</span></div>
        <div className="tabs-row">
          {allowedGrupos.map(g=>(
            <div key={g.id} className={"ctab"+(safeCurGrupo.id===g.id?" on":"")} style={{"--tc":g.color}} onClick={()=>{setCurGrupo(g);setCurLead(null);}}>
              <div className="tdot" style={{background:g.color}}></div>
              <span className="tname" style={safeCurGrupo.id===g.id?{color:g.color}:{}}>{g.name}</span>
            </div>
          ))}
        </div>
        <div className="tb-right">
          <div className="api-chip"><div className="apdot" style={{background:"#00FF94"}}></div><span>HUNTER</span></div>
          <div className="api-chip"><div className="apdot" style={{background:pdKey?"#00FF94":"#2a2a2a"}}></div><span>PIPEDRIVE</span></div>
          <button className="tbtn" onClick={()=>{setViewMode("holding");setCurLead(null);}}>🏢 Holding</button>
          <button className="tbtn" onClick={()=>{setViewMode("batch");setCurLead(null);}}>✉ Lote</button>
          <button className="tbtn green" onClick={()=>exportMailing(accs,safeCurGrupo)}>↓ Mailing</button>
          <button className="tbtn blue" onClick={()=>setDashOpen(true)}>📊 Dash</button>
          {curUser.role==="admin"&&<button className="tbtn purple" onClick={()=>setAdminOpen(true)}>👥 Time</button>}
          <button className="resbtn" onClick={()=>setResOpen(true)}>⚠</button>
          <button className="cfgbtn" onClick={()=>{setCfgPD(pdKey);setCfgOpen(true);}}>⚙</button>
          <div style={{display:"flex",alignItems:"center",gap:6,paddingLeft:8,borderLeft:"1px solid #181818"}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:"#181818",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:"#E8C97A"}}>{curUser.name[0].toUpperCase()}</div>
            <span style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"#555"}}>{curUser.name}</span>
            <button onClick={logout} style={{padding:"2px 7px",borderRadius:3,border:"1px solid #1e1e1e",background:"transparent",color:"#333",fontSize:8,fontFamily:"DM Mono,monospace",cursor:"pointer"}}>sair</button>
          </div>
        </div>
      </div>

      {/* WORKSPACE */}
      {viewMode==="holding"?(
      <div className="ws"><HoldingView/></div>
    ):viewMode==="batch"?(
      <div className="ws"><div className="main" style={{"--tc":safeCurGrupo.color,"--tcr":safeCurGrupo.rgb}}><div style={{flex:1,overflow:"auto"}}><BatchView grupo={safeCurGrupo} accs={accs} curUser={curUser} pdKey={pdKey} onActivitySaved={onActivitySaved}/></div></div></div>
    ):(
    <div className="ws">
        <div className="sb" style={{"--tc":safeCurGrupo.color,"--tcr":safeCurGrupo.rgb}}>
          <div className="sbhead">
          <span className="sbtitle">ANUNCIANTES</span>
          <span className="sbcnt">{filtered.length}</span>
        </div>
          <div className="sbsearch"><input placeholder="Buscar empresa..." value={sbQ} onChange={e=>setSbQ(e.target.value)}/></div>
          <div className="sbfil">
            {[["all","TODOS"],["alto","FIT ALTO"],["medio","FIT MED"],["crm","NO CRM"],["restrito","RESTRITOS"]].map(([f,l])=>(
              <button key={f} className={"fb"+(fitFil===f?" on":"")+(f==="restrito"?" res":"")} onClick={()=>setFitFil(f)}>{l}</button>
            ))}
          </div>
          <div className="sblist">
            {filtered.slice(0,200).map(d=>{
              const fit=safeCurGrupo.fit(d.setor||"");
              const fc=fitColor(fit);
              const res=checkRes(d,safeCurGrupo.id);
              const isRes=res.length>0;
              const isSel=curLead&&curLead.rank===d.rank;
              const hasCrm=!!accs[accKey(safeCurGrupo,d.rank)];
              return(
                <div key={d.rank+d.nome} className={"coitem"+(isSel?" sel":"")+(isRes?" restricted":"")} onClick={()=>setCurLead(d)}>
                  <span className="corank">{d.rank}</span>
                  <div className="cobody">
                    <div className="coname">{d.nome}{isRes&&<span style={{fontSize:7,marginLeft:5,color:"#FF4757"}}>●</span>}</div>
                    <div className="cosec">{d.setor}{isRes&&<span style={{color:"rgba(255,71,87,.6)",marginLeft:4,fontSize:7}}>conflito</span>}</div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                    {isRes?<span className="restag">RESTRITO</span>:<span className="fittag" style={{background:`rgba(${hexRgb(fc)},.08)`,color:fc,border:`1px solid rgba(${hexRgb(fc)},.2)`}}>{fitLabel(fit)}</span>}
                    {hasCrm&&<div className="crmdot"></div>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="main" style={{"--tc":safeCurGrupo.color,"--tcr":safeCurGrupo.rgb}}>
          {curLead?(
            <AgentView
              key={safeCurGrupo.id+"_"+curLead.rank}
              grupo={safeCurGrupo}
              lead={curLead}
              acc={getAcc()}
              pdKey={pdKey}
              curUser={curUser}
              onAccUpdate={setAcc}
              onActivitySaved={onActivitySaved}
              accs={accs}
            />
          ):(
            <>
              <div className="subtabs"></div>
              <div className="panel"><div className="empty"><div className="emptyicon">◎</div><div style={{fontSize:16,fontWeight:800}}>{safeCurGrupo.name}</div><div style={{fontSize:10,fontFamily:"DM Mono,monospace",maxWidth:220,lineHeight:1.7,textAlign:"center"}}>{safeCurGrupo.desc}<br/><br/>Selecione um anunciante para começar a prospecção.</div></div></div>
            </>
          )}
        </div>
      </div>
    </div>
    )}
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
