// ─── CHECK RESTRICTION ────────────────────────────────────────────────────────
function checkRestrictions(lead, groupId, customRestrictions=[]) {
  const allRes = [...RESTRICTIONS, ...customRestrictions];
  const matched = allRes.filter(r => {
    if (!r.agencies.includes(groupId)) return false;
    // Check expiry
    if (r.expiresAt) {
      const exp = new Date(r.expiresAt);
      if (exp < new Date()) return false; // expired, no longer restricted
    }
    return r.keywords.some(kw => lead.nome.toUpperCase().includes(kw.toUpperCase()));
  });
  return matched;
}

// ─── DEC CARD ─────────────────────────────────────────────────────────────────
function DecCard({dc,empresa,setor,grupo,isEditing,onToggleEdit,onUpdate,onRemove,pdKey,restrictions}){
  const [pdStatus,setPdStatus]=useState(null);
  const [pdLoading,setPdLoading]=useState(false);
  const [showEmail,setShowEmail]=useState(false);
  const [verifying,setVerifying]=useState(false);
  const verifyEmail=async()=>{if(!dc.email)return;setVerifying(true);const v=await hunterVerify(dc.email);if(v)onUpdate("emailStatus",v.result);setVerifying(false);};
  const syncPD=async()=>{if(!pdKey||!dc.email)return;setPdLoading(true);const ex=await pipedriveSearch(dc.email,pdKey);setPdStatus(ex?"exists":(await pipedriveCreate(dc,empresa,pdKey))?"ok":"error");setPdLoading(false);};
  const stC={"ok":"#34D399","invalid":"#FF4757","risky":"#FFB547","unknown":"#555","exists":"#A78BFA"};
  return(
    <>
      {showEmail&&<EmailModal dc={dc} empresa={empresa} setor={setor} grupo={grupo} angulo={grupo.angles[0]} hist="" restrictions={restrictions} onClose={()=>setShowEmail(false)}/>}
      <div className="deccard">
        <div className="decav" style={{background:`rgba(${grupo.rgb},.1)`,color:grupo.color}}>{initials(dc.nome||"?")}</div>
        <div className="decinfo">
          <div className="decname">{dc.nome||"Nome não informado"}</div>
          <div className="deccargo">{dc.cargo||"Cargo não informado"}</div>
          <div className="dectags">
            <span className={"dt"+(dc.email?" dtok":"")}>✉ {dc.email||"sem email"}{dc.emailStatus&&<span style={{fontSize:8,padding:"1px 4px",borderRadius:8,background:stC[dc.emailStatus]||"#222",color:"#000",marginLeft:4}}>{dc.emailStatus}</span>}</span>
            <span className={"dt"+(dc.wa?" dtok":"")}>💬 {dc.wa||"sem WA"}</span>
          </div>
        </div>
        <div className="decacts">
          {dc.email&&<button className="btn btno btnsm" onClick={()=>setShowEmail(true)}>✉ Email IA</button>}
          {dc.wa&&<button className="btn btno btnsm" onClick={()=>window.open("https://wa.me/"+dc.wa.replace(/\D/g,""),"_blank")}>💬</button>}
          {dc.li&&<button className="btn btno btnsm" onClick={()=>window.open(dc.li.startsWith("http")?dc.li:"https://"+dc.li,"_blank")}>in</button>}
          {dc.email&&!dc.emailStatus&&<button className="btn btno btnsm" onClick={verifyEmail} disabled={verifying}>{verifying?"...":"Validar"}</button>}
          {pdKey&&dc.email&&<button className="btn btno btnsm" onClick={syncPD} disabled={pdLoading} style={{color:"#A78BFA",borderColor:"rgba(167,139,250,.3)"}}>{pdLoading?"...":pdStatus==="exists"?"No Pipe":pdStatus==="ok"?"Criado!":"Pipedrive"}</button>}
          <button className="btn btno btnsm" onClick={onToggleEdit}>{isEditing?"Fechar":"Editar"}</button>
          <button className="btn btnsm" onClick={onRemove} style={{background:"rgba(255,71,87,.08)",color:"#FF4757",border:"1px solid rgba(255,71,87,.2)"}}>✕</button>
        </div>
      </div>
      {isEditing&&(
        <div style={{background:"#0a0a0a",border:"1px solid #181818",borderRadius:4,padding:12,marginBottom:8}}>
          <div className="g2">{[["nome","Nome"],["cargo","Cargo"],["email","Email"],["wa","WhatsApp"]].map(([f,pl])=>(
            <div className="frow" key={f}><div className="flbl">{pl}</div><input className="finp" placeholder={pl} value={dc[f]||""} onChange={e=>onUpdate(f,e.target.value)}/></div>
          ))}</div>

        </div>
      )}
    </>
  );
}

  const runMon=async()=>{setMonLoading(true);const al=await gerarAlertas(lead.nome,setor,grupo);onAccUpdate({...acc,alerts:[...(acc.alerts||[]),...al.map(a=>({...a,date:new Date().toLocaleDateString("pt-BR")})) ]});setMonLoading(false);};
  const saveAct=async()=>{const tmap={email:"✉ Email",call:"📞 Ligação",whatsapp:"💬 WhatsApp",linkedin:"in LinkedIn",meeting:"🤝 Reunião",response:"↩ Resposta"};const a={type:actType,typeLabel:tmap[actType]||actType,decisor:actDec,note:actNote,date:new Date().toLocaleDateString("pt-BR"),synced:false};const newActs=[...(acc.activities||[]),a];onAccUpdate({...acc,activities:newActs});if(pdKey){await createActivity(acc.pdDealId,tmap[actType]+" — "+lead.nome,actNote,pdKey);a.synced=true;}setActModal(false);setActNote("");if(newActs.length>=3&&newActs.length%3===0)setTimeout(genIntel,800);};
  const saveDec=async()=>{if(!newDec.nome)return;const d={...newDec,addedAt:new Date().toLocaleDateString("pt-BR")};onAccUpdate({...acc,decisors:[...(acc.decisors||[]),d]});if(pdKey)await pipedriveCreate(d,lead.nome,pdKey);setDecModal(false);setNewDec({nome:"",cargo:"",email:"",wa:"",li:""});};

  const updDec=(i,f,v)=>{const a=[...(acc.decisors||[])];a[i]={...a[i],[f]:v};onAccUpdate({...acc,decisors:a});};
  const rmDec=i=>{const a=[...(acc.decisors||[])];a.splice(i,1);onAccUpdate({...acc,decisors:a});};

      </div>

  const renderTab=()=>{
    if(tab==="overview") return(
      <div>
        <ResBanner/>

          <button className="btn btno" onClick={runMon} disabled={monLoading}>{monLoading?"Monitorando...":"◉ Monitorar empresa"}</button>
        </div>
        {acc.alerts&&acc.alerts.length>0&&(
          <><div className="sec">ALERTAS</div>
          {[...(acc.alerts||[])].reverse().slice(0,5).map((a,i)=>{
            const ug=a.urgency==="change"?"🔄":a.urgency==="risk"?"⚠️":"📌";
            const bc=a.urgency==="change"?"rgba(255,181,71,.08)":"rgba(0,255,148,.04)";
            const tc=a.urgency==="change"?"#FFB547":"#00FF94";
            return(<div className="monitem" key={i} style={{borderColor:bc}}><div style={{fontSize:16,flexShrink:0}}>{ug}</div><div className="monbody"><div className="montitle">{a.title}</div><div className="mondesc">{a.desc}</div><div className="montime">{a.date}</div></div><span className="monbadge" style={{color:tc,border:`1px solid ${bc}`,background:bc}}>{a.urgency==="change"?"MUDANÇA":"NOVO"}</span></div>);
          })}</>
        )}
      </div>
    );
  };

  return(
    <>
      {actModal&&(<div className="modov"><div className="mod">
        <div className="modtitle">+ Registrar Atividade</div>
        <div className="frow"><div className="flbl">TIPO</div><select className="finp" value={actType} onChange={e=>setActType(e.target.value)}>{[["email","✉ Email enviado"],["call","📞 Ligação"],["whatsapp","💬 WhatsApp"],["linkedin","in LinkedIn DM"],["meeting","🤝 Reunião"],["response","↩ Resposta recebida"]].map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></div>
        <div className="frow"><div className="flbl">DECISOR</div><select className="finp" value={actDec} onChange={e=>setActDec(e.target.value)}><option value="">— Geral / Empresa —</option>{(acc.decisors||[]).map((d,i)=><option key={i}>{d.nome}</option>)}</select></div>
        <div className="frow"><div className="flbl">NOTA</div><textarea className="finp" placeholder="O que aconteceu? Próximo passo..." value={actNote} onChange={e=>setActNote(e.target.value)}/></div>
        <div className="modacts"><button className="btn btno btnsm" onClick={()=>setActModal(false)}>Cancelar</button><button className="btn btnp btnsm" style={{background:grupo.color}} onClick={saveAct}>Registrar + Sync CRM</button></div>
      </div></div>)}
      {decModal&&(<div className="modov"><div className="mod">
        <div className="modtitle">+ Adicionar Decisor</div>
        <div className="g2"><div className="frow"><div className="flbl">NOME</div><input className="finp" placeholder="Nome completo" value={newDec.nome} onChange={e=>setNewDec(d=>({...d,nome:e.target.value}))}/></div><div className="frow"><div className="flbl">CARGO</div><input className="finp" placeholder="CMO, VP Marketing..." value={newDec.cargo} onChange={e=>setNewDec(d=>({...d,cargo:e.target.value}))}/></div></div>
        <div className="g2"><div className="frow"><div className="flbl">EMAIL</div><input className="finp" placeholder="nome@empresa.com" value={newDec.email} onChange={e=>setNewDec(d=>({...d,email:e.target.value}))}/></div><div className="frow"><div className="flbl">WHATSAPP</div><input className="finp" placeholder="+55 11 99999-9999" value={newDec.wa} onChange={e=>setNewDec(d=>({...d,wa:e.target.value}))}/></div></div>
        <div className="frow"><div className="flbl">LINKEDIN URL</div><input className="finp" placeholder="linkedin.com/in/..." value={newDec.li} onChange={e=>setNewDec(d=>({...d,li:e.target.value}))}/></div>
        <div className="modacts"><button className="btn btno btnsm" onClick={()=>setDecModal(false)}>Cancelar</button><button className="btn btnp btnsm" style={{background:grupo.color}} onClick={saveDec}>Salvar + Pipedrive</button></div>
      </div></div>)}
      <div className="subtabs">{tabs.map(([id,lbl])=><div key={id} className={"st"+(tab===id?" on":"")} onClick={()=>setTab(id)}>{lbl}</div>)}</div>
      <div className="panel">{renderTab()}</div>
    </>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App(){
  const [curGrupo,setCurGrupo]=useState(GRUPO[0]);
  const [curLead,setCurLead]=useState(null);
  const [sbQ,setSbQ]=useState("");
  const [fitFil,setFitFil]=useState("all");
  const [accs,setAccs]=useState(()=>loadSt("ghub_accs",{}));
  const [pdKey,setPdKey]=useState(()=>loadSt("ghub_pd",""));
  const [cfgOpen,setCfgOpen]=useState(false);
  const [cfgPD,setCfgPD]=useState("");
  const [resOpen,setResOpen]=useState(false);

  // Quarterly reminder
  const lastReview=loadSt("ghub_res_review",null);
  const showReminder=!lastReview||(new Date()-new Date(lastReview))>(90*24*60*60*1000);

  useEffect(()=>{saveSt("ghub_accs",accs);},[accs]);
  useEffect(()=>{saveSt("ghub_pd",pdKey);},[pdKey]);
  useEffect(()=>{
    document.documentElement.style.setProperty("--tc",curGrupo.color);
    document.documentElement.style.setProperty("--tcr",curGrupo.rgb);
  },[curGrupo]);

  const filtered=useMemo(()=>PROSP.filter(d=>{
    const fit=curGrupo.fit(d.setor||"");
    const res=checkRestrictions(d,curGrupo.id);
    if(fitFil==="restrito"&&res.length===0)return false;
    if(fitFil==="crm"&&!accs[curGrupo.id+"_"+d.rank])return false;
    if(fitFil==="alto"&&fit!=="alto")return false;
    if(fitFil==="medio"&&fit!=="medio")return false;
    if(sbQ&&!d.nome.includes(sbQ.toUpperCase()))return false;
    return true;
  }),[curGrupo,fitFil,sbQ,accs]);

  const accKey=(g,r)=>g.id+"_"+r;
  const getAcc=()=>curLead?accs[accKey(curGrupo,curLead.rank)]||{decisors:[],activities:[],intel:null,alerts:[],pdDealId:null}:{};
  const setAcc=v=>setAccs(a=>({...a,[accKey(curGrupo,curLead.rank)]:v}));

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
      {cfgOpen&&(<div className="modov"><div className="mod">
        <div className="modtitle">⚙ Configurações</div>
        <div className="frow"><div className="flbl">PIPEDRIVE API KEY</div><input className="finp" type="password" placeholder="api key do pipedrive" value={cfgPD} onChange={e=>setCfgPD(e.target.value)}/></div>
        <div style={{fontSize:9,fontFamily:"DM Mono,monospace",color:"#333",marginTop:4,marginBottom:12}}>Hunter.io e Lusha já configurados. Pipedrive opcional para sync de CRM.</div>
        <div className="modacts"><button className="btn btno btnsm" onClick={()=>setCfgOpen(false)}>Cancelar</button><button className="btn btnp btnsm" style={{background:curGrupo.color}} onClick={()=>{setPdKey(cfgPD);setCfgOpen(false);}}>Salvar</button></div>
      </div></div>)}
      {resOpen&&<RestrictionsPanel onClose={()=>setResOpen(false)}/>}

      {/* QUARTERLY REMINDER BANNER */}
      {showReminder&&(
        <div className="reminder" style={{padding:"10px 18px"}}>
          <span style={{fontSize:14}}>📅</span>
          <div className="reminder-txt">Revisão trimestral de restrições pendente — confirme se os clientes e conflitos ainda estão ativos.</div>
          <button className="reminder-btn" onClick={()=>setResOpen(true)}>Ver restrições</button>
          <button className="reminder-btn" style={{borderColor:"rgba(255,181,71,.2)",color:"#555"}} onClick={()=>saveSt("ghub_res_review",new Date().toISOString())}>Dispensar</button>
        </div>
      )}

      {/* TOPBAR */}
      <div className="topbar">
        <div className="brand"><div className="bdot" style={{background:curGrupo.color}}></div><span className="bname" style={{color:curGrupo.color}}>HOLDING</span></div>
        <div className="tabs-row">
          {GRUPO.map(g=>(
            <div key={g.id} className={"ctab"+(curGrupo.id===g.id?" on":"")} style={{"--tc":g.color}} onClick={()=>{setCurGrupo(g);setCurLead(null);}}>
              <div className="tdot" style={{background:g.color}}></div>
              <span className="tname" style={curGrupo.id===g.id?{color:g.color}:{}}>{g.name}</span>
            </div>
          ))}
        </div>
        <div className="tb-right">
          <div className="api-chip"><div className="apdot" style={{background:"#00FF94"}}></div><span>HUNTER</span></div>
          <div className="api-chip"><div className="apdot" style={{background:pdKey?"#00FF94":"#2a2a2a"}}></div><span>PIPEDRIVE</span></div>
          <button className="resbtn" onClick={()=>setResOpen(true)}>⚠ Restrições</button>
          <button className="cfgbtn" onClick={()=>{setCfgPD(pdKey);setCfgOpen(true);}}>⚙ Config</button>
        </div>
      </div>

      {/* WORKSPACE */}
      <div className="ws">
        <div className="sb" style={{"--tc":curGrupo.color,"--tcr":curGrupo.rgb}}>
          <div className="sbhead"><span className="sbtitle">ANUNCIANTES</span><span className="sbcnt">{filtered.length}</span></div>
          <div className="sbsearch"><input placeholder="Buscar empresa..." value={sbQ} onChange={e=>setSbQ(e.target.value)}/></div>
          <div className="sbfil">
            {[["all","TODOS"],["alto","FIT ALTO"],["medio","FIT MED"],["crm","NO CRM"],["restrito","RESTRITOS"]].map(([f,l])=>(
              <button key={f} className={"fb"+(fitFil===f?" on":"")+(f==="restrito"?" res":"")} onClick={()=>setFitFil(f)}>{l}</button>
            ))}
          </div>
          <div className="sblist">
            {filtered.slice(0,200).map(d=>{
              const fit=curGrupo.fit(d.setor||"");
              const fc=fitColor(fit);
              const res=checkRestrictions(d,curGrupo.id);
              const isRes=res.length>0;
              const isSel=curLead&&curLead.rank===d.rank;
              const hasCrm=!!accs[accKey(curGrupo,d.rank)];
              return(
                <div key={d.rank+d.nome} className={"coitem"+(isSel?" sel":"")+(isRes?" restricted":"")} onClick={()=>setCurLead(d)}>
                  <span className="corank">{d.rank}</span>
                  <div className="cobody">
                    <div className="coname">{d.nome}{isRes&&<span style={{fontSize:7,marginLeft:5,color:"#FF4757"}}>●</span>}</div>
                    <div className="cosec">{d.setor}{isRes&&<span style={{color:"rgba(255,71,87,.6)",marginLeft:4,fontSize:7}}>conflito</span>}</div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                    {isRes?<span className="restag">RESTRITO</span>:<span className="fittag" style={{background:`rgba(${hexRgb(fc)},.08)`,color:fc,border:`1px solid rgba(${hexRgb(fc)},.2)`}}>{fitLabel(fit)}</span>}
                    {hasCrm&&<div className="crmdot"></div>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="main" style={{"--tc":curGrupo.color,"--tcr":curGrupo.rgb}}>
          {curLead?(
            <AgentView key={curGrupo.id+"_"+curLead.rank} grupo={curGrupo} lead={curLead} acc={getAcc()} pdKey={pdKey} onAccUpdate={setAcc}/>
          ):(
            <>
              <div className="subtabs"></div>
              <div className="panel"><div className="empty"><div className="emptyicon">◎</div><div style={{fontSize:16,fontWeight:800}}>{curGrupo.name}</div><div style={{fontSize:10,fontFamily:"DM Mono,monospace",maxWidth:220,lineHeight:1.7,textAlign:"center"}}>{curGrupo.desc}<br/><br/>Selecione um anunciante para começar a prospecção.</div></div></div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
