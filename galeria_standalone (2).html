async function hunterSearch(domain){try{const r=await fetch(`https://api.hunter.io/v2/domain-search?domain=${domain}&api_key=${HUNTER_KEY}&limit=10`);const d=await r.json();return(d.data&&d.data.emails)||[];}catch{return[];}}

async function lushaSearch(fn,ln,company){try{const r=await fetch(`https://api.lusha.com/v2/person?firstName=${encodeURIComponent(fn)}&lastName=${encodeURIComponent(ln)}&company=${encodeURIComponent(company)}`,{headers:{"api_key":LUSHA_KEY}});const d=await r.json();const p=(d.data&&d.data.phoneNumbers)||[];return p.length>0?p[0].internationalNumber||p[0].localNumber||"":" ";}catch{return "";}}

async function pipedriveCreate(contact,empresa,key){try{const r=await fetch(`https://api.pipedrive.com/v1/persons?api_token=${key}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:contact.nome,email:[{value:contact.email,primary:true}],phone:[{value:contact.tel||"",primary:true}],org_name:empresa,job_title:contact.cargo||""})});const d=await r.json();return d.data||null;}catch{return null;}}

async function gerarEmail(nome,empresa,agencia,trigger,cargo){
  const posicionamentos={"Galeria":"Somos o parceiro de operação em escala para os maiores anunciantes do Brasil — capacidade operacional + inteligência estratégica. Nossos clientes reduzem em média 30% o custo por entrega mantendo consistência criativa.","404":"Somos um hub de inovação em comunicação sem vínculo com veículos de mídia — o que recomendamos é o que faz sentido pro seu negócio, sem agenda escondida. Criatividade + design + tecnologia para construir comunidades em torno da marca.","Mila":"Somos uma case factory — trabalhamos com 8 contas selecionadas, todas com histórias que o mercado inteiro comenta. Para marcas que querem excelência criativa sem a burocracia de uma grande operação.","Caramelo":"Criamos ativos de entretenimento, música e cultura — algo que a marca possui, não aluga. O oposto da mídia paga: fazemos as pessoas virem até a marca."};
  const prompt=`Você é Pedro, Head of Growth da Galeria Holding, escrevendo um email de prospecção de alto nível.

DESTINATÁRIO: ${nome} | Empresa: ${empresa} | Cargo: ${cargo||"Diretor(a) de Marketing"}
AGÊNCIA: ${agencia} | POSICIONAMENTO: ${posicionamentos[agencia]||posicionamentos["Galeria"]}
TRIGGER: ${trigger}

INSTRUÇÕES:
1. Assunto: curto, intrigante, personalizado. Max 8 palavras.
2. Abertura: algo específico sobre ${empresa} ou o trigger. 1-2 frases.
3. Corpo: conecta a dor/oportunidade da ${empresa} com o que a ${agencia} faz. 2-3 frases concretas.
4. Prova: 1 frase com resultado relevante.
5. CTA: simples, sem pressão, convite para 20 minutos.
6. Assinatura: Pedro | Head of Growth, Galeria Holding

TOM: Direto, humano, sem corporativês. Parágrafos curtos com linha em branco entre eles.
Retorne APENAS JSON: {"assunto":"...","corpo":"..."}`;

  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:prompt}]})});
  const d=await r.json();
  const txt=d.content&&d.content[0]&&d.content[0].text||"{}";
  return JSON.parse(txt.replace(/```json|```/g,"").trim());
}

function EmailModal({contact,empresa,agencia,trigger,onClose}){

  const [copied,setCopied]=useState("");
  const [regen,setRegen]=useState(false);
  const gerar=()=>{setRegen(true);gerarEmail(contact.nome,empresa,agencia,trigger,contact.cargo).then(setEmail).catch(()=>setEmail({assunto:"Erro — verifique conexao.",corpo:""})).finally(()=>{setLoading(false);setRegen(false);});};

    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:16}}>

            <button onClick={onClose} style={{background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:22}}>x</button>

          <div style={{padding:"20px 24px"}}>
            <div style={{marginBottom:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{fontSize:11,fontWeight:600,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.05em"}}>Assunto</div>
                <button onClick={()=>cp(email.assunto,"assunto")} style={{fontSize:10,padding:"3px 8px",borderRadius:6,border:"none",background:copied==="assunto"?"#16a34a":"#1e293b",color:copied==="assunto"?"#fff":"#64748b",cursor:"pointer"}}>{copied==="assunto"?"Copiado!":"Copiar"}</button>
              </div>
              <input style={{...inp,fontWeight:600,fontSize:14}} value={email.assunto} onChange={e=>setEmail(em=>({...em,assunto:e.target.value}))}/>
            </div>
            <div style={{marginBottom:20}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{fontSize:11,fontWeight:600,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.05em"}}>Corpo</div>
                <div style={{fontSize:10,color:"#374151"}}>{(email.corpo||"").split(" ").length} palavras</div>
              </div>
              <textarea style={{...dinp,width:"100%",minHeight:220,resize:"vertical",fontSize:13,lineHeight:1.8}} value={email.corpo} onChange={e=>setEmail(em=>({...em,corpo:e.target.value}))}/>

              <div style={{fontSize:10,color:"#9ca3af",marginBottom:8}}>PREVIEW</div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <button onClick={()=>cp(email.corpo,"corpo")} style={{padding:"10px 0",borderRadius:10,border:"1px solid #334155",background:copied==="corpo"?"#16a34a":"#1e293b",color:copied==="corpo"?"#fff":"#94a3b8",fontSize:12,cursor:"pointer",fontWeight:600}}>{copied==="corpo"?"Copiado!":"Copiar corpo"}</button>
              <button onClick={()=>cp("Assunto: "+email.assunto+"\n\n"+email.corpo,"tudo")} style={{padding:"10px 0",borderRadius:10,border:"1px solid #334155",background:copied==="tudo"?"#16a34a":"#1e293b",color:copied==="tudo"?"#fff":"#94a3b8",fontSize:12,cursor:"pointer",fontWeight:600}}>{copied==="tudo"?"Copiado!":"Copiar tudo"}</button>
            </div>
            <button onClick={gerar} disabled={regen} style={{width:"100%",padding:"10px 0",borderRadius:10,border:"1px dashed #334155",background:"transparent",color:regen?"#374151":"#64748b",fontSize:12,cursor:"pointer"}}>{regen?"Gerando...":"Gerar versao diferente"}</button>
          </div>
        )}
      </div>
    </div>
  );
}

function DecCard({dc,r,i,empresa,agencia,trigger,isEditing,onToggleEdit,onUpdate,onRemove,pdKey}){
  const [pdStatus,setPdStatus]=useState(null);
  const [pdLoading,setPdLoading]=useState(false);
  const [showEmail,setShowEmail]=useState(false);
  const [verifying,setVerifying]=useState(false);
  const verifyEmail=async()=>{if(!dc.email)return;setVerifying(true);const v=await hunterVerify(dc.email);if(v)onUpdate("emailStatus",v.result);setVerifying(false);};
  const syncPD=async()=>{if(!pdKey||!dc.email)return;setPdLoading(true);const ex=await pipedriveSearch(dc.email,pdKey);if(ex){setPdStatus("exists");}else{const cr=await pipedriveCreate(dc,empresa,pdKey);setPdStatus(cr?"ok":"error");}setPdLoading(false);};
  const stColors={"ok":"#4ade80","invalid":"#f87171","risky":"#fbbf24","unknown":"#6b7280","exists":"#a78bfa"};
  return(
    <>
      {showEmail&&<EmailModal contact={dc} empresa={empresa} agencia={agencia} trigger={trigger} onClose={()=>setShowEmail(false)}/>}
      <div style={{background:"#1e293b",borderRadius:10,padding:12,marginBottom:8,border:"1px solid #334155"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
          <div>
            <div style={{fontSize:13,fontWeight:600,color:"#e2e8f0"}}>{dc.nome||"Nome nao informado"}</div>
            <div style={{fontSize:11,color:"#64748b",marginTop:1}}>{dc.cargo||"Cargo nao informado"}</div>
          </div>
          <button style={abS("ed")} onClick={onToggleEdit}>{isEditing?"Fechar":"Editar"}</button>
        </div>
        {isEditing&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            {[["nome","Nome"],["cargo","Cargo"],["email","Email"],["tel","WhatsApp"],["li","linkedin.com/in/..."]].map(([f,pl],fi)=>(
              <input key={f} style={{...dinp,...(fi===4?{gridColumn:"1/-1"}:{})}} placeholder={pl} value={dc[f]||""} onChange={e=>onUpdate(f,e.target.value)}/>
            ))}
          </div>
        )}
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6,alignItems:"center"}}>
          {dc.email?<a style={abS("em")} href={"mailto:"+dc.email}>Email{dc.emailStatus&&<span style={{fontSize:9,padding:"1px 5px",borderRadius:10,background:stColors[dc.emailStatus]||"#374151",color:"#fff",marginLeft:4}}>{dc.emailStatus}</span>}</a>:<span style={{...abS("em"),opacity:.3}}>Email</span>}
          {dc.tel?<a style={abS("wp")} href={"https://wa.me/"+dc.tel.replace(/\D/g,"")}>WhatsApp</a>:<span style={{...abS("wp"),opacity:.3}}>WhatsApp</span>}
          {dc.li?<a style={abS("li")} href={dc.li.startsWith("http")?dc.li:"https://"+dc.li} target="_blank">LinkedIn</a>:<span style={{...abS("li"),opacity:.3}}>LinkedIn</span>}
          {dc.email&&<button style={abS("ai")} onClick={()=>setShowEmail(true)}>Gerar Email IA</button>}
          {dc.email&&!dc.emailStatus&&<button style={{...abS("ed"),fontSize:10}} onClick={verifyEmail} disabled={verifying}>{verifying?"...":"Validar"}</button>}
          {pdKey&&dc.email&&<button style={{...abS("pd"),fontSize:10}} onClick={syncPD} disabled={pdLoading}>{pdLoading?"...":pdStatus==="exists"?"Ja no Pipe":pdStatus==="ok"?"Criado!":"Pipedrive"}</button>}
          <button style={abS("rm")} onClick={onRemove}>Remover</button>
        </div>
      </div>
    </>
  );
}

function App(){
  const [aba,setAba]=useState("p");
  const [busca,setBusca]=useState("");
  const [agFil,setAgFil]=useState("Todas");
  const [tierFil,setTierFil]=useState("Todos");
  const [sel,setSel]=useState({});
  const [exp,setExp]=useState({});
  const [expd,setExpd]=useState({});
  const [decs,setDecs]=useState({});
  const [exported,setExported]=useState(false);
  const [enriching,setEnriching]=useState({});
  const [pdKey,setPdKey]=useState("");
  const [showSettings,setShowSettings]=useState(false);
  const [enrichLog,setEnrichLog]=useState({});

  const base=aba==="p"?PROSP:NEWS;
  const lista=useMemo(()=>base.filter(d=>{
    if(aba==="p"&&agFil!=="Todas"&&d.ag!==agFil)return false;
    if(aba==="p"&&tierFil!=="Todos"&&d.tier!==tierFil)return false;
    if(busca&&!d.nome.includes(busca.toUpperCase()))return false;
    return true;
  }),[base,agFil,tierFil,busca]);

  const nSel=Object.values(sel).filter(Boolean).length;
  const nDec=Object.keys(decs).filter(k=>decs[k]&&decs[k].length>0).length;
  const nA=PROSP.filter(d=>d.tier==="Tier A").length;

  const togSel=r=>setSel(s=>({...s,[r]:!s[r]}));
  const selAll=()=>{const ns={};lista.forEach(d=>{ns[d.rank]=true;});setSel(ns);};
  const selNone=()=>setSel({});
  const togExp=r=>{setExp(e=>({...e,[r]:!e[r]}));setDecs(dd=>dd[r]?dd:{...dd,[r]:[]});};
  const togEd=k=>setExpd(e=>({...e,[k]:!e[k]}));
  const addDec=r=>{setDecs(dd=>({...dd,[r]:[...(dd[r]||[]),{nome:"",cargo:"",email:"",tel:"",li:""}]}));setExp(e=>({...e,[r]:true}));};
  const updDec=(r,i,f,v)=>setDecs(dd=>{const a=[...(dd[r]||[])];a[i]={...a[i],[f]:v};return{...dd,[r]:a};});
  const rmDec=(r,i)=>setDecs(dd=>{const a=[...(dd[r]||[])];a.splice(i,1);return{...dd,[r]:a};});

  const enrich=async(r,nome)=>{
    const domain=getDomain(nome);
    setExp(e=>({...e,[r]:true}));
    if(!domain){setEnrichLog(l=>({...l,[r]:{status:"Dominio nao mapeado. Use + Adicionar.",cors:false}}));return;}
    setEnriching(e=>({...e,[r]:true}));
    setEnrichLog(l=>({...l,[r]:{status:"Buscando decisores de marketing..."}}));
    try{
      const emails=await hunterSearch(domain);
      const mkKw=["cmo","chief marketing","marketing","brand","comunicacao","media","midia","vp market","diretor de market","gerente de market","head de market"];
      const filtered=emails.filter(e=>mkKw.some(k=>(e.position||"").toLowerCase().includes(k)));
      const src=filtered.length>0?filtered:emails.slice(0,5);
      setEnrichLog(l=>({...l,[r]:{status:`${src.length} contatos encontrados. Buscando telefones no Lusha...`}}));
      const novos=await Promise.all(src.slice(0,6).map(async e=>{
        const fn=(e.first_name||"").trim(),ln=(e.last_name||"").trim();
        const tel=fn&&ln?await lushaSearch(fn,ln,nome):"";
        return{nome:(fn+" "+ln).trim(),cargo:e.position||"",email:e.value||"",tel,li:e.linkedin||"",emailStatus:e.verification&&e.verification.result||null};
      }));
      setDecs(dd=>{const ex=dd[r]||[];const m=[...ex];novos.forEach(n=>{if(!m.some(x=>x.email===n.email))m.push(n);});return{...dd,[r]:m};});
      setEnrichLog(l=>({...l,[r]:{status:`Concluido! ${novos.length} decisores adicionados.`,ok:true}}));
    }catch(e){
      setEnrichLog(l=>({...l,[r]:{status:"CORS bloqueou — use os links abaixo:",cors:true,domain,nome}}));
    }
    setEnriching(e=>({...e,[r]:false}));
  };

  const exportar=()=>{
    const para=nSel>0?lista.filter(d=>sel[d.rank]):lista;
    const q=v=>String(v||"").replace(/,/g," ");
    const rows=["ranking,empresa,agencia,tier,trigger,decisor_nome,decisor_cargo,email,telefone,linkedin"];
    para.forEach(d=>{const dd=decs[d.rank]||[];if(!dd.length)rows.push([d.rank,q(d.nome),q(d.ag),q(d.tier),q(d.trig),"","","","",""].join(","));else dd.forEach(dc=>rows.push([d.rank,q(d.nome),q(d.ag),q(d.tier),q(d.trig),q(dc.nome),q(dc.cargo),q(dc.email),q(dc.tel),q(dc.li)].join(",")));});
    const blob=new Blob(["\uFEFF"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="galeria_decisores.csv";a.click();
    setExported(true);setTimeout(()=>setExported(false),2500);
  };

  return(
    <div style={{maxWidth:760,margin:"0 auto"}}>
      {showSettings&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:16}}>
          <div style={{background:"#111827",borderRadius:16,padding:24,width:"100%",maxWidth:420,border:"1px solid #374151"}}>
            <div style={{fontWeight:700,fontSize:15,marginBottom:16}}>Configuracoes</div>
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,color:"#9ca3af",marginBottom:4}}>Pipedrive API Key</div>
              <input style={inp} placeholder="Cole sua API key do Pipedrive" value={pdKey} onChange={e=>setPdKey(e.target.value)}/>
              <div style={{fontSize:10,color:"#4b5563",marginTop:3}}>app.pipedrive.com/settings/api</div>
            </div>
            <div style={{fontSize:11,color:"#374151",marginBottom:16}}>Hunter e Lusha ja configurados.</div>
            <button style={{width:"100%",padding:"10px 0",borderRadius:10,border:"none",background:"#f97316",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}} onClick={()=>setShowSettings(false)}>Salvar e fechar</button>
          </div>
        </div>
      )}

      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <div style={{width:40,height:40,borderRadius:10,background:"#f97316",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:18,flexShrink:0}}>G</div>
        <div><div style={{fontWeight:700,fontSize:16}}>Galeria Holding</div><div style={{fontSize:12,color:"#6b7280"}}>Motor de prospeccao omnicanal</div></div>
        <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:11,color:pdKey?"#4ade80":"#6b7280"}}>{pdKey?"Pipedrive on":"Pipedrive off"}</span>
          <button onClick={()=>setShowSettings(true)} style={{padding:"6px 12px",borderRadius:8,border:"1px solid #374151",background:"#1f2937",color:"#9ca3af",fontSize:11,cursor:"pointer"}}>Config</button>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:16}}>
        {[[PROSP.length,"Prospeccao","#fb923c"],[NEWS.length,"Newsletter","#facc15"],[nDec,"Com decisores","#4ade80"],[nA,"Tier A","#fb923c"]].map(([v,l,c])=>(
          <div key={l} style={{background:"#111827",borderRadius:12,padding:"12px 8px",textAlign:"center"}}>
            <div style={{fontSize:20,fontWeight:700,color:c}}>{v}</div>
            <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{l}</div>
          </div>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
        {[["p","Prospeccao ("+PROSP.length+")","Blitz omnicanal"],["n","Newsletter ("+NEWS.length+")","Clientes da holding"]].map(([id,tt,ts])=>(
          <button key={id} style={{padding:12,borderRadius:12,border:"1px solid "+(aba===id?"#f97316":"#374151"),background:aba===id?"rgba(249,115,22,0.1)":"#111827",cursor:"pointer",textAlign:"left",color:"#fff",width:"100%"}} onClick={()=>{setAba(id);setSel({});setExp({});}}>
            <div style={{fontSize:13,fontWeight:600}}>{tt}</div>
            <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{ts}</div>
          </button>
        ))}
      </div>

      <div style={{background:"#111827",borderRadius:16,padding:16,marginBottom:12}}>
        <input style={inp} placeholder="Buscar empresa..." value={busca} onChange={e=>setBusca(e.target.value)}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,margin:"10px 0"}}>
          <div><div style={{fontSize:11,color:"#9ca3af",marginBottom:4}}>Agencia</div><select style={inp} value={agFil} onChange={e=>setAgFil(e.target.value)}>{["Todas","Galeria","404","Mila","Caramelo"].map(o=><option key={o}>{o}</option>)}</select></div>
          <div><div style={{fontSize:11,color:"#9ca3af",marginBottom:4}}>Prioridade</div><select style={inp} value={tierFil} onChange={e=>setTierFil(e.target.value)}>{["Todos","Tier A","Tier B","Tier C"].map(o=><option key={o}>{o}</option>)}</select></div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginTop:10}}>
          <button style={{padding:"7px 14px",borderRadius:8,border:"none",background:"#1f2937",color:"#d1d5db",fontSize:12,cursor:"pointer"}} onClick={selAll}>Sel. todos</button>
          <button style={{padding:"7px 14px",borderRadius:8,border:"none",background:"#1f2937",color:"#d1d5db",fontSize:12,cursor:"pointer"}} onClick={selNone}>Limpar</button>
          {nSel>0&&<span style={{fontSize:12,color:"#fb923c",fontWeight:700}}>{nSel} selecionados</span>}
          <button style={{padding:"9px 18px",borderRadius:10,border:"none",background:exported?"#16a34a":"#f97316",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",marginLeft:"auto"}} onClick={exportar}>{exported?"Baixado!":"Exportar CSV ("+(nSel>0?nSel:lista.length)+")"}</button>
        </div>
      </div>

      <div style={{maxHeight:640,overflowY:"auto"}}>
        {lista.slice(0,300).map(d=>{
          const r=d.rank,isSel=!!sel[r],isEx=!!exp[r],dd=decs[r]||[],hd=dd.length>0,log=enrichLog[r];
          return(
            <div key={r} style={{borderRadius:12,marginBottom:5,background:"#111827",border:"1px solid "+(isSel?"rgba(249,115,22,0.4)":"transparent"),overflow:"hidden"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",flexWrap:"wrap"}}>
                <div onClick={()=>togSel(r)} style={{width:16,height:16,borderRadius:4,border:"2px solid "+(isSel?"#f97316":"#4b5563"),background:isSel?"#f97316":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer",fontSize:10,color:"#fff"}}>{isSel?"v":""}</div>
                <span style={{fontSize:11,color:"#4b5563",width:28,textAlign:"right",flexShrink:0}}>#{r}</span>
                <span onClick={()=>togSel(r)} style={{fontSize:13,fontWeight:500,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",cursor:"pointer",minWidth:80}}>{d.nome}</span>
                {aba==="p"?<span style={{fontSize:11,fontWeight:600,flexShrink:0,color:agC[d.ag]||"#9ca3af"}}>{d.ag}</span>:<span style={{fontSize:11,fontWeight:600,flexShrink:0,color:"#facc15"}}>Radar</span>}
                <span style={{fontSize:10,padding:"2px 8px",borderRadius:20,flexShrink:0,background:aba==="n"?"rgba(161,98,7,.5)":tBg[d.tier],color:aba==="n"?"#fde047":tCr[d.tier]}}>{aba==="n"?"Cliente":d.tier}</span>
                <button style={{padding:"4px 10px",borderRadius:6,border:"none",background:hd?"rgba(249,115,22,0.15)":"#1f2937",color:hd?"#fb923c":"#9ca3af",fontSize:11,cursor:"pointer",flexShrink:0}} onClick={()=>togExp(r)}>{hd?"Dec. ("+dd.length+")":"+ Dec."}</button>
                <button onClick={()=>enrich(r,d.nome)} disabled={!!enriching[r]} style={{padding:"4px 10px",borderRadius:6,border:"none",background:"rgba(96,165,250,0.15)",color:enriching[r]?"#6b7280":"#60a5fa",fontSize:11,cursor:"pointer",flexShrink:0}}>{enriching[r]?"...":"Enriquecer"}</button>
              </div>
              {isEx&&(
                <div style={{background:"#0f172a",borderTop:"1px solid #1e293b",padding:14}}>
                  {log&&(
                    <div style={{background:log.ok?"rgba(74,222,128,0.05)":"rgba(96,165,250,0.05)",border:"1px solid "+(log.ok?"rgba(74,222,128,0.2)":"rgba(96,165,250,0.2)"),borderRadius:8,padding:10,marginBottom:12,fontSize:11,color:log.ok?"#4ade80":"#94a3b8"}}>
                      {log.status}
                      {log.cors&&(
                        <div style={{marginTop:8,display:"flex",gap:6,flexWrap:"wrap"}}>
                          <a href={"https://app.hunter.io/domain-search?domain="+(log.domain||"")} target="_blank" style={{padding:"5px 10px",borderRadius:7,background:"rgba(96,165,250,0.15)",color:"#60a5fa",border:"1px solid rgba(96,165,250,0.3)",fontSize:10,fontWeight:600}}>Hunter.io</a>
                          <a href={"https://app.lusha.com/search?company="+encodeURIComponent(log.nome||"")} target="_blank" style={{padding:"5px 10px",borderRadius:7,background:"rgba(74,222,128,0.15)",color:"#4ade80",border:"1px solid rgba(74,222,128,0.3)",fontSize:10,fontWeight:600}}>Lusha</a>
                          <a href={"https://www.linkedin.com/search/results/people/?keywords="+encodeURIComponent(log.nome||"")+"&titleFreeText=CMO+OR+%22Diretor+de+Marketing%22+OR+%22VP+Marketing%22+OR+%22Gerente+de+Marketing%22"} target="_blank" style={{padding:"5px 10px",borderRadius:7,background:"rgba(56,189,248,0.15)",color:"#38bdf8",border:"1px solid rgba(56,189,248,0.3)",fontSize:10,fontWeight:600}}>LinkedIn</a>
                        </div>
                      )}
                    </div>
                  )}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                    <span style={{fontSize:12,fontWeight:600,color:"#94a3b8"}}>Decisores — {d.nome}</span>
                    <button style={{padding:"5px 12px",borderRadius:7,border:"none",background:"#f97316",color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer"}} onClick={()=>addDec(r)}>+ Adicionar</button>
                  </div>
                  {!dd.length?<div style={{textAlign:"center",padding:16,fontSize:12,color:"#475569"}}>Clique em Enriquecer para buscar automaticamente.</div>
                    :dd.map((dc,i)=>(
                      <DecCard key={i} dc={dc} r={r} i={i} empresa={d.nome} agencia={d.ag} trigger={d.trig} pdKey={pdKey}
                        isEditing={!!expd[r+"-"+i]}
                        onToggleEdit={()=>togEd(r+"-"+i)}
                        onUpdate={(f,v)=>updDec(r,i,f,v)}
                        onRemove={()=>rmDec(r,i)}/>
                    ))
                  }
                </div>
              )}
            </div>
          );
        })}
        {lista.length>300&&<div style={{textAlign:"center",fontSize:12,color:"#4b5563",padding:10}}>+{lista.length-300} resultados</div>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
